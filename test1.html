<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Audio Cold Start Test V2</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    position:fixed;
    left:0;
    top:0;
    right:0;
    bottom:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background:#20242a;
    color:#fff;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

button{
    appearance:none;
    -webkit-appearance:none;
    border:0;
    outline:none;
    margin:0;

    touch-action:manipulation;

    color:#fff;
    font-size:15px;
    font-weight:700;

    border-radius:12px;

    min-height:54px;
    padding:10px 12px;

    box-shadow:
        0 3px 0 #252b31,
        inset 0 1px 0 rgba(255,255,255,.12);
}

button:active{
    transform:translateY(2px);
    box-shadow:
        0 1px 0 #252b31,
        inset 0 1px 0 rgba(255,255,255,.12);
}

.page{
    width:min(92vw,520px);
    height:100%;
    max-height:100%;

    padding:
        max(20px,env(safe-area-inset-top))
        20px
        max(20px,env(safe-area-inset-bottom))
        20px;

    display:flex;
    flex-direction:column;
    gap:12px;

    overflow:hidden;
}

.page2{
    display:none;
}

h1{
    flex:none;
    margin:2px 0 0;

    text-align:center;
    font-size:25px;
}

.subtitle{
    flex:none;
    text-align:center;
    font-size:13px;
    line-height:1.45;
    opacity:.65;
}

.status{
    flex:none;

    padding:11px 13px;

    border-radius:12px;

    background:#11151a;
    border:1px solid #39414a;

    font-size:12px;
    line-height:1.65;
}

.status strong{
    color:#ffd36a;
}

.section{
    flex:none;

    padding:12px;

    border-radius:14px;

    background:#292f36;
    border:1px solid #424a54;
}

.section-title{
    font-size:14px;
    font-weight:700;
    margin-bottom:9px;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.web{
    background:#365d78;
}

.kenney{
    background:#685434;
}

.bgm{
    background:#53664a;
}

.nav{
    background:#51485f;
}

.test{
    background:#496044;
}

.reset{
    background:#693e3e;
}

.result{
    margin-top:8px;

    padding:8px 10px;

    border-radius:9px;

    background:#171b20;

    font-size:12px;
    line-height:1.45;
}

.success{
    color:#8fd18f;
}

.fail{
    color:#ff9a9a;
}

.warn{
    color:#ffd36a;
}

.log{
    flex:1;
    min-height:80px;

    overflow:auto;

    padding:9px;

    border-radius:12px;

    background:#11151a;
    border:1px solid #39414a;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

    font-size:11px;
    line-height:1.5;

    -webkit-overflow-scrolling:touch;
}

.log-row{
    padding:2px 0;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.small{
    margin-top:5px;

    font-size:10px;
    line-height:1.4;

    opacity:.5;
}
</style>
</head>


<body>


<!-- =====================================================
     PAGE 1
===================================================== -->

<div class="page page1">

    <h1>🎧 Audio Cold Start V2</h1>

    <div class="subtitle">
        iPhone PWA · 第一次触屏 · 音频冷启动实验
    </div>


    <div class="status">

        AudioContext：
        <strong id="ctxState">
            尚未创建
        </strong>
        <br>

        click-a.ogg：
        <strong id="clickState">
            加载中
        </strong>
        <br>

        bgm.ogg：
        <strong id="bgmState">
            加载中
        </strong>
        <br>

        当前状态：
        <strong id="interactionState">
            Cold Start
        </strong>

    </div>


    <!-- =================================================
         ① FIRST TOUCH
    ================================================== -->

    <div class="section">

        <div class="section-title">
            ① 第一次 / 后续点击
        </div>

        <div class="buttons">

            <button
                class="web"
                id="webBtn">

                Web Audio
                <br>
                合成音效

            </button>


            <button
                class="kenney"
                id="kenneyBtn">

                Kenney
                <br>
                click-a.ogg

            </button>

        </div>

        <div class="result"
             id="firstResult">

            尚未测试

        </div>

    </div>


    <!-- =================================================
         ② BGM AUTOPLAY
    ================================================== -->

    <div class="section">

        <div class="section-title">
            ② BGM 冷启动自动播放测试
        </div>

        <div class="buttons">

            <button
                class="bgm"
                id="bgmAutoTest">

                测试
                <br>
                BGM 自动播放

            </button>


            <button
                class="bgm"
                id="bgmManualTest">

                手动播放
                <br>
                BGM

            </button>

        </div>

        <div class="result"
             id="bgmResult">

            ⚠️ 真正的“无触摸冷启动”需要重新加载 PWA 后观察。
            <br>
            本按钮本身属于用户手势，因此它测试的是“手动播放”。

        </div>

    </div>


    <!-- =================================================
         ③ PAGE NAVIGATION
    ================================================== -->

    <div class="section">

        <div class="section-title">
            ③ 页面切换
        </div>

        <button
            class="nav"
            id="goPage2"
            style="width:100%;">

            进入第二页 →

        </button>

    </div>


    <!-- =================================================
         LOG
    ================================================== -->

    <div class="section"
         style="display:flex;
                flex-direction:column;
                flex:1;
                min-height:120px;">

        <div class="section-title">
            测试日志
        </div>

        <div class="log"
             id="log">
        </div>

        <button
            class="reset"
            id="clearLog"
            style="width:100%;
                   margin-top:8px;
                   min-height:42px;">

            清除日志

        </button>

    </div>

</div>



<!-- =====================================================
     PAGE 2
===================================================== -->

<div class="page page2">

    <h1>📄 Page 2</h1>

    <div class="subtitle">
        模拟 BoxPusher 的选关 / 设置页面
    </div>


    <div class="status">

        AudioContext：
        <strong id="ctxState2">
            ---
        </strong>

    </div>


    <div class="section">

        <div class="section-title">
            第二页音效
        </div>

        <div class="buttons">

            <button
                class="web"
                id="webBtn2">

                Web Audio

            </button>


            <button
                class="kenney"
                id="kenneyBtn2">

                Kenney

            </button>

        </div>

    </div>


    <div class="section">

        <button
            class="nav"
            id="backPage"
            style="width:100%;">

            ← 返回第一页

        </button>

    </div>


    <div class="log"
         id="page2Log"
         style="flex:1;">

    </div>

</div>



<script>

/* =========================================================
   GLOBAL AUDIO
========================================================= */

let ctx = null;

let masterGain = null;

let audioReady = false;

let firstTouch = true;


/* =========================================================
   AUDIO ELEMENTS
========================================================= */

const clickAudio =
    new Audio("click-a.ogg");

clickAudio.preload =
    "auto";


const bgmAudio =
    new Audio("bgm.ogg");

bgmAudio.preload =
    "auto";

bgmAudio.loop =
    true;

bgmAudio.volume =
    0.55;


/* =========================================================
   DOM
========================================================= */

const ctxState =
    document.getElementById(
        "ctxState"
    );

const ctxState2 =
    document.getElementById(
        "ctxState2"
    );

const clickState =
    document.getElementById(
        "clickState"
    );

const bgmState =
    document.getElementById(
        "bgmState"
    );

const interactionState =
    document.getElementById(
        "interactionState"
    );

const firstResult =
    document.getElementById(
        "firstResult"
    );

const bgmResult =
    document.getElementById(
        "bgmResult"
    );

const logBox =
    document.getElementById(
        "log"
    );

const page2Log =
    document.getElementById(
        "page2Log"
    );


/* =========================================================
   LOG
========================================================= */

function log(
    text,
    cls=""
){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "log-row " + cls;

    row.textContent =
        text;

    logBox.appendChild(
        row
    );

    logBox.scrollTop =
        logBox.scrollHeight;
}


function log2(
    text
){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "log-row";

    row.textContent =
        text;

    page2Log.appendChild(
        row
    );

    page2Log.scrollTop =
        page2Log.scrollHeight;
}


/* =========================================================
   AUDIO CONTEXT
========================================================= */

function createAudioContext(){

    if(ctx){
        return ctx;
    }

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext){

        log(
            "❌ Web Audio 不受支持",
            "fail"
        );

        return null;
    }

    ctx =
        new AudioContext();

    masterGain =
        ctx.createGain();

    masterGain.gain.value =
        0.65;

    masterGain.connect(
        ctx.destination
    );

    updateState();

    log(
        "AudioContext 创建：" +
        ctx.state
    );

    return ctx;
}


/* =========================================================
   IMPORTANT:
   同一用户手势中完成 resume + sound
========================================================= */

async function unlockAndPlayWeb(){

    const c =
        createAudioContext();

    if(!c){
        return;
    }


    /*
       关键修正：

       V1 是：

       resume();
       play();

       两个动作并行。

       V2 改成：

       await resume();
       play();

       确保第一次点击时
       AudioContext 已经进入 running。
    */

    if(c.state !== "running"){

        try{

            await c.resume();

        }catch(error){

            log(
                "❌ resume失败：" +
                error.message,
                "fail"
            );

            return;
        }
    }


    audioReady =
        c.state === "running";

    updateState();


    if(!audioReady){

        log(
            "⚠️ AudioContext 仍不是 running：" +
            c.state,
            "warn"
        );

        return;
    }


    playWebClick();

}


/* =========================================================
   WEB AUDIO CLICK
========================================================= */

function playWebClick(){

    if(!ctx ||
       !masterGain){

        return;
    }

    const now =
        ctx.currentTime;


    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    osc.type =
        "triangle";


    osc.frequency.setValueAtTime(
        760,
        now
    );


    osc.frequency.exponentialRampToValueAtTime(
        1180,
        now + 0.025
    );


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.22,
        now + 0.002
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.055
    );


    osc.connect(
        gain
    );

    gain.connect(
        masterGain
    );


    osc.start(
        now
    );

    osc.stop(
        now + 0.06
    );
}


/* =========================================================
   KENNEY CLICK
========================================================= */

function playKenney(){

    /*
       cloneNode 保证连续快速点击时
       不会强行截断上一声。
    */

    const sound =
        clickAudio.cloneNode(
            true
        );

    sound.volume =
        1;

    sound.currentTime =
        0;


    const promise =
        sound.play();


    if(
        promise &&
        promise.catch
    ){

        promise.catch(
            error=>{

                log(
                    "❌ Kenney play失败：" +
                    error.message,
                    "fail"
                );

            }
        );

    }
}


/* =========================================================
   STATUS
========================================================= */

function updateState(){

    ctxState.textContent =
        ctx
        ? ctx.state
        : "尚未创建";


    ctxState2.textContent =
        ctx
        ? ctx.state
        : "---";


    interactionState.textContent =
        firstTouch
        ? "Cold Start"
        : "Warm";
}


/* =========================================================
   AUDIO FILE LOADING
========================================================= */

clickAudio.addEventListener(
    "canplaythrough",
    ()=>{

        clickState.textContent =
            "已加载";

        log(
            "✓ click-a.ogg 已加载",
            "success"
        );

    }
);


clickAudio.addEventListener(
    "error",
    ()=>{

        clickState.textContent =
            "加载失败";

        log(
            "❌ click-a.ogg 加载失败",
            "fail"
        );

    }
);


bgmAudio.addEventListener(
    "canplaythrough",
    ()=>{

        bgmState.textContent =
            "已加载";

        log(
            "✓ bgm.ogg 已加载",
            "success"
        );

    }
);


bgmAudio.addEventListener(
    "error",
    ()=>{

        bgmState.textContent =
            "加载失败";

        log(
            "❌ bgm.ogg 加载失败",
            "fail"
        );

    }
);


/* =========================================================
   FIRST TOUCH TEST
========================================================= */

async function testWeb(){

    const cold =
        firstTouch;

    const start =
        performance.now();


    await unlockAndPlayWeb();


    const elapsed =
        performance.now() -
        start;


    firstResult.innerHTML =
        cold

        ?

        "❄️ <b>Cold Start</b><br>" +
        "Web Audio：resume + play 完成 " +
        elapsed.toFixed(2) +
        " ms"

        :

        "🔥 <b>Warm</b><br>" +
        "Web Audio：调用完成 " +
        elapsed.toFixed(2) +
        " ms";


    log(
        (cold ? "❄️ COLD" : "🔥 WARM") +
        " · Web Audio · " +
        elapsed.toFixed(2) +
        " ms"
    );


    firstTouch =
        false;

    updateState();
}


/* =========================================================
   KENNEY TEST
========================================================= */

function testKenney(){

    const cold =
        firstTouch;

    const start =
        performance.now();


    playKenney();


    const elapsed =
        performance.now() -
        start;


    firstResult.innerHTML =
        cold

        ?

        "❄️ <b>Cold Start</b><br>" +
        "Kenney OGG：play() 调用 " +
        elapsed.toFixed(2) +
        " ms"

        :

        "🔥 <b>Warm</b><br>" +
        "Kenney OGG：play() 调用 " +
        elapsed.toFixed(2) +
        " ms";


    log(
        (cold ? "❄️ COLD" : "🔥 WARM") +
        " · Kenney OGG · " +
        elapsed.toFixed(2) +
        " ms"
    );


    firstTouch =
        false;

    updateState();
}


/* =========================================================
   BUTTONS
========================================================= */

document
.getElementById(
    "webBtn"
)
.addEventListener(
    "pointerdown",
    ()=>{
        testWeb();
    }
);


document
.getElementById(
    "kenneyBtn"
)
.addEventListener(
    "pointerdown",
    ()=>{
        testKenney();
    }
);


/* =========================================================
   BGM MANUAL TEST
========================================================= */

document
.getElementById(
    "bgmManualTest"
)
.addEventListener(
    "pointerdown",
    async ()=>{

        const start =
            performance.now();


        try{

            await bgmAudio.play();


            const elapsed =
                performance.now() -
                start;


            bgmResult.innerHTML =
                "🟢 <b>手动播放成功</b><br>" +
                "play() Promise 完成：" +
                elapsed.toFixed(2) +
                " ms";


            log(
                "🎵 BGM 手动播放成功 · " +
                elapsed.toFixed(2) +
                " ms",
                "success"
            );


        }catch(error){

            bgmResult.innerHTML =
                "🔴 <b>手动播放失败</b><br>" +
                error.message;


            log(
                "❌ BGM 手动播放失败：" +
                error.message,
                "fail"
            );

        }

    }
);


/* =========================================================
   BGM AUTO TEST
========================================================= */

document
.getElementById(
    "bgmAutoTest"
)
.addEventListener(
    "pointerdown",
    ()=>{

        /*
           这个按钮本身就是用户手势，
           所以这里不能冒充“冷启动自动播放”。

           它只是提醒测试者：
           真正的 autoplay 测试必须在页面
           完全没有用户触摸时进行。
        */

        bgmResult.innerHTML =
            "⚠️ <b>这个按钮不能代表冷启动 autoplay。</b><br>" +
            "请重新加载 PWA 后，完全不要触摸屏幕。" +
            "<br>如果 BGM 自己响起，才算 autoplay 成功。";


        log(
            "⚠️ 请重新冷启动测试 bgm.ogg autoplay",
            "warn"
        );

    }
);


/* =========================================================
   PAGE NAVIGATION
========================================================= */

document
.getElementById(
    "goPage2"
)
.addEventListener(
    "pointerdown",
    ()=>{

        page1ToPage2();

    }
);


function page1ToPage2(){

    document
    .querySelector(".page1")
    .style.display =
        "none";


    document
    .querySelector(".page2")
    .style.display =
        "flex";


    log(
        "→ 进入第二页"
    );


    log2(
        "第二页已打开"
    );

}


/* =========================================================
   BACK
========================================================= */

document
.getElementById(
    "backPage"
)
.addEventListener(
    "pointerdown",
    ()=>{

        document
        .querySelector(".page2")
        .style.display =
            "none";


        document
        .querySelector(".page1")
        .style.display =
            "flex";


        log(
            "← 返回第一页"
        );


        log2(
            "← 返回第一页"
        );

    }
);


/* =========================================================
   PAGE 2 BUTTONS
========================================================= */

document
.getElementById(
    "webBtn2"
)
.addEventListener(
    "pointerdown",
    ()=>{
        testWeb();

        log2(
            "Web Audio 点击"
        );
    }
);


document
.getElementById(
    "kenneyBtn2"
)
.addEventListener(
    "pointerdown",
    ()=>{
        testKenney();

        log2(
            "Kenney 点击"
        );
    }
);


/* =========================================================
   CLEAR LOG
========================================================= */

document
.getElementById(
    "clearLog"
)
.addEventListener(
    "pointerdown",
    ()=>{

        logBox.innerHTML =
            "";

        log(
            "日志已清除"
        );

    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

updateState();


log(
    "================================"
);

log(
    "Audio Cold Start Test V2"
);

log(
    "请重新冷启动 PWA 后进行第一次点击测试"
);

log(
    "Web Audio 与 Kenney 均应在第一次触摸时测试"
);

log(
    "================================"
);


/* =========================================================
   IMPORTANT:
   真正测试 bgm.ogg autoplay
========================================================= */

/*
   页面加载后直接尝试 autoplay。

   这里故意不等待任何用户手势。

   如果 iOS/WebKit 允许：
       bgmAudio.play()
       → 成功

   如果不允许：
       Promise reject

   但某些浏览器可能延迟处理，
   所以同时监听 playing / error。
*/

let autoplayAttempted =
    false;


function attemptColdAutoplay(){

    autoplayAttempted =
        true;


    const promise =
        bgmAudio.play();


    if(
        promise &&
        promise.then
    ){

        promise.then(
            ()=>{

                bgmResult.innerHTML =
                    "🟢 <b>AUTOPLAY SUCCESS</b><br>" +
                    "bgm.ogg 在没有用户触摸的情况下开始播放。";


                log(
                    "🎵 🟢 BGM COLD AUTOPLAY SUCCESS",
                    "success"
                );

            }
        );


        promise.catch(
            error=>{

                bgmResult.innerHTML =
                    "🔴 <b>AUTOPLAY BLOCKED</b><br>" +
                    error.message;


                log(
                    "🎵 🔴 BGM autoplay 被阻止：" +
                    error.message,
                    "warn"
                );

            }
        );

    }
}


bgmAudio.addEventListener(
    "playing",
    ()=>{

        if(
            autoplayAttempted &&
            firstTouch
        ){

            bgmResult.innerHTML =
                "🟢 <b>AUTOPLAY SUCCESS</b><br>" +
                "检测到 bgm.ogg 正在播放。";


            log(
                "🎵 🟢 BGM 正在自动播放",
                "success"
            );

        }

    }
);


/*
   延迟到页面加载完成后尝试，
   仍然没有任何用户触摸。
*/

window.addEventListener(
    "load",
    ()=>{

        setTimeout(
            attemptColdAutoplay,
            300
        );

    }
);

</script>

</body>
</html>
