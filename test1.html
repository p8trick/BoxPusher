<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Audio Cold Start Test V3</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:#20242a;
    color:#fff;
}

body{
    display:flex;
    justify-content:center;
}

button{
    appearance:none;
    -webkit-appearance:none;

    border:0;
    outline:none;

    color:#fff;

    font-size:15px;
    font-weight:700;

    border-radius:12px;

    min-height:52px;
    padding:9px 12px;

    touch-action:manipulation;

    box-shadow:
        0 3px 0 #252b31,
        inset 0 1px 0 rgba(255,255,255,.12);
}

button:active{
    transform:translateY(2px);

    box-shadow:
        0 1px 0 #252b31,
        inset 0 1px 0 rgba(255,255,255,.12);
}

.page{
    width:min(92vw,520px);

    height:100dvh;

    padding:
        max(18px,env(safe-area-inset-top))
        20px
        max(18px,env(safe-area-inset-bottom))
        20px;

    display:flex;
    flex-direction:column;

    gap:10px;

    overflow:hidden;
}

.page2{
    display:none;
}

h1{
    flex:none;

    margin:2px 0 0;

    text-align:center;

    font-size:24px;
}

.subtitle{
    flex:none;

    text-align:center;

    font-size:12px;
    line-height:1.4;

    opacity:.62;
}

.status{
    flex:none;

    padding:10px 12px;

    border-radius:11px;

    background:#11151a;

    border:1px solid #39414a;

    font-size:11px;

    line-height:1.65;
}

.status strong{
    color:#ffd36a;
}

.section{
    flex:none;

    padding:11px;

    border-radius:13px;

    background:#292f36;

    border:1px solid #424a54;
}

.section-title{
    font-size:13px;
    font-weight:700;

    margin-bottom:8px;
}

.buttons{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;
}

.web{
    background:#365d78;
}

.kenney{
    background:#685434;
}

.bgm{
    background:#53664a;
}

.nav{
    background:#51485f;
}

.reset{
    background:#693e3e;
}

.copy{
    background:#496044;
}

.result{
    margin-top:8px;

    padding:8px 9px;

    border-radius:8px;

    background:#171b20;

    font-size:11px;

    line-height:1.45;
}

.success{
    color:#8fd18f;
}

.fail{
    color:#ff9999;
}

.warn{
    color:#ffd36a;
}

/* =====================================================
   LOG
===================================================== */

.log-section{
    flex:1;

    min-height:120px;

    display:flex;
    flex-direction:column;
}

.log{
    flex:1;

    min-height:60px;

    overflow-y:auto;
    overflow-x:hidden;

    -webkit-overflow-scrolling:touch;

    overscroll-behavior:contain;

    user-select:text;
    -webkit-user-select:text;

    padding:9px;

    border-radius:10px;

    background:#11151a;

    border:1px solid #39414a;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

    font-size:10px;

    line-height:1.5;
}

.log-row{
    padding:2px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.05);

    user-select:text;
    -webkit-user-select:text;
}

.log-buttons{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:8px;
}

.log-buttons button{
    min-height:40px;
    font-size:12px;
}


/* =====================================================
   PAGE 2 LOG
===================================================== */

.page2 .log{
    flex:1;
}


/* =====================================================
   iOS 防止点击后 focus 造成奇怪滚动
===================================================== */

button{
    -webkit-user-select:none;
    user-select:none;
}

</style>
</head>


<body>


<!-- =====================================================
     PAGE 1
===================================================== -->

<div class="page page1">

    <h1>🎧 Audio Cold Start V3</h1>

    <div class="subtitle">
        iPhone PWA · 第一次触摸 · 音频冷启动实验
    </div>


    <!-- =================================================
         STATUS
    ================================================== -->

    <div class="status">

        AudioContext：
        <strong id="ctxState">
            尚未创建
        </strong>
        <br>

        click-a.ogg：
        <strong id="clickState">
            加载中
        </strong>
        <br>

        bgm.ogg：
        <strong id="bgmState">
            加载中
        </strong>
        <br>

        当前：
        <strong id="interactionState">
            Cold Start
        </strong>

    </div>


    <!-- =================================================
         FIRST TOUCH
    ================================================== -->

    <div class="section">

        <div class="section-title">
            ① 第一次触摸音效
        </div>

        <div class="buttons">

            <button
                class="web"
                id="webBtn">

                Web Audio
                <br>
                合成音效

            </button>


            <button
                class="kenney"
                id="kenneyBtn">

                Kenney
                <br>
                click-a.ogg

            </button>

        </div>

        <div
            class="result"
            id="firstResult">

            尚未测试

        </div>

    </div>


    <!-- =================================================
         BGM
    ================================================== -->

    <div class="section">

        <div class="section-title">
            ② BGM 冷启动结果
        </div>

        <div class="buttons">

            <button
                class="bgm"
                id="bgmManual">

                手动播放
                <br>
                bgm.ogg

            </button>


            <button
                class="bgm"
                id="bgmStop">

                停止
                <br>
                BGM

            </button>

        </div>

        <div
            class="result"
            id="bgmResult">

            冷启动自动播放请在完全不触摸屏幕的情况下观察。
            <br>
            这个区域会记录 autoplay 结果。

        </div>

    </div>


    <!-- =================================================
         PAGE
    ================================================== -->

    <div class="section">

        <div class="section-title">
            ③ 页面切换测试
        </div>

        <button
            class="nav"
            id="goPage2"
            style="width:100%;">

            进入第二页 →

        </button>

    </div>


    <!-- =================================================
         LOG
    ================================================== -->

    <div class="section log-section">

        <div class="section-title">
            测试日志
        </div>

        <div
            class="log"
            id="log">
        </div>

        <div class="log-buttons">

            <button
                class="copy"
                id="copyLog">

                📋 复制全部日志

            </button>

            <button
                class="reset"
                id="clearLog">

                清除日志

            </button>

        </div>

    </div>

</div>



<!-- =====================================================
     PAGE 2
===================================================== -->

<div class="page page2">

    <h1>📄 Page 2</h1>

    <div class="subtitle">
        模拟 BoxPusher 选关 / 设置页面
    </div>


    <div class="status">

        AudioContext：
        <strong id="ctxState2">
            ---
        </strong>

    </div>


    <div class="section">

        <div class="section-title">
            第二页音效
        </div>

        <div class="buttons">

            <button
                class="web"
                id="webBtn2">

                Web Audio

            </button>


            <button
                class="kenney"
                id="kenneyBtn2">

                Kenney

            </button>

        </div>

    </div>


    <div class="section">

        <button
            class="nav"
            id="backPage"
            style="width:100%;">

            ← 返回第一页

        </button>

    </div>


    <div
        class="log"
        id="page2Log">

    </div>

</div>



<script>

/* =========================================================
   AUDIO CORE
========================================================= */

let ctx = null;

let masterGain = null;

let firstTouch = true;

let webAttemptCount = 0;

let kenneyAttemptCount = 0;


/* =========================================================
   AUDIO ELEMENTS
========================================================= */

const clickAudio =
    new Audio("click-a.ogg");

clickAudio.preload =
    "auto";


const bgmAudio =
    new Audio("bgm.ogg");

bgmAudio.preload =
    "auto";

bgmAudio.loop =
    true;

bgmAudio.volume =
    0.55;


/* =========================================================
   DOM
========================================================= */

const ctxState =
    document.getElementById(
        "ctxState"
    );

const ctxState2 =
    document.getElementById(
        "ctxState2"
    );

const clickState =
    document.getElementById(
        "clickState"
    );

const bgmState =
    document.getElementById(
        "bgmState"
    );

const interactionState =
    document.getElementById(
        "interactionState"
    );

const firstResult =
    document.getElementById(
        "firstResult"
    );

const bgmResult =
    document.getElementById(
        "bgmResult"
    );

const logBox =
    document.getElementById(
        "log"
    );

const page2Log =
    document.getElementById(
        "page2Log"
    );


/* =========================================================
   LOGGING
========================================================= */

function timestamp(){

    return new Date()
        .toLocaleTimeString(
            "zh-CN",
            {
                hour12:false
            }
        );

}


function log(
    text,
    cls=""
){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "log-row " + cls;

    row.textContent =
        "[" +
        timestamp() +
        "] " +
        text;

    logBox.appendChild(
        row
    );

    logBox.scrollTop =
        logBox.scrollHeight;
}


function log2(
    text
){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "log-row";

    row.textContent =
        "[" +
        timestamp() +
        "] " +
        text;

    page2Log.appendChild(
        row
    );

    page2Log.scrollTop =
        page2Log.scrollHeight;
}


/* =========================================================
   AUDIO CONTEXT
========================================================= */

function createAudioContext(){

    if(ctx){
        return ctx;
    }

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext){

        log(
            "❌ Web Audio API 不受支持",
            "fail"
        );

        return null;
    }


    ctx =
        new AudioContext();


    masterGain =
        ctx.createGain();


    masterGain.gain.value =
        0.65;


    masterGain.connect(
        ctx.destination
    );


    updateState();


    log(
        "AudioContext 创建完成，状态 = " +
        ctx.state
    );


    return ctx;
}


/* =========================================================
   WEB AUDIO
========================================================= */

async function testWebAudio(){

    const cold =
        firstTouch;

    webAttemptCount++;


    const pointerStart =
        performance.now();


    log(
        "Web Audio #" +
        webAttemptCount +
        " · " +
        (cold ? "COLD" : "WARM") +
        " · pointerdown"
    );


    const c =
        createAudioContext();


    if(!c){

        firstTouch =
            false;

        updateState();

        return;
    }


    log(
        "AudioContext 当前状态 = " +
        c.state
    );


    /*
       第一次冷启动时：
       等待 resume 完成。
    */

    if(
        c.state !==
        "running"
    ){

        try{

            const resumeStart =
                performance.now();


            await c.resume();


            const resumeTime =
                performance.now() -
                resumeStart;


            log(
                "resume() 完成 · " +
                resumeTime.toFixed(2) +
                " ms · 状态 = " +
                c.state
            );


        }catch(error){

            log(
                "❌ resume() 失败：" +
                error.message,
                "fail"
            );

            firstTouch =
                false;

            updateState();

            return;
        }

    }


    /*
       真正创建并调度声音。
    */

    const soundStart =
        performance.now();


    playWebClick();


    const commandTime =
        performance.now() -
        soundStart;


    const totalTime =
        performance.now() -
        pointerStart;


    log(
        "Web Audio play() 调度完成 · " +
        commandTime.toFixed(2) +
        " ms"
    );


    log(
        "Web Audio 从 pointerdown 到调度完成 · " +
        totalTime.toFixed(2) +
        " ms"
    );


    firstResult.innerHTML =
        cold

        ?

        "❄️ <b>Cold Start</b><br>" +
        "Web Audio：resume 后已调度<br>" +
        "总 JS 时间：" +
        totalTime.toFixed(2) +
        " ms"

        :

        "🔥 <b>Warm</b><br>" +
        "Web Audio：已调度<br>" +
        "JS 时间：" +
        totalTime.toFixed(2) +
        " ms";


    firstTouch =
        false;

    updateState();
}


/* =========================================================
   SYNTH SOUND
========================================================= */

function playWebClick(){

    if(
        !ctx ||
        !masterGain
    ){
        return;
    }


    const now =
        ctx.currentTime;


    const osc =
        ctx.createOscillator();


    const gain =
        ctx.createGain();


    osc.type =
        "triangle";


    osc.frequency.setValueAtTime(
        760,
        now
    );


    osc.frequency.exponentialRampToValueAtTime(
        1180,
        now + 0.025
    );


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.22,
        now + 0.002
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.055
    );


    osc.connect(
        gain
    );


    gain.connect(
        masterGain
    );


    osc.start(
        now
    );


    osc.stop(
        now + 0.06
    );
}


/* =========================================================
   KENNEY
========================================================= */

function testKenney(){

    const cold =
        firstTouch;

    kenneyAttemptCount++;


    const pointerStart =
        performance.now();


    log(
        "Kenney #" +
        kenneyAttemptCount +
        " · " +
        (cold ? "COLD" : "WARM") +
        " · pointerdown"
    );


    const sound =
        clickAudio.cloneNode(
            true
        );


    sound.volume =
        1;

    sound.currentTime =
        0;


    const playStart =
        performance.now();


    const promise =
        sound.play();


    const callTime =
        performance.now() -
        playStart;


    log(
        "Kenney play() 调用返回 · " +
        callTime.toFixed(2) +
        " ms"
    );


    if(
        promise &&
        promise.then
    ){

        promise.then(
            ()=>{

                const total =
                    performance.now() -
                    pointerStart;


                log(
                    "Kenney play() Promise 完成 · " +
                    total.toFixed(2) +
                    " ms",
                    "success"
                );

            }
        );


        promise.catch(
            error=>{

                log(
                    "❌ Kenney 播放失败：" +
                    error.message,
                    "fail"
                );

            }
        );

    }


    firstResult.innerHTML =
        cold

        ?

        "❄️ <b>Cold Start</b><br>" +
        "Kenney OGG：play() 调用完成<br>" +
        "JS 调用时间：" +
        callTime.toFixed(2) +
        " ms"

        :

        "🔥 <b>Warm</b><br>" +
        "Kenney OGG：play() 调用完成<br>" +
        "JS 调用时间：" +
        callTime.toFixed(2) +
        " ms";


    firstTouch =
        false;

    updateState();
}


/* =========================================================
   FILE LOAD
========================================================= */

clickAudio.addEventListener(
    "canplaythrough",
    ()=>{

        clickState.textContent =
            "已加载";

        log(
            "✓ click-a.ogg 已加载",
            "success"
        );

    }
);


clickAudio.addEventListener(
    "error",
    ()=>{

        clickState.textContent =
            "加载失败";

        log(
            "❌ click-a.ogg 加载失败",
            "fail"
        );

    }
);


bgmAudio.addEventListener(
    "canplaythrough",
    ()=>{

        bgmState.textContent =
            "已加载";

        log(
            "✓ bgm.ogg 已加载",
            "success"
        );

    }
);


bgmAudio.addEventListener(
    "error",
    ()=>{

        bgmState.textContent =
            "加载失败";

        log(
            "❌ bgm.ogg 加载失败",
            "fail"
        );

    }
);


/* =========================================================
   BGM AUTOPLAY
========================================================= */

let autoplayAttempted =
    false;


function attemptAutoplay(){

    autoplayAttempted =
        true;


    log(
        "尝试冷启动 autoplay……"
    );


    const promise =
        bgmAudio.play();


    if(
        promise &&
        promise.then
    ){

        promise.then(
            ()=>{

                bgmResult.innerHTML =
                    "🟢 <b>AUTOPLAY SUCCESS</b><br>" +
                    "bgm.ogg 自动播放成功。";


                log(
                    "🎵 🟢 BGM autoplay SUCCESS",
                    "success"
                );

            }
        );


        promise.catch(
            error=>{

                bgmResult.innerHTML =
                    "🔴 <b>AUTOPLAY BLOCKED</b><br>" +
                    error.message;


                log(
                    "🎵 🔴 BGM autoplay BLOCKED · " +
                    error.message,
                    "warn"
                );

            }
        );

    }
}


window.addEventListener(
    "load",
    ()=>{

        setTimeout(
            attemptAutoplay,
            300
        );

    }
);


/* =========================================================
   BGM MANUAL
========================================================= */

document
.getElementById(
    "bgmManual"
)
.addEventListener(
    "pointerdown",
    async ()=>{

        try{

            await bgmAudio.play();


            bgmResult.innerHTML =
                "🟢 <b>BGM 手动播放成功</b>";


            log(
                "🎵 BGM 手动播放成功",
                "success"
            );


        }catch(error){

            bgmResult.innerHTML =
                "🔴 <b>BGM 手动播放失败</b><br>" +
                error.message;


            log(
                "❌ BGM 手动播放失败：" +
                error.message,
                "fail"
            );

        }

    }
);


/* =========================================================
   STOP BGM
========================================================= */

document
.getElementById(
    "bgmStop"
)
.addEventListener(
    "pointerdown",
    ()=>{

        bgmAudio.pause();

        bgmAudio.currentTime =
            0;

        log(
            "⏹ BGM 停止"
        );

    }
);


/* =========================================================
   BUTTON BINDINGS
========================================================= */

document
.getElementById(
    "webBtn"
)
.addEventListener(
    "pointerdown",
    ()=>{
        testWebAudio();
    }
);


document
.getElementById(
    "kenneyBtn"
)
.addEventListener(
    "pointerdown",
    ()=>{
        testKenney();
    }
);


/* =========================================================
   PAGE 2
========================================================= */

document
.getElementById(
    "goPage2"
)
.addEventListener(
    "pointerdown",
    ()=>{

        document
        .querySelector(".page1")
        .style.display =
            "none";


        document
        .querySelector(".page2")
        .style.display =
            "flex";


        log(
            "→ 进入第二页"
        );


        log2(
            "第二页打开"
        );

    }
);


document
.getElementById(
    "backPage"
)
.addEventListener(
    "pointerdown",
    ()=>{

        document
        .querySelector(".page2")
        .style.display =
            "none";


        document
        .querySelector(".page1")
        .style.display =
            "flex";


        log(
            "← 返回第一页"
        );


        log2(
            "← 返回第一页"
        );

    }
);


/* =========================================================
   PAGE 2 AUDIO
========================================================= */

document
.getElementById(
    "webBtn2"
)
.addEventListener(
    "pointerdown",
    ()=>{
        testWebAudio();

        log2(
            "Web Audio 测试"
        );
    }
);


document
.getElementById(
    "kenneyBtn2"
)
.addEventListener(
    "pointerdown",
    ()=>{
        testKenney();

        log2(
            "Kenney 测试"
        );
    }
);


/* =========================================================
   COPY LOG
========================================================= */

function getLogText(){

    return Array
        .from(
            logBox.children
        )
        .map(
            row=>row.textContent
        )
        .join("\n");

}


document
.getElementById(
    "copyLog"
)
.addEventListener(
    "pointerdown",
    async ()=>{

        const text =
            getLogText();


        try{

            await navigator
                .clipboard
                .writeText(text);


            log(
                "📋 日志已复制到剪贴板",
                "success"
            );


        }catch(error){

            /*
               iOS 某些情况下 clipboard
               可能需要更严格的用户手势。
            */

            log(
                "⚠️ 自动复制失败：" +
                error.message,
                "warn"
            );

            /*
               让日志仍然可以手动长按选择复制。
            */

        }

    }
);


/* =========================================================
   CLEAR LOG
========================================================= */

document
.getElementById(
    "clearLog"
)
.addEventListener(
    "pointerdown",
    ()=>{

        logBox.innerHTML =
            "";

        log(
            "日志已清除"
        );

    }
);


/* =========================================================
   STATE
========================================================= */

function updateState(){

    ctxState.textContent =
        ctx
        ? ctx.state
        : "尚未创建";


    ctxState2.textContent =
        ctx
        ? ctx.state
        : "---";


    interactionState.textContent =
        firstTouch
        ? "Cold Start"
        : "Warm";

}


/* =========================================================
   INITIAL
========================================================= */

updateState();


log(
    "================================"
);

log(
    "Audio Cold Start Test V3"
);

log(
    "第一次触摸前不要操作页面"
);

log(
    "Web Audio 与 Kenney 请分别冷启动测试"
);

log(
    "JS时间 ≠ 实际听觉延迟"
);

log(
    "================================"
);

</script>

</body>
</html>
