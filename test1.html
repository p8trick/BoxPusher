<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

      content="width=device-width,

               maximum-scale=1,

<title>Audio Cold Start Test V4</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    overflow-x:hidden;
    overflow-y:auto;

    overscroll-behavior-x:none;

    background:#20242a;
}

body{
    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

    overflow-x:hidden;
    overflow-y:auto;

    background:#20242a;
    color:#fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================================================
   PAGE
========================================================= */

.page{
    width:min(92vw,520px);

    min-height:100dvh;

    margin:0 auto;

    padding:
        max(18px,env(safe-area-inset-top))
        20px
        max(28px,env(safe-area-inset-bottom))
        20px;

    display:flex;
    flex-direction:column;

    gap:10px;
}

}


/* =========================================================
   TEXT
========================================================= */

h1{

    text-align:center;

    font-size:24px;
    line-height:1.2;
}

.subtitle{
    text-align:center;

    font-size:12px;
    line-height:1.45;

    opacity:.62;
}


/* =========================================================
   STATUS
========================================================= */

.status{
    padding:10px 12px;

    border-radius:11px;

    background:#11151a;

    font-size:11px;

}

}


/* =========================================================
   SECTION
========================================================= */

.section{
    padding:11px;

    border-radius:13px;

    background:#292f36;

    border:1px solid #424a54;
}

.section-title{
    margin-bottom:8px;

    font-size:13px;
    font-weight:700;
}


/* =========================================================
   BUTTONS
========================================================= */

.buttons{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;
}

button{
    appearance:none;
    -webkit-appearance:none;

    border:0;
    outline:none;

    margin:0;

    min-height:52px;

    padding:9px 12px;

    border-radius:12px;

    color:#fff;

    font-size:15px;
    font-weight:700;

    touch-action:manipulation;

    user-select:none;
    -webkit-user-select:none;

    box-shadow:
        0 3px 0 #252b31,
        inset 0 1px 0 rgba(255,255,255,.12);
}

button:active{
    transform:translateY(2px);

    box-shadow:
        0 1px 0 #252b31,
        inset 0 1px 0 rgba(255,255,255,.12);
}

.web{
    background:#365d78;
}

.kenney{
    background:#685434;
}

.bgm{
    background:#53664a;
}

.nav{
    background:#51485f;
}

.copy{
    background:#496044;
}

.reset{
    background:#693e3e;
}


/* =========================================================
   RESULT
========================================================= */

.result{
    margin-top:8px;

    padding:8px 9px;

    border-radius:8px;

    background:#171b20;

    font-size:11px;

    line-height:1.45;
}

.success{
    color:#8fd18f;
}

.fail{
    color:#ff9999;
}

.warn{
    color:#ffd36a;
}


/* =========================================================
   LOG SECTION
========================================================= */

.log-section{
    display:flex;
    flex-direction:column;

    min-height:0;
}


/* =========================================================
   LOG
========================================================= */

.log{
    width:100%;

    height:190px;

    overflow-y:auto;
    overflow-x:hidden;

    -webkit-overflow-scrolling:touch;

    overscroll-behavior:contain;

    padding:9px;

    border-radius:10px;

    background:#11151a;

    border:1px solid #39414a;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

    font-size:10px;

    line-height:1.5;

    user-select:text;
    -webkit-user-select:text;
}

.log-row{
    padding:2px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.05);

    user-select:text;
    -webkit-user-select:text;

    overflow-wrap:anywhere;
}


/* =========================================================
   LOG BUTTONS
========================================================= */

.log-buttons{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

    margin-top:8px;
}

.log-buttons button{
    min-height:42px;

    font-size:12px;
}


/* =========================================================
   PAGE 2
========================================================= */

.page2 .log{
    height:220px;
}

</style>
</head>

======================================================= -->

    <!-- ===================================================

    ==================================================== -->

     PAGE 2

    <h1>

    </h1>


    <div class="subtitle">

    </div>

        AudioContext：

        <strong id="ctxState2">

        </strong>

    </div>


    <div class="section">

        <div class="section-title">

            第二页音效

        </div>


        <div class="buttons">


            <button
                class="web"
                id="webBtn2">

                Web Audio

            </button>


            <button
                class="kenney"
                id="kenneyBtn2">

                Kenney

            </button>


        </div>

    </div>


    <div class="section">

        <button
            class="nav"
            id="backPage"

            ← 返回第一页

</div>



<script>

/* =========================================================
   AUDIO CORE
========================================================= */

let ctx = null;

let masterGain = null;

let firstTouch = true;

let webAttemptCount = 0;

let kenneyAttemptCount = 0;


/* =========================================================
   AUDIO FILES
========================================================= */

const clickAudio =
    new Audio("click-a.ogg");

clickAudio.preload =
    "auto";


const bgmAudio =
    new Audio("bgm.ogg");

bgmAudio.preload =
    "auto";

bgmAudio.loop =
    true;

bgmAudio.volume =
    0.55;


/* =========================================================
   DOM
========================================================= */

const ctxState =
    document.getElementById(
        "ctxState"
    );

const ctxState2 =
    document.getElementById(
        "ctxState2"
    );

const clickState =
    document.getElementById(
        "clickState"
    );

const bgmState =
    document.getElementById(
        "bgmState"
    );

const interactionState =
    document.getElementById(
        "interactionState"
    );

const firstResult =
    document.getElementById(
        "firstResult"
    );

const bgmResult =
    document.getElementById(
        "bgmResult"
    );

const logBox =
    document.getElementById(
        "log"
    );

const page2Log =
    document.getElementById(
        "page2Log"
    );


/* =========================================================
   LOG
========================================================= */

function timestamp(){

    return new Date()
        .toLocaleTimeString(
            "zh-CN",
            {
                hour12:false
            }
        );

}


function log(
    text,
    cls=""
){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "log-row " + cls;

    row.textContent =
        "[" +
        timestamp() +
        "] " +
        text;

    logBox.appendChild(
        row
    );

    logBox.scrollTop =
        logBox.scrollHeight;

}


function log2(
    text
){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "log-row";

    row.textContent =
        "[" +
        timestamp() +
        "] " +
        text;

    page2Log.appendChild(
        row
    );

    page2Log.scrollTop =
        page2Log.scrollHeight;

}


/* =========================================================
   CREATE AUDIO CONTEXT
========================================================= */

function createAudioContext(){

    if(ctx){
        return ctx;
    }


    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if(!AudioContext){

        log(
            "❌ Web Audio API 不受支持",
            "fail"
        );

        return null;
    }


    ctx =
        new AudioContext();


    masterGain =
        ctx.createGain();


    masterGain.gain.value =
        0.65;


    masterGain.connect(
        ctx.destination
    );


    updateState();


    log(
        "AudioContext 创建完成 · state = " +
        ctx.state
    );


    return ctx;
}


/* =========================================================
   WEB AUDIO TEST
========================================================= */

async function testWebAudio(){

    const cold =
        firstTouch;


    webAttemptCount++;


    const pointerStart =
        performance.now();


    log(
        "Web Audio #" +
        webAttemptCount +
        " · " +
        (cold ? "COLD" : "WARM") +
        " · pointerdown"
    );


    const c =
        createAudioContext();


    if(!c){

        firstTouch =
            false;

        updateState();

        return;
    }


    log(
        "AudioContext 当前状态 = " +
        c.state
    );


    /*
       第一次冷启动：

       resume 必须等待完成。
    */

    if(
        c.state !==
        "running"
    ){

        try{

            const resumeStart =
                performance.now();


            await c.resume();


            const resumeTime =
                performance.now() -
                resumeStart;


            log(
                "resume() 完成 · " +
                resumeTime.toFixed(2) +
                " ms · state = " +
                c.state
            );


        }catch(error){

            log(
                "❌ resume() 失败 · " +
                error.message,
                "fail"
            );


            firstTouch =
                false;

            updateState();

            return;
        }

    }


    const soundStart =
        performance.now();


    playWebClick();


    const commandTime =
        performance.now() -
        soundStart;


    const totalTime =
        performance.now() -
        pointerStart;


    log(
        "Web Audio 已调度 · " +
        commandTime.toFixed(2) +
        " ms"
    );


    log(
        "pointerdown → 调度完成 · " +
        totalTime.toFixed(2) +
        " ms"
    );


    firstResult.innerHTML =

        cold

        ?

        "❄️ <b>Cold Start</b><br>" +
        "Web Audio 已调度<br>" +
        "JS 总时间：" +
        totalTime.toFixed(2) +
        " ms"

        :

        "🔥 <b>Warm</b><br>" +
        "Web Audio 已调度<br>" +
        "JS 时间：" +
        totalTime.toFixed(2) +
        " ms";


    firstTouch =
        false;


    updateState();

}


/* =========================================================
   SYNTH CLICK
========================================================= */

function playWebClick(){

    if(
        !ctx ||
        !masterGain
    ){
        return;
    }


    const now =
        ctx.currentTime;


    const osc =
        ctx.createOscillator();


    const gain =
        ctx.createGain();


    osc.type =
        "triangle";


    osc.frequency.setValueAtTime(
        760,
        now
    );


    osc.frequency.exponentialRampToValueAtTime(
        1180,
        now + 0.025
    );


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.22,
        now + 0.002
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.055
    );


    osc.connect(
        gain
    );


    gain.connect(
        masterGain
    );


    osc.start(
        now
    );


    osc.stop(
        now + 0.06
    );

}


/* =========================================================
   KENNEY TEST
========================================================= */

function testKenney(){

    const cold =
        firstTouch;


    kenneyAttemptCount++;


    const pointerStart =
        performance.now();


    log(
        "Kenney #" +
        kenneyAttemptCount +
        " · " +
        (cold ? "COLD" : "WARM") +
        " · pointerdown"
    );


    const sound =
        clickAudio.cloneNode(
            true
        );


    sound.volume =
        1;


    sound.currentTime =
        0;


    const playStart =
        performance.now();


    const promise =
        sound.play();


    const callTime =
        performance.now() -
        playStart;


    log(
        "Kenney play() 调用返回 · " +
        callTime.toFixed(2) +
        " ms"
    );


    if(
        promise &&
        promise.then
    ){

        promise.then(
            ()=>{

                const total =
                    performance.now() -
                    pointerStart;


                log(
                    "Kenney Promise 完成 · " +
                    total.toFixed(2) +
                    " ms",
                    "success"
                );

            }
        );


        promise.catch(
            error=>{

                log(
                    "❌ Kenney 播放失败 · " +
                    error.message,
                    "fail"
                );

            }
        );

    }


    firstResult.innerHTML =

        cold

        ?

        "❄️ <b>Cold Start</b><br>" +
        "Kenney OGG 已调用 play()<br>" +
        "JS 调用：" +
        callTime.toFixed(2) +
        " ms"

        :

        "🔥 <b>Warm</b><br>" +
        "Kenney OGG 已调用 play()<br>" +
        "JS 调用：" +
        callTime.toFixed(2) +
        " ms";


    firstTouch =
        false;


    updateState();

}


/* =========================================================
   FILE STATUS
========================================================= */

clickAudio.addEventListener(
    "canplaythrough",
    ()=>{

        clickState.textContent =
            "已加载";


        log(
            "✓ click-a.ogg 已加载",
            "success"
        );

    }
);


clickAudio.addEventListener(
    "error",
    ()=>{

        clickState.textContent =
            "加载失败";


        log(
            "❌ click-a.ogg 加载失败",
            "fail"
        );

    }
);


bgmAudio.addEventListener(
    "canplaythrough",
    ()=>{

        bgmState.textContent =
            "已加载";


        log(
            "✓ bgm.ogg 已加载",
            "success"
        );

    }
);


bgmAudio.addEventListener(
    "error",
    ()=>{

        bgmState.textContent =
            "加载失败";


        log(
            "❌ bgm.ogg 加载失败",
            "fail"
        );

    }
);


/* =========================================================
   BGM MANUAL
========================================================= */

document
.getElementById(
    "bgmManual"
)
.addEventListener(
    "pointerdown",
    async ()=>{

        try{

            await bgmAudio.play();


            bgmResult.innerHTML =
                "🟢 <b>BGM 手动播放成功</b>";


            log(
                "🎵 BGM 手动播放成功",
                "success"
            );


        }catch(error){

            bgmResult.innerHTML =
                "🔴 <b>BGM 手动播放失败</b><br>" +
                error.message;


            log(
                "❌ BGM 手动播放失败 · " +
                error.message,
                "fail"
            );

        }

    }
);


/* =========================================================
   BGM STOP
========================================================= */

document
.getElementById(
    "bgmStop"
)
.addEventListener(
    "pointerdown",
    ()=>{

        bgmAudio.pause();

        bgmAudio.currentTime =
            0;


        log(
            "⏹ BGM 停止"
        );

    }
);


/* =========================================================
   BUTTONS
========================================================= */

document
.getElementById(
    "webBtn"
)
.addEventListener(
    "pointerdown",
    ()=>{
        testWebAudio();
    }
);


document
.getElementById(
    "kenneyBtn"
)
.addEventListener(
    "pointerdown",
    ()=>{
        testKenney();
    }
);


/* =========================================================
   PAGE 2
========================================================= */

document
.getElementById(
    "goPage2"
)
.addEventListener(
    "pointerdown",
    ()=>{

        document
        .querySelector(".page1")
        .style.display =
            "none";


        document
        .querySelector(".page2")
        .style.display =
            "flex";


        log(
            "→ 进入第二页"
        );


        log2(
            "第二页打开"
        );

    }
);


document
.getElementById(
    "backPage"
)
.addEventListener(
    "pointerdown",
    ()=>{

        document
        .querySelector(".page2")
        .style.display =
            "none";


        document
        .querySelector(".page1")
        .style.display =
            "flex";


        log(
            "← 返回第一页"
        );


        log2(
            "← 返回第一页"
        );

    }
);


/* =========================================================
   PAGE 2 AUDIO
========================================================= */

document
.getElementById(
    "webBtn2"
)
.addEventListener(
    "pointerdown",
    ()=>{
        testWebAudio();

        log2(
            "Web Audio 测试"
        );
    }
);


document
.getElementById(
    "kenneyBtn2"
)
.addEventListener(
    "pointerdown",
    ()=>{
        testKenney();

        log2(
            "Kenney 测试"
        );
    }
);


/* =========================================================
   COPY LOG
========================================================= */

function getLogText(){

    return Array
        .from(
            logBox.children
        )
        .map(
            row=>row.textContent
        )
        .join("\n");

}


document
.getElementById(
    "copyLog"
)
.addEventListener(
    "pointerdown",
    async ()=>{

        const text =
            getLogText();


        try{

            await navigator
                .clipboard
                .writeText(
                    text
                );


            log(
                "📋 日志已复制到剪贴板",
                "success"
            );


        }catch(error){

            log(
                "⚠️ 自动复制失败：" +
                error.message,
                "warn"
            );

        }

    }
);


/* =========================================================
   CLEAR LOG
========================================================= */

document
.getElementById(
    "clearLog"
)
.addEventListener(
    "pointerdown",
    ()=>{

        logBox.innerHTML =
            "";


        log(
            "日志已清除"
        );

    }
);


/* =========================================================
   STATE
========================================================= */

function updateState(){

    ctxState.textContent =
        ctx
        ? ctx.state
        : "尚未创建";


    ctxState2.textContent =
        ctx
        ? ctx.state
        : "---";


    interactionState.textContent =
        firstTouch
        ? "Cold Start"
        : "Warm";

}


/* =========================================================
   INITIAL
========================================================= */

updateState();


log(
    "================================"
);

log(
    "Audio Cold Start Test V4"
);

log(
    "Web Audio / Kenney / BGM"
);

log(
    "JS 调用时间 ≠ 实际听觉延迟"
);

log(
    "页面允许正常上下滚动"
);

log(
    "日志区域可独立滚动并复制"
);

log(
    "================================"
);


/* =========================================================
   BGM AUTOPLAY TEST
   注意：不等待用户触摸
========================================================= */

let autoplayAttempted =
    false;


function attemptColdAutoplay(){

    autoplayAttempted =
        true;


    log(
        "尝试 bgm.ogg 冷启动 autoplay……"
    );


    const promise =
        bgmAudio.play();


    if(
        promise &&
        promise.then
    ){

        promise.then(
            ()=>{

                bgmResult.innerHTML =
                    "🟢 <b>AUTOPLAY SUCCESS</b>";


                log(
                    "🎵 BGM autoplay SUCCESS",
                    "success"
                );

            }
        );


        promise.catch(
            error=>{

                bgmResult.innerHTML =
                    "🔴 <b>AUTOPLAY BLOCKED</b><br>" +
                    error.message;


                log(
                    "🎵 BGM autoplay BLOCKED · " +
                    error.message,
                    "warn"
                );

            }
        );

    }

}


/*
   页面加载后，
   没有任何用户触摸，
   自动尝试一次。
*/
