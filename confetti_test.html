<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BoxPusher Confetti Test</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #222;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: min(80vw, 320px);
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="panel">
    <button onclick="BoxPusherConfetti.playBasicConfetti()">
      Basic Cannon
    </button>
    <button onclick="BoxPusherConfetti.playVictoryConfetti()">
      Realistic Look
    </button>
    <button onclick="BoxPusherConfetti.reset()">
      Reset
    </button>
  </div>
  <!-- BoxPusher 专用彩纸引擎 -->
  <script src="confetti.js"></script>
</body>
</html>
