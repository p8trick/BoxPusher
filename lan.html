<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>📦 推箱子 · LAN 2-4人 v2.1</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f3ead8;
  color:#4a3928;
}

body{
  padding:
    max(14px,env(safe-area-inset-top))
    max(14px,env(safe-area-inset-right))
    max(14px,env(safe-area-inset-bottom))
    max(14px,env(safe-area-inset-left));
}

button,
input{
  font:inherit;
}

button{
  border:1px solid #b99d79;
  border-radius:10px;
  background:#fffaf0;
  color:#4a3928;
  padding:10px 14px;
  cursor:pointer;
  touch-action:manipulation;
}

button:active{
  transform:scale(.97);
}

input{
  width:100%;
  border:1px solid #c5aa85;
  border-radius:10px;
  padding:10px 12px;
  background:#fffdf8;
  color:#4a3928;
}

h1{
  margin:0 0 6px;
  font-size:22px;
}

h2{
  margin:0 0 8px;
  font-size:16px;
}

.app{
  width:min(680px,100%);
  margin:0 auto;
}

.panel{
  margin-bottom:12px;
  padding:14px;
  border:1px solid #cdb18b;
  border-radius:14px;
  background:rgba(255,250,239,.92);
  box-shadow:0 2px 8px rgba(80,55,25,.08);
}

.subtitle{
  color:#806b53;
  font-size:13px;
}

.status{
  margin-top:10px;
  padding:10px 12px;
  border-radius:10px;
  background:#eee2cd;
  font-size:14px;
  font-weight:600;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
}

.row>*{
  flex:1;
}

.room{
  margin-top:8px;
  padding:12px;
  border-radius:10px;
  background:#eadbc1;
  text-align:center;
}

.room-code{
  margin-top:3px;
  font-size:25px;
  font-weight:800;
  letter-spacing:3px;
}

.players{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.player{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 10px;
  border-radius:8px;
  background:#f3eadb;
  font-size:14px;
}

.player-name{
  font-weight:700;
}

.player-meta{
  color:#806b53;
  font-size:12px;
}

.authority{
  margin-top:8px;
  font-size:12px;
  color:#806b53;
}

.board{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:3px;
  width:min(330px,80vw);
  aspect-ratio:1;
  margin:12px auto;
}

.cell{
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:5px;
  background:#eadcc5;
  border:1px solid #d4bd98;
  font-size:22px;
  font-weight:800;
}

.wall{
  background:#8f775a;
  border-color:#796247;
}

.player1{color:#8a3e32;}
.player2{color:#365c8a;}
.player3{color:#557b3e;}
.player4{color:#76518b;}

.controls{
  width:220px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.controls button{
  min-height:48px;
  font-size:20px;
  font-weight:700;
}

.controls .empty{
  visibility:hidden;
}

.log{
  height:170px;
  overflow:auto;
  padding:9px;
  border-radius:9px;
  background:#332b23;
  color:#eee4d4;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;
  line-height:1.55;
}

.log-line{
  white-space:pre-wrap;
  word-break:break-word;
}

.small{
  margin-top:7px;
  color:#806b53;
  font-size:11px;
  line-height:1.45;
}

.waiting{
  opacity:.72;
}

@media(max-width:430px){
  .panel{
    padding:12px;
  }

  h1{
    font-size:20px;
  }

  .room-code{
    font-size:22px;
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="panel">
    <h1>📦 推箱子 · LAN 2-4人</h1>
    <div class="subtitle">
      v2.1 · 房主权威同步 · 断线暂停 · 自动恢复
    </div>

    <div id="status" class="status">
      网络初始化中...
    </div>

    <div class="authority" id="authorityText">
      尚未建立网络连接
    </div>
  </div>

  <div class="panel">
    <h2>房间</h2>

    <div class="row">
      <input
        id="nameInput"
        type="text"
        maxlength="12"
        placeholder="玩家名称"
        autocomplete="off"
      >
      <button id="createButton">创建房间</button>
    </div>

    <div class="room" id="roomDisplay">
      <div>房间号</div>
      <div class="room-code">———</div>
    </div>

    <div class="small">
      房主重新打开页面后会尝试恢复上一次房间。
    </div>
  </div>

  <div class="panel">
    <h2>加入房间</h2>

    <div class="row">
      <input
        id="roomInput"
        type="text"
        maxlength="5"
        placeholder="输入5位房间号"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
      >
      <button id="joinButton">加入</button>
    </div>
  </div>

  <div class="panel">
    <h2>玩家</h2>
    <div id="players" class="players"></div>
  </div>

  <div class="panel">
    <h2>测试棋盘</h2>

    <div id="board" class="board"></div>

    <div class="controls">
      <button class="empty"></button>
      <button data-dir="up">▲</button>
      <button class="empty"></button>

      <button data-dir="left">◀</button>
      <button data-dir="down">▼</button>
      <button data-dir="right">▶</button>
    </div>

    <div class="small">
      测试阶段：移动命令由客户端发送，位置和步数由房主统一计算。
    </div>
  </div>

  <div class="panel">
    <h2>网络日志</h2>
    <div id="log" class="log"></div>
  </div>

</div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<script>
"use strict";

/* =========================================================
   LAN v2.1
   第1段：基础状态 / UI / 本地持久化 / 渲染
   ========================================================= */

const MAX_PLAYERS = 4;

let peer = null;
let myId = null;

let myName = "";
let roomCode = "";

let isHost = false;

let hostConnection = null;
let connections = new Map();
let players = new Map();

let gameStatus = "WAITING";

let heartbeatTimer = null;
let hostWatchTimer = null;
let reconnectTimer = null;

let reconnectBusy = false;
let lastHostHeartbeat = Date.now();

let playerToken = null;

let gameState = {
  positions: {},
  steps: {},
  sequence: 0
};

const WAIT_HOST_TIMEOUT = 8000;
const RECONNECT_INTERVAL = 3000;

const WALLS = new Set([
  0,1,2,3,4,
  5,9,
  10,14,
  15,19,
  20,21,22,23,24
]);

const statusEl = document.getElementById("status");
const roomDisplayEl = document.getElementById("roomDisplay");
const playersEl = document.getElementById("players");
const boardEl = document.getElementById("board");
const logEl = document.getElementById("log");
const authorityEl = document.getElementById("authorityText");

const nameInput = document.getElementById("nameInput");
const roomInput = document.getElementById("roomInput");
const createButton = document.getElementById("createButton");
const joinButton = document.getElementById("joinButton");


/* =========================================================
   基础工具
   ========================================================= */

function nowText(){
  return new Date().toLocaleTimeString();
}

function log(message){
  const line = document.createElement("div");
  line.className = "log-line";

  const args = Array.from(arguments);
  line.textContent = "[" + nowText() + "] " +
    args.map(v => {
      if(typeof v === "string") return v;
      try{
        return JSON.stringify(v);
      }catch(e){
        return String(v);
      }
    }).join(" ");

  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(text){
  statusEl.textContent = text;
}

function makeRoomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let result = "";

  for(let i=0;i<5;i++){
    result += chars[Math.floor(Math.random()*chars.length)];
  }

  return result;
}

function makePlayerToken(){
  try{
    if(window.crypto && typeof window.crypto.randomUUID === "function"){
      return "p-" + window.crypto.randomUUID();
    }
  }catch(e){}

  return "p-" +
    Date.now().toString(36) +
    "-" +
    Math.random().toString(36).slice(2) +
    "-" +
    Math.random().toString(36).slice(2);
}

function getPlayerToken(){
  let token = null;

  try{
    token = localStorage.getItem("boxpusherPlayerToken");
  }catch(e){}

  if(!token){
    token = makePlayerToken();

    try{
      localStorage.setItem("boxpusherPlayerToken",token);
    }catch(e){}
  }

  return token;
}

playerToken = getPlayerToken();

function saveClientRoom(){
  if(!roomCode) return;

  try{
    localStorage.setItem("boxpusherLastRoomCode",roomCode);
    localStorage.setItem("boxpusherLastHostId","box-host-" + roomCode);
  }catch(e){}
}

function getSavedClientRoom(){
  try{
    return {
      roomCode:localStorage.getItem("boxpusherLastRoomCode") || "",
      hostId:localStorage.getItem("boxpusherLastHostId") || ""
    };
  }catch(e){
    return {
      roomCode:"",
      hostId:""
    };
  }
}

function saveHostRoomCode(code){
  try{
    localStorage.setItem("boxpusherHostRoomCode",code);
  }catch(e){}
}

function getSavedHostRoomCode(){
  try{
    return localStorage.getItem("boxpusherHostRoomCode") || "";
  }catch(e){
    return "";
  }
}

function safeClone(value){
  try{
    return JSON.parse(JSON.stringify(value));
  }catch(e){
    return null;
  }
}


/* =========================================================
   Host backup
   ========================================================= */

function saveHostBackup(){
  if(!isHost || !roomCode) return;

  const backup = {
    roomCode:roomCode,
    players:Array.from(players.values()).map(player => ({
      id:player.id,
      token:player.token,
      name:player.name,
      host:!!player.host,
      number:player.number
    })),
    state:safeClone(gameState),
    savedAt:Date.now()
  };

  try{
    localStorage.setItem(
      "boxpusherHostBackup",
      JSON.stringify(backup)
    );
  }catch(e){
    log("保存房主备份失败",e.message || e);
  }
}

function loadHostBackup(code){
  try{
    const raw = localStorage.getItem("boxpusherHostBackup");

    if(!raw) return null;

    const backup = JSON.parse(raw);

    if(!backup || backup.roomCode !== code){
      return null;
    }

    return backup;
  }catch(e){
    log("读取房主备份失败",e.message || e);
    return null;
  }
}


/* =========================================================
   UI：房间 / 玩家 / 棋盘
   ========================================================= */

function renderRoom(){
  const code = roomCode || "———";

  roomDisplayEl.innerHTML =
    "<div>房间号</div>" +
    '<div class="room-code">' +
      escapeHtml(code) +
    "</div>";
}

function renderPlayers(){
  playersEl.innerHTML = "";

  const list = Array.from(players.values())
    .sort((a,b) => a.number - b.number);

  if(list.length === 0){
    const empty = document.createElement("div");
    empty.className = "small";
    empty.textContent = "尚无玩家";
    playersEl.appendChild(empty);
    return;
  }

  list.forEach(player => {
    const row = document.createElement("div");
    row.className = "player";

    const left = document.createElement("div");
    left.className = "player-name";

    const crown = player.host ? " 👑" : "";

    left.textContent =
      "#" + player.number +
      " " +
      (player.name || "玩家") +
      crown;

    const right = document.createElement("div");
    right.className = "player-meta";

    const steps =
      gameState.steps[player.id] ??
      0;

    right.textContent =
      steps + " 步";

    row.appendChild(left);
    row.appendChild(right);

    playersEl.appendChild(row);
  });
}

function renderBoard(){
  boardEl.innerHTML = "";

  for(let index=0; index<25; index++){
    const cell = document.createElement("div");
    cell.className = "cell";

    if(WALLS.has(index)){
      cell.classList.add("wall");
      boardEl.appendChild(cell);
      continue;
    }

    let occupant = null;

    players.forEach(player => {
      if(gameState.positions[player.id] === index){
        occupant = player;
      }
    });

    if(occupant){
      cell.classList.add(
        "player" + occupant.number
      );

      cell.textContent = "●";
    }

    boardEl.appendChild(cell);
  }
}

function renderAll(){
  renderRoom();
  renderPlayers();
  renderBoard();
}

function escapeHtml(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   网络基础
   ========================================================= */

function send(connection,message){
  if(!connection) return false;

  try{
    if(connection.open){
      connection.send(message);
      return true;
    }
  }catch(e){
    log("发送失败",e.message || e);
  }

  return false;
}

function broadcast(message){
  connections.forEach(connection => {
    send(connection,message);
  });
}

function buildPlayersPayload(){
  return Array.from(players.values()).map(player => ({
    id:player.id,
    token:player.token,
    name:player.name,
    host:!!player.host,
    number:player.number
  }));
}

function buildStateMessage(type){
  return {
    type:type || "state",
    room:roomCode,
    state:safeClone(gameState),
    players:buildPlayersPayload(),
    sequence:gameState.sequence
  };
}


/* =========================================================
   Host heartbeat
   ========================================================= */

function stopHeartbeat(){
  if(heartbeatTimer){
    clearInterval(heartbeatTimer);
    heartbeatTimer = null;
  }
}

function startHeartbeat(){
  stopHeartbeat();

  heartbeatTimer = setInterval(() => {
    if(!isHost) return;

    broadcast({
      type:"heartbeat",
      time:Date.now(),
      sequence:gameState.sequence
    });
  },2000);

  log("房主心跳启动");
}


/* =========================================================
   Client host-watch
   ========================================================= */

function stopHostWatch(){
  if(hostWatchTimer){
    clearInterval(hostWatchTimer);
    hostWatchTimer = null;
  }
}

function startHostWatch(){
  stopHostWatch();

  lastHostHeartbeat = Date.now();

  hostWatchTimer = setInterval(() => {
    if(isHost) return;
    if(!roomCode) return;

    const elapsed =
      Date.now() - lastHostHeartbeat;

    if(
      elapsed > WAIT_HOST_TIMEOUT &&
      gameStatus !== "WAIT_HOST"
    ){
      enterWaitHost();
    }
  },1000);
}

function enterWaitHost(){
  if(isHost) return;

  gameStatus = "WAIT_HOST";

  setStatus("🟡 房主暂时离线，等待恢复...");
  authorityEl.textContent =
    "游戏暂停，等待房主重新连接";

  document.body.classList.add("waiting");

  log(
    "房主心跳丢失",
    "进入 WAIT_HOST"
  );

  startReconnectLoop();
}


/* =========================================================
   Client reconnect loop
   ========================================================= */

function stopReconnectLoop(){
  if(reconnectTimer){
    clearInterval(reconnectTimer);
    reconnectTimer = null;
  }

  reconnectBusy = false;
}

function startReconnectLoop(){
  if(isHost) return;

  if(reconnectTimer) return;

  attemptReconnect();

  reconnectTimer = setInterval(() => {
    if(gameStatus !== "WAIT_HOST"){
      stopReconnectLoop();
      return;
    }

    attemptReconnect();
  },RECONNECT_INTERVAL);
}

function getReconnectTarget(){
  const saved = getSavedClientRoom();

  const code = roomCode || saved.roomCode;

  return {
    roomCode:code,
    hostId:
      "box-host-" + code
  };
}

function attemptReconnect(){
  if(isHost) return;
  if(gameStatus !== "WAIT_HOST") return;
  if(reconnectBusy) return;

  const target = getReconnectTarget();

  if(!target.roomCode){
    log("没有可恢复的房间号");
    return;
  }

  reconnectBusy = true;

  log(
    "尝试重新连接房主",
    target.hostId
  );

  /*
   * 第2/3段会继续实现：
   * 1. PeerJS 当前连接恢复
   * 2. Peer 重建
   * 3. resumeRequest
   * 4. Host 恢复旧玩家
   */
}


/* =========================================================
   键盘支持
   ========================================================= */

document.addEventListener("keydown",event => {
  let direction = null;

  switch(event.key){
    case "ArrowUp":
      direction = "up";
      break;

    case "ArrowDown":
      direction = "down";
      break;

    case "ArrowLeft":
      direction = "left";
      break;

    case "ArrowRight":
      direction = "right";
      break;
  }

  if(direction){
    event.preventDefault();
    sendMove(direction);
  }
});


/* =========================================================
   初始化
   ========================================================= */

renderAll();

setStatus("🟢 可以创建房间或加入房间");

authorityEl.textContent =
  "等待房主或玩家连接";

log("LAN v2.1 初始化完成");
log("玩家 Token:",playerToken);

const savedRoom = getSavedClientRoom();

if(savedRoom.roomCode){
  roomInput.value = savedRoom.roomCode;
  log(
    "发现上次房间记录:",
    savedRoom.roomCode
  );
}

startHostWatch();


/* =========================================================
   第1段结束
   第2段从这里继续
   ========================================================= */
/* =========================================================
   LAN v2.1
   第2段：Host / Join / 连接处理 / 状态恢复
   ========================================================= */


/* =========================================================
   Host：根据 Token 查找玩家
   ========================================================= */

function findPlayerByToken(token){
  if(!token) return null;

  for(const player of players.values()){
    if(player.token === token){
      return player;
    }
  }

  return null;
}

function findPlayerById(id){
  if(!id) return null;

  for(const player of players.values()){
    if(player.id === id){
      return player;
    }
  }

  return null;
}


/* =========================================================
   Host：迁移玩家 Peer ID
   ========================================================= */

function migratePlayerId(player,newId){
  if(!player || !newId) return;

  const oldId = player.id;

  if(oldId === newId){
    connections.set(newId,connections.get(newId));
    return;
  }

  /*
   * PeerJS 的 ID 可能因为客户端重建 Peer
   * 而发生变化。
   *
   * 游戏状态必须跟着“玩家”走，而不是跟着
   * 临时 Peer ID 走。
   */

  if(
    Object.prototype.hasOwnProperty.call(
      gameState.positions,
      oldId
    )
  ){
    gameState.positions[newId] =
      gameState.positions[oldId];

    delete gameState.positions[oldId];
  }

  if(
    Object.prototype.hasOwnProperty.call(
      gameState.steps,
      oldId
    )
  ){
    gameState.steps[newId] =
      gameState.steps[oldId];

    delete gameState.steps[oldId];
  }

  player.id = newId;

  saveHostBackup();
}


/* =========================================================
   Host：发送完整权威状态
   ========================================================= */

function sendFullState(connection,type){
  if(!connection) return;

  send(
    connection,
    buildStateMessage(type || "state")
  );
}


/* =========================================================
   Host：处理新玩家加入
   ========================================================= */

function hostHandleJoin(connection,message){
  if(!isHost) return;
  if(!connection) return;

  const token =
    message &&
    message.token
      ? message.token
      : null;

  const name =
    message &&
    message.name
      ? String(message.name).slice(0,12)
      : "玩家";

  /*
   * 关键：
   * 如果这个 Token 已经存在，
   * 就不是“新玩家”，而是旧玩家重新连接。
   */

  let existingPlayer =
    findPlayerByToken(token);

  if(existingPlayer && !existingPlayer.host){

    log(
      "识别为旧玩家恢复连接:",
      existingPlayer.name,
      "→",
      connection.peer
    );

    const oldConnection =
      connections.get(existingPlayer.id);

    if(
      oldConnection &&
      oldConnection !== connection
    ){
      try{
        oldConnection.close();
      }catch(e){}
    }

    migratePlayerId(
      existingPlayer,
      connection.peer
    );

    existingPlayer.name = name;

    connections.set(
      connection.peer,
      connection
    );

    send(
      connection,
      {
        type:"resume",
        room:roomCode,
        state:safeClone(gameState),
        players:buildPlayersPayload(),
        sequence:gameState.sequence
      }
    );

    broadcast(
      buildStateMessage("state")
    );

    renderAll();
    saveHostBackup();

    log(
      "玩家恢复成功:",
      existingPlayer.name
    );

    return;
  }


  /*
   * 新玩家
   */

  if(players.size >= MAX_PLAYERS){
    send(connection,{
      type:"roomFull"
    });

    log(
      "拒绝玩家：房间已满",
      connection.peer
    );

    return;
  }

  /*
   * 防止极端情况下没有 Token。
   */

  const finalToken =
    token || makePlayerToken();

  /*
   * number 使用第一个空缺号码。
   */

  const usedNumbers =
    new Set(
      Array.from(players.values())
        .map(player => player.number)
    );

  let number = 1;

  while(usedNumbers.has(number)){
    number++;
  }

  const player = {
    id:connection.peer,
    token:finalToken,
    name:name,
    host:false,
    number:number
  };

  players.set(
    connection.peer,
    player
  );

  connections.set(
    connection.peer,
    connection
  );

  /*
   * 给测试棋盘一个初始位置。
   *
   * 6 / 7 / 8 / 9 对应不同玩家。
   */

  const startPositions = [
    6,
    7,
    8,
    9
  ];

  const startPosition =
    startPositions[number - 1] ?? 6;

  gameState.positions[
    connection.peer
  ] = startPosition;

  gameState.steps[
    connection.peer
  ] = 0;

  gameState.sequence++;

  send(
    connection,
    {
      type:"welcome",
      room:roomCode,
      myToken:finalToken,
      state:safeClone(gameState),
      players:buildPlayersPayload(),
      sequence:gameState.sequence
    }
  );

  broadcast(
    buildStateMessage("state")
  );

  renderAll();
  saveHostBackup();

  log(
    "新玩家加入:",
    name,
    "P" + number,
    connection.peer
  );
}


/* =========================================================
   Host：处理玩家 resumeRequest
   ========================================================= */

function hostHandleResumeRequest(
  connection,
  message
){
  if(!isHost) return;
  if(!connection) return;

  const token =
    message &&
    message.token
      ? message.token
      : null;

  const player =
    findPlayerByToken(token);

  if(!player || player.host){
    log(
      "无法恢复玩家，Token 不存在:",
      token
    );

    send(connection,{
      type:"resumeRejected"
    });

    return;
  }

  log(
    "收到 resumeRequest:",
    player.name,
    connection.peer
  );

  const oldId = player.id;

  /*
   * 关闭同一个玩家的旧连接。
   */

  const oldConnection =
    connections.get(oldId);

  if(
    oldConnection &&
    oldConnection !== connection
  ){
    try{
      oldConnection.close();
    }catch(e){}
  }

  migratePlayerId(
    player,
    connection.peer
  );

  connections.set(
    connection.peer,
    connection
  );

  /*
   * 重新发送完整权威状态。
   */

  send(
    connection,
    {
      type:"resume",
      room:roomCode,
      myToken:player.token,
      state:safeClone(gameState),
      players:buildPlayersPayload(),
      sequence:gameState.sequence
    }
  );

  /*
   * 让其他玩家知道这个玩家已经恢复。
   */

  broadcast(
    buildStateMessage("state")
  );

  renderAll();
  saveHostBackup();

  log(
    "resume 完成:",
    player.name
  );
}


/* =========================================================
   Host：玩家移动
   ========================================================= */

function hostHandleMove(
  connection,
  message
){
  if(!isHost) return;

  if(gameStatus === "WAIT_HOST"){
    return;
  }

  if(!connection) return;

  const player =
    findPlayerById(connection.peer);

  if(!player){
    log(
      "收到未知玩家移动:",
      connection.peer
    );
    return;
  }

  const direction =
    message &&
    message.direction;

  if(
    direction !== "up" &&
    direction !== "down" &&
    direction !== "left" &&
    direction !== "right"
  ){
    return;
  }

  const oldPosition =
    gameState.positions[player.id];

  if(
    typeof oldPosition !== "number"
  ){
    return;
  }

  let nextPosition =
    oldPosition;

  switch(direction){

    case "up":
      nextPosition -= 5;
      break;

    case "down":
      nextPosition += 5;
      break;

    case "left":
      nextPosition -= 1;
      break;

    case "right":
      nextPosition += 1;
      break;
  }

  /*
   * 防止跨行移动。
   */

  const oldRow =
    Math.floor(oldPosition / 5);

  const nextRow =
    Math.floor(nextPosition / 5);

  if(
    direction === "left" &&
    nextRow !== oldRow
  ){
    return;
  }

  if(
    direction === "right" &&
    nextRow !== oldRow
  ){
    return;
  }

  if(
    nextPosition < 0 ||
    nextPosition >= 25
  ){
    return;
  }

  if(WALLS.has(nextPosition)){
    return;
  }

  /*
   * 测试版暂时允许玩家占据同一个非墙格。
   */

  gameState.positions[player.id] =
    nextPosition;

  gameState.steps[player.id] =
    (gameState.steps[player.id] || 0) + 1;

  gameState.sequence++;

  broadcast(
    buildStateMessage("state")
  );

  renderAll();
  saveHostBackup();
}


/* =========================================================
   Host：连接事件统一处理
   ========================================================= */

function hostReceive(
  connection,
  message
){
  if(!message || typeof message !== "object"){
    return;
  }

  switch(message.type){

    case "join":
      hostHandleJoin(
        connection,
        message
      );
      break;

    case "resumeRequest":
      hostHandleResumeRequest(
        connection,
        message
      );
      break;

    case "move":
      hostHandleMove(
        connection,
        message
      );
      break;

    case "resumeAck":
      log(
        "收到恢复确认:",
        connection.peer
      );
      break;

    default:
      log(
        "Host 收到未知消息:",
        message.type
      );
  }
}


/* =========================================================
   Client：替换玩家列表
   ========================================================= */

function applyPlayers(list){
  players.clear();

  if(!Array.isArray(list)){
    return;
  }

  list.forEach(item => {
    if(!item || !item.id) return;

    players.set(
      item.id,
      {
        id:item.id,
        token:item.token || null,
        name:item.name || "玩家",
        host:!!item.host,
        number:item.number || 1
      }
    );
  });
}


/* =========================================================
   Client：处理权威状态
   ========================================================= */

function applyClientState(message){
  if(!message) return;

  if(message.room){
    roomCode = message.room;
    saveClientRoom();
  }

  if(message.state){
    gameState =
      safeClone(message.state) || gameState;
  }

  if(Array.isArray(message.players)){
    applyPlayers(message.players);
  }

  lastHostHeartbeat = Date.now();

  renderAll();
}


/* =========================================================
   Client：恢复成功
   ========================================================= */

function handleResume(message){
  applyClientState(message);

  gameStatus = "PLAYING";

  stopReconnectLoop();

  document.body.classList.remove("waiting");

  setStatus("🟢 房主已恢复，游戏继续");

  authorityEl.textContent =
    "已恢复房主权威同步";

  log(
    "收到 resume，恢复游戏"
  );

  if(hostConnection){
    send(
      hostConnection,
      {
        type:"resumeAck",
        token:playerToken
      }
    );
  }

  startHostWatch();
}


/* =========================================================
   Client：消息处理
   ========================================================= */

function clientReceive(message){
  if(!message || typeof message !== "object"){
    return;
  }

  switch(message.type){

    case "heartbeat":

      lastHostHeartbeat =
        Date.now();

      if(gameStatus === "WAIT_HOST"){
        /*
         * 理论上 heartbeat 恢复即可解除等待。
         * 如果 reconnect connection 还没有完成，
         * 后面的 state/resume 会再次确认。
         */

        gameStatus = "PLAYING";

        stopReconnectLoop();

        document.body.classList.remove(
          "waiting"
        );

        setStatus(
          "🟢 房主恢复，游戏继续"
        );

        authorityEl.textContent =
          "已连接房主，等待权威状态";

        log(
          "收到房主心跳，离线状态解除"
        );
      }

      break;


    case "welcome":

      if(message.myToken){
        playerToken =
          message.myToken;

        try{
          localStorage.setItem(
            "boxpusherPlayerToken",
            playerToken
          );
        }catch(e){}
      }

      applyClientState(message);

      gameStatus = "PLAYING";

      stopReconnectLoop();

      document.body.classList.remove(
        "waiting"
      );

      setStatus(
        "🟢 已连接房主"
      );

      authorityEl.textContent =
        "本机是客户端，房主负责权威同步";

      log(
        "收到 welcome"
      );

      startHostWatch();

      break;


    case "state":

      applyClientState(message);

      /*
       * 只有在 WAIT_HOST 状态时，
       * 收到权威 state 才视为恢复。
       */

      if(gameStatus === "WAIT_HOST"){
        gameStatus = "PLAYING";

        stopReconnectLoop();

        document.body.classList.remove(
          "waiting"
        );

        setStatus(
          "🟢 房主已恢复，游戏继续"
        );

        authorityEl.textContent =
          "已恢复房主权威同步";

        log(
          "收到恢复后的 state"
        );
      }

      break;


    case "resume":

      handleResume(message);
      break;


    case "roomFull":

      gameStatus = "WAITING";

      stopReconnectLoop();

      setStatus(
        "🔴 房间已满"
      );

      authorityEl.textContent =
        "无法加入：最多4名玩家";

      log(
        "房主拒绝加入：房间已满"
      );

      break;


    case "resumeRejected":

      log(
        "房主拒绝恢复连接"
      );

      /*
       * 保持 WAIT_HOST。
       * 后续仍然可以继续尝试恢复。
       */

      reconnectBusy = false;

      break;


    default:

      log(
        "Client 收到未知消息:",
        message.type
      );
  }
}


/* =========================================================
   Connection：统一关闭处理
   ========================================================= */

function handleConnectionClose(
  connection,
  hostSide
){
  if(!connection) return;

  if(hostSide){

    /*
     * Host 不删除玩家。
     *
     * 这是 v2.1 和普通断线处理最大的区别：
     * 玩家暂时离线后，仍然保留其 Token、
     * 号码、位置、步数，等待 resume。
     */

    connections.delete(
      connection.peer
    );

    log(
      "玩家连接关闭:",
      connection.peer
    );

    renderAll();

    return;
  }

  /*
   * Client 与 Host 的连接关闭。
   */

  if(
    hostConnection === connection
  ){
    hostConnection = null;
  }

  log(
    "与房主连接关闭"
  );

  if(gameStatus !== "WAIT_HOST"){
    enterWaitHost();
  }
}


/* =========================================================
   Connection：统一错误处理
   ========================================================= */

function handleConnectionError(
  connection,
  error,
  hostSide
){
  log(
    hostSide
      ? "玩家连接错误"
      : "房主连接错误",
    error && (
      error.message ||
      error.type ||
      String(error)
    )
  );

  if(!hostSide){
    if(gameStatus !== "WAIT_HOST"){
      enterWaitHost();
    }
  }
}


/* =========================================================
   Connection：建立数据通道
   ========================================================= */

function setupConnection(
  connection,
  hostSide
){
  if(!connection) return;

  connection.on("data",message => {

    if(hostSide){
      hostReceive(
        connection,
        message
      );
    }else{
      clientReceive(message);
    }

  });

  connection.on("close",() => {
    handleConnectionClose(
      connection,
      hostSide
    );
  });

  connection.on("error",error => {
    handleConnectionError(
      connection,
      error,
      hostSide
    );
  });
}

/* =========================================================

/* =========================================================
   Host：创建 / 恢复房间
   ========================================================= */

function createHostPeer(){

  if(peer){
    try{
      peer.destroy();
    }catch(e){}
  }

  /*
   * 测试版策略：
   * 如果之前已经有房间，则继续使用同一个房间号。
   *
   * 这样：
   * box-host-ABCDE
   *
   * 在房主页面重新打开后仍然是同一个 Peer ID，
   * 客户端才能继续尝试恢复。
   */

  const savedCode =
    getSavedHostRoomCode();

  roomCode =
    savedCode || makeRoomCode();

  saveHostRoomCode(roomCode);

  isHost = true;

  myName =
    String(
      nameInput.value.trim() ||
      "房主"
    ).slice(0,12);

  gameStatus = "WAITING";

  connections.clear();
  players.clear();

  gameState = {
    positions:{},
    steps:{},
    sequence:0
  };

  /*
   * 尽可能恢复房主之前保存的游戏状态。
   */

  const backup =
    loadHostBackup(roomCode);

  if(backup && backup.state){
    gameState =
      safeClone(backup.state) || gameState;

    log(
      "发现房主备份，准备恢复房间",
      roomCode
    );
  }

  const hostPeerId =
    "box-host-" + roomCode;

  setStatus(
    "🟡 正在创建房间..."
  );

  authorityEl.textContent =
    "正在建立房主 Peer";

  renderRoom();

  peer = new Peer(
    hostPeerId,
    {
      debug:1
    }
  );

  peer.on("open",id => {

    myId = id;

    /*
     * 恢复 / 创建房主玩家。
     */

    let hostPlayer = null;

    if(backup && Array.isArray(backup.players)){
      hostPlayer =
        backup.players.find(
          player => player.host
        );
    }

    if(!hostPlayer){
      hostPlayer = {
        id:myId,
        token:"host-" + roomCode,
        name:myName,
        host:true,
        number:1
      };
    }else{
      hostPlayer = {
        id:myId,
        token:hostPlayer.token ||
          ("host-" + roomCode),
        name:myName || hostPlayer.name,
        host:true,
        number:1
      };
    }

    /*
     * 先恢复其他玩家。
     */

    if(backup && Array.isArray(backup.players)){

      backup.players.forEach(savedPlayer => {

        if(!savedPlayer) return;

        if(savedPlayer.host) return;

        if(!savedPlayer.token) return;

        players.set(
          savedPlayer.id,
          {
            id:savedPlayer.id,
            token:savedPlayer.token,
            name:savedPlayer.name || "玩家",
            host:false,
            number:savedPlayer.number || 1
          }
        );
      });
    }

    /*
     * 房主一定占据 #1。
     */

    players.set(
      myId,
      hostPlayer
    );

    /*
     * 如果恢复的数据中房主位置还是旧 ID，
     * 将其迁移到新的当前 ID。
     *
     * 正常情况下 hostPeerId 是固定的，
     * 所以这里主要是保险处理。
     */

    if(
      backup &&
      backup.state &&
      backup.players
    ){

      const oldHost =
        backup.players.find(
          player => player.host
        );

      if(
        oldHost &&
        oldHost.id !== myId
      ){

        if(
          Object.prototype.hasOwnProperty.call(
            gameState.positions,
            oldHost.id
          )
        ){
          gameState.positions[myId] =
            gameState.positions[oldHost.id];

          delete gameState.positions[oldHost.id];
        }

        if(
          Object.prototype.hasOwnProperty.call(
            gameState.steps,
            oldHost.id
          )
        ){
          gameState.steps[myId] =
            gameState.steps[oldHost.id];

          delete gameState.steps[oldHost.id];
        }
      }
    }

    /*
     * 如果没有房主位置，则给默认位置。
     */

    if(
      typeof gameState.positions[myId] !== "number"
    ){
      gameState.positions[myId] = 12;
    }

    if(
      typeof gameState.steps[myId] !== "number"
    ){
      gameState.steps[myId] = 0;
    }

    gameStatus = "PLAYING";

    setStatus(
      "🟢 房主模式，等待玩家加入"
    );

    authorityEl.textContent =
      "本机是房主，负责权威同步";

    renderAll();

    saveHostBackup();

    startHeartbeat();

    log(
      "房间创建成功:",
      roomCode
    );

    log(
      "房主 Peer:",
      myId
    );

    if(backup){
      log(
        "房间状态已恢复"
      );
    }
  });

  peer.on("connection",connection => {

    log(
      "收到玩家连接:",
      connection.peer
    );

    /*
     * PeerJS connection 本身可能已经 open，
     * 也可能稍后才 open。
     */

    const handleOpen = () => {

      setupConnection(
        connection,
        true
      );

      connections.set(
        connection.peer,
        connection
      );

      log(
        "玩家数据通道打开:",
        connection.peer
      );
    };

    if(connection.open){
      handleOpen();
    }else{
      connection.on(
        "open",
        handleOpen
      );
    }
  });

  peer.on("disconnected",() => {

    log(
      "Host Peer 与 PeerJS 服务器断开"
    );

    /*
     * PeerJS 的 signaling 断开不等于
     * 游戏连接一定断开。
     *
     * 尝试恢复 signaling。
     */

    try{
      if(peer && !peer.destroyed){
        peer.reconnect();
      }
    }catch(e){
      log(
        "Host Peer reconnect 失败",
        e.message || e
      );
    }
  });

  peer.on("close",() => {

    log(
      "Host Peer 已关闭"
    );

    stopHeartbeat();

    setStatus(
      "🔴 房主 Peer 已关闭"
    );
  });

  peer.on("error",error => {

    log(
      "Host Peer 错误:",
      error &&
      (
        error.type ||
        error.message ||
        String(error)
      )
    );

    /*
     * ID 已被占用通常意味着：
     * 另一个页面仍然持有同一个房间。
     *
     * 不自动生成新房间，因为那会破坏
     * 客户端的自动恢复机制。
     */

    setStatus(
      "🔴 房主连接错误，请查看日志"
    );
  });
}


/* =========================================================
   Client：连接指定 Host
   ========================================================= */

function connectClientToHost(
  hostId,
  sendResume
){
  if(!peer) return false;

  if(
    peer.destroyed ||
    peer.disconnected
  ){
    return false;
  }

  let connection = null;

  try{
    connection = peer.connect(
      hostId,
      {
        reliable:true
      }
    );
  }catch(e){

    reconnectBusy = false;

    log(
      "连接房主失败:",
      e.message || e
    );

    return false;
  }

  if(!connection){
    reconnectBusy = false;
    return false;
  }

  hostConnection = connection;

  const onOpen = () => {

    setupConnection(
      connection,
      false
    );

    reconnectBusy = false;

    log(
      sendResume
        ? "重新连接房主成功"
        : "连接房主成功"
    );

    if(sendResume){

      /*
       * 不重新 join。
       *
       * 使用稳定 Token 告诉房主：
       * “我是之前那个玩家。”
       */

      send(
        connection,
        {
          type:"resumeRequest",
          token:playerToken,
          name:myName
        }
      );

      setStatus(
        "🟡 已重新连接，正在恢复游戏..."
      );

    }else{

      send(
        connection,
        {
          type:"join",
          token:playerToken,
          name:myName
        }
      );

      setStatus(
        "🟡 已连接房主，等待房间状态..."
      );
    }
  };

  if(connection.open){
    onOpen();
  }else{
    connection.on(
      "open",
      onOpen
    );
  }

  return true;
}


/* =========================================================
   Client：创建 Peer
   ========================================================= */

function createClientPeer(
  sendResume
){
  if(peer){

    try{
      if(!peer.destroyed){
        /*
         * 如果只是 signaling disconnected，
         * 先尝试 reconnect，而不是立即销毁。
         */
        if(peer.disconnected){
          peer.reconnect();

          setTimeout(() => {

            if(
              peer &&
              !peer.destroyed &&
              !peer.disconnected
            ){
              const target =
                getReconnectTarget();

              connectClientToHost(
                target.hostId,
                sendResume
              );
            }else{
              createFreshClientPeer(
                sendResume
              );
            }

          },1000);

          return;
        }

        /*
         * Peer 仍然正常存在。
         */
        const target =
          getReconnectTarget();

        connectClientToHost(
          target.hostId,
          sendResume
        );

        return;
      }
    }catch(e){
      log(
        "尝试恢复旧 Peer 失败:",
        e.message || e
      );
    }
  }

  createFreshClientPeer(
    sendResume
  );
}


/* =========================================================
   Client：彻底重建 Peer
   ========================================================= */

function createFreshClientPeer(
  sendResume
){

  if(peer){

    try{
      peer.destroy();
    }catch(e){}
  }

  peer = null;
  hostConnection = null;

  setStatus(
    sendResume
      ? "🟡 正在重建网络连接..."
      : "🟡 正在连接房主..."
  );

  peer = new Peer(
    undefined,
    {
      debug:1
    }
  );

  peer.on("open",id => {

    myId = id;

    log(
      "Client Peer 创建:",
      id
    );

    const target =
      getReconnectTarget();

    if(!target.hostId){
      reconnectBusy = false;

      log(
        "没有有效房主 ID"
      );

      return;
    }

    connectClientToHost(
      target.hostId,
      sendResume
    );
  });

  peer.on("disconnected",() => {

    log(
      "Client Peer signaling 断开"
    );

    try{
      if(peer && !peer.destroyed){
        peer.reconnect();
      }
    }catch(e){
      log(
        "Client Peer reconnect 失败",
        e.message || e
      );
    }
  });

  peer.on("close",() => {

    log(
      "Client Peer 已关闭"
    );

    if(gameStatus !== "WAIT_HOST"){
      enterWaitHost();
    }
  });

  peer.on("error",error => {

    reconnectBusy = false;

    log(
      "Client Peer 错误:",
      error &&
      (
        error.type ||
        error.message ||
        String(error)
      )
    );

    /*
     * 如果已经在游戏中，错误不立即
     * 把状态改成 WAIT_HOST，
     * 因为 PeerJS signaling 错误不一定
     * 代表当前数据连接断开。
     *
     * 真正的数据连接 close/error 会负责
     * 进入 WAIT_HOST。
     */
  });
}


/* =========================================================
   Client：自动恢复连接
   ========================================================= */

function attemptReconnect(){

  if(isHost) return;

  if(gameStatus !== "WAIT_HOST"){
    return;
  }

  if(reconnectBusy){
    return;
  }

  const target =
    getReconnectTarget();

  if(
    !target.roomCode ||
    !target.hostId
  ){
    log(
      "没有可恢复的房间信息"
    );

    return;
  }

  reconnectBusy = true;

  log(
    "尝试恢复:",
    target.roomCode,
    target.hostId
  );

  /*
   * 优先复用现有 Peer。
   * 如果 Peer 已经死亡，则 createClientPeer
   * 会建立一个新的 Peer ID。
   */

  if(
    peer &&
    !peer.destroyed &&
    !peer.disconnected
  ){

    /*
     * 旧的 hostConnection 可能已经关闭。
     */

    if(hostConnection){

      try{
        hostConnection.close();
      }catch(e){}
    }

    hostConnection = null;

    connectClientToHost(
      target.hostId,
      true
    );

    return;
  }

  /*
   * Peer 不可用，重建。
   */

  reconnectBusy = false;

  createClientPeer(true);
}


/* =========================================================
   Host / Client：发送移动
   ========================================================= */

function sendMove(direction){

  if(
    direction !== "up" &&
    direction !== "down" &&
    direction !== "left" &&
    direction !== "right"
  ){
    return;
  }

  if(gameStatus === "WAIT_HOST"){

    log(
      "游戏暂停，忽略移动:",
      direction
    );

    return;
  }

  if(gameStatus !== "PLAYING"){

    log(
      "当前不能移动:",
      gameStatus
    );

    return;
  }

  /*
   * 房主自己移动：
   * 不经过 PeerJS，直接进入权威逻辑。
   */

  if(isHost){

    hostHandleMove(
      {
        peer:myId
      },
      {
        type:"move",
        direction:direction
      }
    );

    return;
  }

  /*
   * 普通玩家：
   * 只发送命令给房主。
   */

  if(
    hostConnection &&
    hostConnection.open
  ){

    send(
      hostConnection,
      {
        type:"move",
        direction:direction
      }
    );

  }else{

    log(
      "没有可用的房主连接"
    );

    enterWaitHost();
  }
}


/* =========================================================
   创建房间
   ========================================================= */

createButton.addEventListener(
  "click",
  () => {

    if(
      peer &&
      !peer.destroyed
    ){
      try{
        peer.destroy();
      }catch(e){}
    }

    stopReconnectLoop();
    stopHeartbeat();

    isHost = true;

    createHostPeer();
  }
);


/* =========================================================
   加入房间
   ========================================================= */

joinButton.addEventListener(
  "click",
  () => {

    const code =
      String(
        roomInput.value || ""
      )
      .trim()
      .toUpperCase();

    if(!code){

      setStatus(
        "🔴 请输入房间号"
      );

      return;
    }

    if(code.length !== 5){

      setStatus(
        "🔴 房间号应为5位"
      );

      return;
    }

    /*
     * 如果已有 Peer，先清理。
     */

    if(
      peer &&
      !peer.destroyed
    ){

      try{
        peer.destroy();
      }catch(e){}
    }

    peer = null;
    hostConnection = null;

    stopReconnectLoop();

    isHost = false;

    roomCode = code;

    myName =
      String(
        nameInput.value.trim() ||
        "玩家"
      ).slice(0,12);

    saveClientRoom();

    gameStatus = "WAITING";

    setStatus(
      "🟡 正在连接房主..."
    );

    authorityEl.textContent =
      "正在建立客户端连接";

    renderRoom();

    log(
      "准备加入房间:",
      roomCode
    );

    createFreshClientPeer(
      false
    );
  }
);


/* =========================================================
   方向按钮
   ========================================================= */

document.querySelectorAll(
  "[data-dir]"
).forEach(button => {

  button.addEventListener(
    "click",
    () => {

      const direction =
        button.dataset.dir;

      sendMove(direction);
    }
  );

});


/* =========================================================
   输入框：房间号自动大写
   ========================================================= */

roomInput.addEventListener(
  "input",
  () => {

    roomInput.value =
      roomInput.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g,"")
        .slice(0,5);
  }
);


/* =========================================================
   页面进入后台 / 回到前台
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(document.visibilityState === "visible"){

      log(
        "页面回到前台"
      );

      /*
       * Host：
       * 如果 Peer 还活着，继续服务。
       */

      if(isHost){

        if(
          peer &&
          peer.disconnected &&
          !peer.destroyed
        ){

          try{
            peer.reconnect();

            log(
              "Host 尝试恢复 PeerJS signaling"
            );
          }catch(e){}
        }

        return;
      }

      /*
       * Client：
       * 如果此前已经进入 WAIT_HOST，
       * 立即触发一次恢复尝试，而不是
       * 等完整的3秒周期。
       */

      if(gameStatus === "WAIT_HOST"){

        reconnectBusy = false;

        attemptReconnect();

      }else if(
        roomCode &&
        hostConnection &&
        !hostConnection.open
      ){

        /*
         * 页面回来后发现连接已经关闭。
         */

        enterWaitHost();
      }
    }
  }
);


/* =========================================================
   页面卸载
   ========================================================= */

window.addEventListener(
  "pagehide",
  () => {

    /*
     * 不主动清除 localStorage：
     * 这是 v2.1 自动恢复的关键。
     */

    if(isHost){
      saveHostBackup();
    }
  }
);


/* =========================================================
   最终初始化
   ========================================================= */

renderAll();

log(
  "LAN v2.1 已加载"
);

log(
  "稳定玩家 Token:",
  playerToken
);

if(savedRoom.roomCode){
  log(
    "可恢复房间:",
    savedRoom.roomCode
  );
}

setStatus(
  "🟢 可以创建房间或加入房间"
);

authorityEl.textContent =
  "等待网络操作";


/* =========================================================
   HTML 完成
   ========================================================= */

</script>
</body>
</html>
