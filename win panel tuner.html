<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>过关面板 调参工具</title>
<style>
  :root {
    --wp-title-size: 30px;
    --wp-steps-size: 25px;
    --wp-best-size: 18px;
    --wp-star-size: 48px;
    --wp-crown-big: 72px;
    --wp-foot-h: 27px;
    --wp-crown-h: 21px;
    --wp-btn-width: 28%;
    --wp-btn-bottom: 9%;
    --wp-title-weight: 900;
    --wp-title-ls: 2px;
    --wp-text-color: #3a2415;
    --wp-font: 'PingFang SC';
    --wp-stroke-w: 0.035em;
    --wp-stroke-color: 255,235,205;
    --wp-stroke-a: 0.4;
    --wp-sh1-color: 255,240,215;
    --wp-sh1-a: 0.6;
    --wp-sh1-y: 1px;
    --wp-sh2-color: 74,47,23;
    --wp-sh2-a: 0.28;
    --wp-sh2-y: 3px;
    --wp-sh2-blur: 4px;
    --wp-div-color: #8a6a45;
    --wp-div-w: 55%;
    --wp-div-h: 1px;
    --wp-div-my: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 14px 14px 60px; background: #2b3a2e; color: #eee;
    font-family: -apple-system, 'PingFang SC', sans-serif; font-size: 15px;
  }
  h1 { font-size: 17px; margin: 4px 0 12px; color: #fff; }
  h2 { font-size: 14px; margin: 22px 0 8px; color: #ffce6b; border-bottom: 1px solid #4a5c4d; padding-bottom: 4px; }
  .previewWrap { position: sticky; top: 0; z-index: 5; background: #2b3a2e; padding-bottom: 10px; }
  .stage {
    position: relative; width: 240px; aspect-ratio: 864/1301; margin: 0 auto;
    background: url('assets/UI/panel_win_wood.webp') center/100% 100% no-repeat;
  }
  .wpTitle {
    position: absolute; left: 0; right: 0; top: 8%; text-align: center;
    font-family: var(--wp-font), sans-serif; font-weight: var(--wp-title-weight);
    font-size: var(--wp-title-size); letter-spacing: var(--wp-title-ls); color: var(--wp-text-color);
    -webkit-text-stroke: var(--wp-stroke-w) rgba(var(--wp-stroke-color), var(--stroke-on, var(--wp-stroke-a)));
    paint-order: stroke fill;
    text-shadow: 0 var(--wp-sh1-y) 0 rgba(var(--wp-sh1-color), var(--wp-sh1-a)),
                 0 var(--wp-sh2-y) var(--wp-sh2-blur) rgba(var(--wp-sh2-color), var(--wp-sh2-a));
  }
  .wpBody { position: absolute; left: 12%; right: 12%; top: 21%; bottom: 27%; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; }
  .wpStars { display: flex; gap: 12px; position: relative; }
  .wpStars img, .wpStars .crownBig { width: var(--wp-star-size); height: var(--wp-star-size); filter: drop-shadow(0 2px 1px rgba(74,47,23,0.35)); }
  .wpStars .crownBig { width: var(--wp-crown-big); height: var(--wp-crown-big); }
  .wpLine {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    font-family: var(--wp-font), sans-serif; font-weight: 700; color: var(--wp-text-color);
    text-shadow: 0 var(--wp-sh1-y) 0 rgba(var(--wp-sh1-color), var(--wp-sh1-a));
  }
  .wpLine img { filter: drop-shadow(0 1px 1px rgba(74,47,23,0.3)); }
  #lnSteps { font-size: var(--wp-steps-size); }
  #lnSteps img { height: var(--wp-foot-h); }
  #lnBest { font-size: var(--wp-best-size); opacity: 0.85; }
  #lnBest img { height: var(--wp-crown-h); }
  .wpDivider { width: var(--wp-div-w); height: var(--wp-div-h); background: var(--wp-div-color); margin: var(--wp-div-my) 0; opacity: 0.6; }
  .wpBtns { position: absolute; left: 0; right: 0; bottom: var(--wp-btn-bottom); display: flex; justify-content: center; gap: 8%; }
  .wpBtns img { width: var(--wp-btn-width); aspect-ratio: 256/211; }
  .row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  .row label { flex: 0 0 118px; font-size: 12.5px; color: #cfcabb; }
  .row input[type=range] { flex: 1; }
  .row input[type=color] { width: 40px; height: 30px; border: none; padding: 0; background: none; }
  .row select { flex: 1; padding: 4px; }
  .row .val { flex: 0 0 54px; text-align: right; font-size: 12px; color: #9fd0a0; }
  .stateBtns { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .stateBtns button { flex: 1; padding: 10px 6px; background: #3d5240; color: #fff; border: none; border-radius: 8px; font-size: 13px; }
  .stateBtns button.active { background: #b8814a; }
  #out { width: 100%; height: 160px; margin-top: 8px; font-family: monospace; font-size: 12px; background: #1c2620; color: #b8e0b8; border: 1px solid #4a5c4d; border-radius: 6px; padding: 8px; }
  .exportBtn { width: 100%; padding: 12px; margin-top: 10px; background: #b8814a; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; }
  .copyBtn { width: 100%; padding: 10px; margin-top: 6px; background: #3d5240; color: #fff; border: none; border-radius: 8px; font-size: 13px; }
  .hint { font-size: 12px; color: #9aa08e; margin-top: 4px; line-height: 1.5; }
  .checkRow { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
</style>
</head>
<body>

<h1>过关面板 · 调参工具（临时用，调完删掉）</h1>

<div class="previewWrap">
  <div class="stage" id="stage">
    <div class="wpTitle" id="wpTitle">通关</div>
    <div class="wpBody">
      <div class="wpStars" id="wpStars">
        <img src="assets/UI/icons/icon_star.svg" id="s1">
        <img src="assets/UI/icons/icon_star.svg" id="s2">
        <img src="assets/UI/icons/icon_star_empty.svg" id="s3">
      </div>
      <div class="wpLine" id="lnSteps"><img src="assets/UI/icons/icon_footstep.png"><span>本局 40 步</span></div>
      <div class="wpDivider" id="wpDivider"></div>
      <div class="wpLine" id="lnBest"><img src="assets/UI/icons/icon_crown_brown.png"><span>最佳 33 步</span></div>
    </div>
    <div class="wpBtns">
      <img src="assets/UI/btn_win_retry.png">
      <img src="assets/UI/btn_win_next.png">
    </div>
  </div>
</div>

<div class="stateBtns">
  <button data-state="normal" class="active" onclick="setState('normal')">普通通关</button>
  <button data-state="perfect" onclick="setState('perfect')">完美通关</button>
</div>

<h2>标题「通关 / 完美通关」</h2>
<div class="row"><label>字体</label>
  <select id="font" oninput="setVar('--wp-font', this.value, true)">
    <option value="PingFang SC">PingFang SC(苹方，默认)</option>
    <option value="Heiti SC">Heiti SC(黑体)</option>
    <option value="STHeiti">STHeiti(华文黑体)</option>
    <option value="Hiragino Sans GB">Hiragino Sans GB(冬青黑体)</option>
    <option value="Songti SC">Songti SC(宋体，非游戏风，仅供对比)</option>
    <option value="system-ui">system-ui(系统默认)</option>
  </select>
</div>
<div class="row"><label>标题字号</label><input type="range" min="16" max="44" value="30" oninput="setVar('--wp-title-size', this.value+'px'); showVal('vTitleSize', this.value+'px')"><span class="val" id="vTitleSize">30px</span></div>
<div class="row"><label>本局字号</label><input type="range" min="12" max="34" value="25" oninput="setVar('--wp-steps-size', this.value+'px'); showVal('vStepsSize', this.value+'px')"><span class="val" id="vStepsSize">25px</span></div>
<div class="row"><label>最佳字号</label><input type="range" min="10" max="26" value="18" oninput="setVar('--wp-best-size', this.value+'px'); showVal('vBestSize', this.value+'px')"><span class="val" id="vBestSize">18px</span></div>
<div class="row"><label>字重</label>
  <select oninput="setVar('--wp-title-weight', this.value)">
    <option value="400">常规 400</option><option value="600">半粗 600</option><option value="700">加粗 700</option>
    <option value="800">很粗 800</option><option value="900" selected>最粗 900</option>
  </select>
</div>
<div class="row"><label>字距</label><input type="range" min="0" max="6" value="2" oninput="setVar('--wp-title-ls', this.value+'px'); showVal('vLs', this.value+'px')"><span class="val" id="vLs">2px</span></div>
<div class="row"><label>文字颜色</label><input type="color" value="#3a2415" oninput="setVar('--wp-text-color', this.value)"></div>

<div class="checkRow"><input type="checkbox" id="strokeOn" checked onchange="setVar('--stroke-on', this.checked? 'var(--wp-stroke-a)':'0')"><label for="strokeOn">开启文字高光描边</label></div>
<div class="row"><label>描边粗细</label><input type="range" min="0" max="8" value="3.5" step="0.5" oninput="setVar('--wp-stroke-w', (this.value/100)+'em'); showVal('vStrokeW', this.value+'%')"><span class="val" id="vStrokeW">3.5%</span></div>
<div class="row"><label>阴影1(高光)</label><input type="range" min="0" max="1" value="0.6" step="0.05" oninput="setVar('--wp-sh1-a', this.value); showVal('vSh1', this.value)"><span class="val" id="vSh1">0.6</span></div>
<div class="row"><label>阴影2(投影)深浅</label><input type="range" min="0" max="1" value="0.28" step="0.02" oninput="setVar('--wp-sh2-a', this.value); showVal('vSh2', this.value)"><span class="val" id="vSh2">0.28</span></div>
<div class="row"><label>阴影2 模糊</label><input type="range" min="0" max="10" value="4" oninput="setVar('--wp-sh2-blur', this.value+'px'); showVal('vSh2b', this.value+'px')"><span class="val" id="vSh2b">4px</span></div>

<h2>图标 / 星星 / 皇冠</h2>
<div class="row"><label>脚印图标高</label><input type="range" min="14" max="40" value="27" oninput="setVar('--wp-foot-h', this.value+'px'); showVal('vFoot', this.value+'px')"><span class="val" id="vFoot">27px</span></div>
<div class="row"><label>皇冠图标高</label><input type="range" min="10" max="34" value="21" oninput="setVar('--wp-crown-h', this.value+'px'); showVal('vCrownH', this.value+'px')"><span class="val" id="vCrownH">21px</span></div>
<div class="row"><label>三星大小</label><input type="range" min="24" max="70" value="48" oninput="setVar('--wp-star-size', this.value+'px'); showVal('vStar', this.value+'px')"><span class="val" id="vStar">48px</span></div>
<div class="row"><label>完美大皇冠</label><input type="range" min="40" max="110" value="72" oninput="setVar('--wp-crown-big', this.value+'px'); showVal('vCrownBig', this.value+'px')"><span class="val" id="vCrownBig">72px</span></div>

<h2>分隔线（本局 / 最佳 之间）</h2>
<div class="checkRow"><input type="checkbox" id="divOn" checked onchange="document.getElementById('wpDivider').style.display=this.checked?'block':'none'"><label for="divOn">显示分隔线</label></div>
<div class="row"><label>线宽</label><input type="range" min="20" max="90" value="55" oninput="setVar('--wp-div-w', this.value+'%'); showVal('vDivW', this.value+'%')"><span class="val" id="vDivW">55%</span></div>
<div class="row"><label>线粗细</label><input type="range" min="1" max="5" value="1" oninput="setVar('--wp-div-h', this.value+'px'); showVal('vDivH', this.value+'px')"><span class="val" id="vDivH">1px</span></div>
<div class="row"><label>上下间距</label><input type="range" min="0" max="26" value="10" oninput="setVar('--wp-div-my', this.value+'px'); showVal('vDivMy', this.value+'px')"><span class="val" id="vDivMy">10px</span></div>
<div class="row"><label>线颜色</label><input type="color" value="#8a6a45" oninput="setVar('--wp-div-color', this.value)"></div>

<h2>按钮</h2>
<div class="row"><label>按钮宽度</label><input type="range" min="18" max="38" value="28" oninput="setVar('--wp-btn-width', this.value+'%'); showVal('vBtnW', this.value+'%')"><span class="val" id="vBtnW">28%</span></div>
<div class="row"><label>离底边距离</label><input type="range" min="2" max="18" value="9" oninput="setVar('--wp-btn-bottom', this.value+'%'); showVal('vBtnB', this.value+'%')"><span class="val" id="vBtnB">9%</span></div>

<button class="exportBtn" onclick="doExport()">导出参数（调完点这个）</button>
<button class="copyBtn" onclick="doCopy()">复制到剪贴板</button>
<textarea id="out" readonly placeholder="点上面「导出参数」，这里会生成一段文字，复制后发给 Claude 就行"></textarea>
<div class="hint">用法：改上面的滑块/颜色/下拉框，卡片会实时变化。用「普通通关／完美通关」切换看两种状态。都满意了点「导出参数」，把生成的文字复制发给 Claude，让它照这个改正式的 index.html。这个文件调完可以直接从 GitHub 删掉，用不着长期留着。</div>

<script>
const stage = document.getElementById('stage');
function setVar(name, value, isFont) {
  stage.style.setProperty(name, isFont ? "'" + value + "'" : value);
}
function showVal(id, text) { document.getElementById(id).textContent = text; }

function setState(state) {
  document.querySelectorAll('.stateBtns button').forEach(b => b.classList.toggle('active', b.dataset.state === state));
  const title = document.getElementById('wpTitle');
  const stars = document.getElementById('wpStars');
  if (state === 'perfect') {
    title.textContent = '完美通关';
    stars.innerHTML = '<img class="crownBig" src="assets/UI/icons/icon_crown.svg">';
  } else {
    title.textContent = '通关';
    stars.innerHTML = '<img src="assets/UI/icons/icon_star.svg" id="s1"><img src="assets/UI/icons/icon_star.svg" id="s2"><img src="assets/UI/icons/icon_star_empty.svg" id="s3">';
  }
}

function doExport() {
  const cs = getComputedStyle(stage);
  const g = n => cs.getPropertyValue(n).trim();
  const text =
`标题：字体=${g('--wp-font').replace(/'/g,'')}  字号=${g('--wp-title-size')}  字重=${g('--wp-title-weight')}  字距=${g('--wp-title-ls')}  颜色=${g('--wp-text-color')}
描边：${document.getElementById('strokeOn').checked ? '开，粗细='+g('--wp-stroke-w') : '关'}
阴影1(高光)透明度=${g('--wp-sh1-a')}
阴影2(投影)透明度=${g('--wp-sh2-a')}  模糊=${g('--wp-sh2-blur')}
本局：字号=${g('--wp-steps-size')}  脚印图标高=${g('--wp-foot-h')}
最佳：字号=${g('--wp-best-size')}  皇冠图标高=${g('--wp-crown-h')}
星星大小=${g('--wp-star-size')}   完美大皇冠=${g('--wp-crown-big')}
分隔线：${document.getElementById('divOn').checked ? '开' : '关'}  线宽=${g('--wp-div-w')}  粗细=${g('--wp-div-h')}  上下间距=${g('--wp-div-my')}  颜色=${g('--wp-div-color')}
按钮：宽度=${g('--wp-btn-width')}  离底边=${g('--wp-btn-bottom')}`;
  document.getElementById('out').value = text;
}
function doCopy() {
  const t = document.getElementById('out');
  if (!t.value) { doExport(); }
  t.select(); t.setSelectionRange(0, 999999);
  navigator.clipboard && navigator.clipboard.writeText(t.value).catch(()=>{ document.execCommand('copy'); });
}
</script>
</body>
</html>
