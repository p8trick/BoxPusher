<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>BGM Loop Test V2</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 18px 14px 40px;
    background: #f3f0e8;
    color: #333;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

.wrap {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    font-size: 23px;
    margin: 4px 0 4px;
}

.subtitle {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-bottom: 18px;
}

.panel {
    background: #fff;
    border: 1px solid #d5cfc2;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
}

.sectionTitle {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 10px;
}

.current {
    text-align: center;
    font-size: 25px;
    font-weight: 700;
    margin: 3px 0 5px;
}

.status {
    text-align: center;
    color: #777;
    font-size: 13px;
    min-height: 20px;
    margin-bottom: 12px;
}

button {
    border: 1px solid #c9c1b4;
    background: #fff;
    color: #333;
    border-radius: 10px;
    min-height: 44px;
    padding: 8px 12px;
    font-size: 15px;
    font-weight: 600;
    touch-action: manipulation;
}

button:active {
    transform: scale(.97);
}

button.active {
    background: #dfead4;
    border-color: #8da56f;
    box-shadow: inset 0 0 0 2px #b9cba6;
}

button.danger {
    background: #f2e2de;
    border-color: #d2aaa0;
}

.transport {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 7px;
}

.tracks {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.modes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.delayRow {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
}

.schemeGrid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
}

.schemeBtn {
    text-align: left;
    min-height: 52px;
}

.schemeBtn strong {
    display: block;
    font-size: 15px;
    margin-bottom: 2px;
}

.schemeBtn span {
    display: block;
    color: #777;
    font-size: 12px;
    font-weight: 400;
}

.log {
    height: 210px;
    overflow-y: auto;
    background: #1d1d1d;
    color: #d8d8d8;
    border-radius: 9px;
    padding: 10px;
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;
    font-size: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
}

.logBtns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
}

.note {
    color: #777;
    font-size: 12px;
    line-height: 1.5;
    margin-top: 9px;
}

@media (max-width: 420px) {

    .transport {
        grid-template-columns: 1fr 1fr;
    }

}
</style>
</head>

<body>

<div class="wrap">

    <h1>🎵 BGM Loop Test V2</h1>

    <div class="subtitle">
        5 种循环方案 × 6 首 BGM
    </div>


    <!-- 当前状态 -->
    <div class="panel">

        <div class="current" id="currentTitle">
            BGM 01
        </div>

        <div class="status" id="status">
            等待操作
        </div>

        <div class="transport">
            <button id="prevBtn">⏮ 上一首</button>
            <button id="playBtn">▶ 播放</button>
            <button id="nextBtn">⏭ 下一首</button>
            <button id="stopBtn" class="danger">■ 停止</button>
        </div>

    </div>


    <!-- 曲目 -->
    <div class="panel">

        <div class="sectionTitle">
            选择 BGM
        </div>

        <div class="tracks">

            <button class="trackBtn active" data-track="0">
                BGM 01
            </button>

            <button class="trackBtn" data-track="1">
                BGM 02
            </button>

            <button class="trackBtn" data-track="2">
                BGM 03
            </button>

            <button class="trackBtn" data-track="3">
                BGM 04
            </button>

            <button class="trackBtn" data-track="4">
                BGM 05
            </button>

            <button class="trackBtn" data-track="5">
                BGM 06
            </button>

        </div>

    </div>


    <!-- 播放范围 -->
    <div class="panel">

        <div class="sectionTitle">
            测试范围
        </div>

        <div class="modes">

            <button class="rangeBtn active"
                    data-range="single">
                🎵 当前曲单曲循环
            </button>

            <button class="rangeBtn"
                    data-range="playlist">
                🔁 6 首串烧循环
            </button>

        </div>

        <div class="note">
            串烧顺序：01 → 02 → 03 → 04 → 05 → 06 → 01……
        </div>

    </div>


    <!-- 方案3参数 -->
    <div class="panel">

        <div class="sectionTitle">
            方案 3：提前切换时间
        </div>

        <div class="delayRow">

            <button class="delayBtn"
                    data-delay="20">
                20 ms
            </button>

            <button class="delayBtn active"
                    data-delay="50">
                50 ms
            </button>

            <button class="delayBtn"
                    data-delay="100">
                100 ms
            </button>

        </div>

    </div>


    <!-- 五种方案 -->
    <div class="panel">

        <div class="sectionTitle">
            循环方案
        </div>

        <div class="schemeGrid">

            <button class="schemeBtn"
                    data-scheme="1">

                <strong>① 原生 audio.loop</strong>

                <span>
                    HTMLAudioElement · loop = true
                </span>

            </button>


            <button class="schemeBtn"
                    data-scheme="2">

                <strong>② ended → currentTime = 0</strong>

                <span>
                    播放结束后重新定位并 play()
                </span>

            </button>


            <button class="schemeBtn"
                    data-scheme="3">

                <strong>③ 提前切换</strong>

                <span>
                    在结尾前 20 / 50 / 100 ms 开始下一轮
                </span>

            </button>


            <button class="schemeBtn"
                    data-scheme="4">

                <strong>④ 双 Audio 交接</strong>

                <span>
                    两个 Audio 元素交替播放
                </span>

            </button>


            <button class="schemeBtn"
                    data-scheme="5">

                <strong>⑤ AudioBufferSourceNode.loop</strong>

                <span>
                    Web Audio · 上次测试的最佳方案
                </span>

            </button>

        </div>

    </div>


    <!-- 日志 -->
    <div class="panel">

        <div class="sectionTitle">
            日志
        </div>

        <div class="log" id="log"></div>

        <div class="logBtns">

            <button id="clearBtn">
                清空日志
            </button>

            <button id="copyBtn">
                复制日志
            </button>

        </div>

    </div>

</div>


<script>

const TRACK_COUNT = 6;

const files = Array.from(
    { length: TRACK_COUNT },
    (_, i) =>
        `bgm${String(i + 1).padStart(2, "0")}.ogg`
);


let currentTrack = 0;

let rangeMode = "single";

let scheme = 5;

let earlyDelay = 50;

let audioContext = null;

let currentAudio = null;

let secondAudio = null;

let currentSource = null;

let playing = false;

let endedHandler = null;

let timer = null;

let buffers = new Array(TRACK_COUNT).fill(null);

let bufferLoading =
    new Array(TRACK_COUNT).fill(null);



/* =========================
   DOM
========================= */

const currentTitle =
    document.getElementById("currentTitle");

const status =
    document.getElementById("status");

const logBox =
    document.getElementById("log");



/* =========================
   Log
========================= */

function log(message) {

    const d = new Date();

    const time =
        d.toLocaleTimeString([], {
            hour12: false
        });

    logBox.textContent +=
        `[${time}] ${message}\n`;

    logBox.scrollTop =
        logBox.scrollHeight;
}



/* =========================
   UI
========================= */

function updateUI() {

    currentTitle.textContent =
        `BGM ${String(currentTrack + 1).padStart(2, "0")}`;

    document
        .querySelectorAll(".trackBtn")
        .forEach((btn, i) => {

            btn.classList.toggle(
                "active",
                i === currentTrack
            );
        });

    document
        .querySelectorAll(".rangeBtn")
        .forEach(btn => {

            btn.classList.toggle(
                "active",
                btn.dataset.range === rangeMode
            );
        });

    document
        .querySelectorAll(".delayBtn")
        .forEach(btn => {

            btn.classList.toggle(
                "active",
                Number(btn.dataset.delay) === earlyDelay
            );
        });

    document
        .querySelectorAll(".schemeBtn")
        .forEach(btn => {

            btn.classList.toggle(
                "active",
                Number(btn.dataset.scheme) === scheme
            );
        });
}



/* =========================
   AudioContext
========================= */

function ensureContext() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        log(
            `AudioContext 创建 · ${audioContext.state}`
        );
    }

    return audioContext;
}


async function unlockContext() {

    const ctx = ensureContext();

    if (ctx.state === "suspended") {

        await ctx.resume();

        log(
            `AudioContext resume · ${ctx.state}`
        );
    }
}



/* =========================
   Load buffer
========================= */

async function loadBuffer(index) {

    if (buffers[index]) {
        return buffers[index];
    }

    if (bufferLoading[index]) {
        return bufferLoading[index];
    }

    bufferLoading[index] =
        (async () => {

            const file = files[index];

            log(`⏳ 解码 ${file}`);

            const response =
                await fetch(file);

            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const arrayBuffer =
                await response.arrayBuffer();

            const ctx =
                ensureContext();

            const buffer =
                await ctx.decodeAudioData(
                    arrayBuffer
                );

            buffers[index] = buffer;

            log(
                `✓ ${file} · ` +
                `${buffer.duration.toFixed(3)} 秒`
            );

            return buffer;

        })();

    try {

        return await bufferLoading[index];

    } finally {

        bufferLoading[index] = null;
    }
}



/* =========================
   Stop everything
========================= */

function stopAll() {

    playing = false;

    if (timer) {
        clearTimeout(timer);
        timer = null;
    }


    if (currentAudio) {

        currentAudio.onended = null;

        try {
            currentAudio.pause();
        } catch (_) {}

        try {
            currentAudio.currentTime = 0;
        } catch (_) {}

        currentAudio = null;
    }


    if (secondAudio) {

        secondAudio.onended = null;

        try {
            secondAudio.pause();
        } catch (_) {}

        try {
            secondAudio.currentTime = 0;
        } catch (_) {}

        secondAudio = null;
    }


    if (currentSource) {

        try {
            currentSource.onended = null;
            currentSource.stop();
        } catch (_) {}

        try {
            currentSource.disconnect();
        } catch (_) {}

        currentSource = null;
    }


    status.textContent = "已停止";

    log("⏹ 停止全部播放");
}



/* =========================
   Scheme 1
   native audio.loop
========================= */

async function playScheme1(index) {

    const audio =
        new Audio(files[index]);

    audio.loop = true;

    audio.preload = "auto";

    currentAudio = audio;

    audio.addEventListener(
        "play",
        () => {

            log(
                `▶ 方案1 · BGM ${index + 1}`
            );

        },
        { once: true }
    );

    await audio.play();

    status.textContent =
        "方案 1 · 原生 loop";

    return audio;
}



/* =========================
   Scheme 2
   ended → currentTime=0
========================= */

async function playScheme2(index) {

    const audio =
        new Audio(files[index]);

    audio.preload = "auto";

    currentAudio = audio;

    let count = 0;

    audio.addEventListener(
        "ended",
        async () => {

            if (!playing) {
                return;
            }

            count++;

            log(
                `🔁 方案2 · 第 ${count} 次重新播放`
            );

            try {

                audio.currentTime = 0;

                await audio.play();

            } catch (err) {

                log(
                    `❌ 方案2重新播放失败`
                );
            }

        }
    );

    await audio.play();

    status.textContent =
        "方案 2 · ended 手动循环";

    return audio;
}



/* =========================
   Scheme 3
   early restart
========================= */

async function playScheme3(index) {

    const audio =
        new Audio(files[index]);

    audio.preload = "auto";

    currentAudio = audio;

    let count = 0;

    const scheduleRestart =
        () => {

            if (!playing) {
                return;
            }

            const remain =
                audio.duration -
                audio.currentTime;

            const delay =
                Math.max(
                    0,
                    remain * 1000 -
                    earlyDelay
                );

            timer =
                setTimeout(async () => {

                    if (!playing) {
                        return;
                    }

                    count++;

                    log(
                        `🔁 方案3 · 提前 ${earlyDelay} ms · 第 ${count} 次`
                    );

                    try {

                        audio.currentTime = 0;

                        await audio.play();

                        scheduleRestart();

                    } catch (err) {

                        log(
                            `❌ 方案3重新播放失败`
                        );
                    }

                }, delay);
        };


    await audio.play();

    status.textContent =
        `方案 3 · 提前 ${earlyDelay} ms`;

    /*
     * metadata 已经可用时直接安排，
     * 否则等待 duration。
     */
    if (Number.isFinite(audio.duration)) {

        scheduleRestart();

    } else {

        audio.addEventListener(
            "loadedmetadata",
            scheduleRestart,
            { once: true }
        );
    }

    return audio;
}



/* =========================
   Scheme 4
   dual audio
========================= */

async function playScheme4(index) {

    const makeAudio =
        () => {

            const a =
                new Audio(files[index]);

            a.preload = "auto";

            return a;
        };


    let a = makeAudio();
    let b = makeAudio();

    currentAudio = a;
    secondAudio = b;

    let active = a;
    let standby = b;

    let count = 0;

    const prepareNext =
        async () => {

            if (!playing) {
                return;
            }

            standby.currentTime = 0;

            try {

                await standby.play();

                /*
                 * 让两路同时播放会产生重叠，
                 * 这里在切换点立即暂停旧轨。
                 */
                active.pause();

                const temp =
                    active;

                active =
                    standby;

                standby =
                    temp;

                currentAudio =
                    active;

                secondAudio =
                    standby;

                count++;

                log(
                    `🔁 方案4 · 双 Audio 切换 · 第 ${count} 次`
                );

                scheduleNext();

            } catch (err) {

                log(
                    `❌ 方案4切换失败`
                );
            }
        };


    const scheduleNext =
        () => {

            if (!playing) {
                return;
            }

            const remain =
                active.duration -
                active.currentTime;

            const delay =
                Math.max(
                    0,
                    remain * 1000 -
                    earlyDelay
                );

            timer =
                setTimeout(
                    prepareNext,
                    delay
                );
        };


    await a.play();

    status.textContent =
        "方案 4 · 双 Audio";

    if (Number.isFinite(a.duration)) {

        scheduleNext();

    } else {

        a.addEventListener(
            "loadedmetadata",
            scheduleNext,
            { once: true }
        );
    }

    return a;
}



/* =========================
   Scheme 5
   AudioBufferSourceNode.loop
========================= */

async function playScheme5(index) {

    await unlockContext();

    const buffer =
        await loadBuffer(index);

    if (!playing) {
        return;
    }

    const ctx =
        ensureContext();

    const source =
        ctx.createBufferSource();

    source.buffer = buffer;

    source.loop = true;

    source.connect(
        ctx.destination
    );

    currentSource = source;

    source.start(0);

    status.textContent =
        "方案 5 · AudioBuffer loop";

    log(
        `▶ 方案5 · BGM ${index + 1}`
    );

    return source;
}



/* =========================
   Single track
========================= */

async function playSingle() {

    stopObjectsOnly();

    playing = true;

    const index =
        currentTrack;

    try {

        switch (scheme) {

            case 1:
                await playScheme1(index);
                break;

            case 2:
                await playScheme2(index);
                break;

            case 3:
                await playScheme3(index);
                break;

            case 4:
                await playScheme4(index);
                break;

            case 5:
                await playScheme5(index);
                break;
        }

    } catch (err) {

        playing = false;

        status.textContent =
            "播放失败";

        log(
            `❌ 播放失败 · ${err.message}`
        );
    }
}



/* =========================
   Playlist
========================= */

async function playPlaylist() {

    stopObjectsOnly();

    playing = true;

    const index =
        currentTrack;

    try {

        if (scheme === 5) {

            await playPlaylistBuffer(index);

        } else {

            await playPlaylistHTMLAudio(index);

        }

    } catch (err) {

        playing = false;

        status.textContent =
            "串烧播放失败";

        log(
            `❌ 串烧失败 · ${err.message}`
        );
    }
}



/* =========================
   Playlist:
   Web Audio scheme 5
========================= */

async function playPlaylistBuffer(index) {

    await unlockContext();

    const buffer =
        await loadBuffer(index);

    if (!playing) {
        return;
    }

    const ctx =
        ensureContext();

    const source =
        ctx.createBufferSource();

    source.buffer = buffer;

    source.loop = false;

    source.connect(
        ctx.destination
    );

    currentSource = source;

    source.onended =
        async () => {

            if (!playing) {
                return;
            }

            log(
                `🔁 方案5串烧结束 · BGM ${index + 1}`
            );

            currentTrack =
                (index + 1) % TRACK_COUNT;

            updateUI();

            await playPlaylistBuffer(
                currentTrack
            );
        };

    source.start(0);

    status.textContent =
        "方案 5 · 六首串烧";

    log(
        `▶ 方案5串烧 · BGM ${index + 1}`
    );
}



/* =========================
   Playlist:
   HTML audio schemes
========================= */

async function playPlaylistHTMLAudio(index) {

    const audio =
        new Audio(files[index]);

    audio.preload = "auto";

    currentAudio = audio;

    audio.onended =
        async () => {

            if (!playing) {
                return;
            }

            log(
                `🔁 串烧 · BGM ${index + 1} 结束`
            );

            currentTrack =
                (index + 1) % TRACK_COUNT;

            updateUI();

            await playPlaylistHTMLAudio(
                currentTrack
            );
        };

    await audio.play();

    status.textContent =
        `方案 ${scheme} · 六首串烧`;

    log(
        `▶ 串烧 · BGM ${index + 1}`
    );
}



/* =========================
   Stop objects only
========================= */

function stopObjectsOnly() {

    if (timer) {

        clearTimeout(timer);

        timer = null;
    }


    if (currentAudio) {

        currentAudio.onended = null;

        try {
            currentAudio.pause();
        } catch (_) {}

        currentAudio = null;
    }


    if (secondAudio) {

        secondAudio.onended = null;

        try {
            secondAudio.pause();
        } catch (_) {}

        secondAudio = null;
    }


    if (currentSource) {

        try {
            currentSource.onended = null;
            currentSource.stop();
        } catch (_) {}

        try {
            currentSource.disconnect();
        } catch (_) {}

        currentSource = null;
    }
}



/* =========================
   Play button
========================= */

document
    .getElementById("playBtn")
    .addEventListener(
        "click",
        async () => {

            if (rangeMode === "single") {

                await playSingle();

            } else {

                await playPlaylist();

            }
        }
    );



/* =========================
   Stop
========================= */

document
    .getElementById("stopBtn")
    .addEventListener(
        "click",
        () => {

            stopAll();

        }
    );



/* =========================
   Previous
========================= */

document
    .getElementById("prevBtn")
    .addEventListener(
        "click",
        async () => {

            currentTrack =
                (
                    currentTrack -
                    1 +
                    TRACK_COUNT
                ) % TRACK_COUNT;

            updateUI();

            log(
                `⏮ 切换到 BGM ${currentTrack + 1}`
            );

            if (playing) {

                if (
                    rangeMode ===
                    "single"
                ) {
                    await playSingle();
                } else {
                    await playPlaylist();
                }
            }
        }
    );



/* =========================
   Next
========================= */

document
    .getElementById("nextBtn")
    .addEventListener(
        "click",
        async () => {

            currentTrack =
                (
                    currentTrack +
                    1
                ) % TRACK_COUNT;

            updateUI();

            log(
                `⏭ 切换到 BGM ${currentTrack + 1}`
            );

            if (playing) {

                if (
                    rangeMode ===
                    "single"
                ) {
                    await playSingle();
                } else {
                    await playPlaylist();
                }
            }
        }
    );



/* =========================
   Track buttons
========================= */

document
    .querySelectorAll(".trackBtn")
    .forEach(btn => {

        btn.addEventListener(
            "click",
            async () => {

                currentTrack =
                    Number(
                        btn.dataset.track
                    );

                updateUI();

                log(
                    `🎵 选择 BGM ${currentTrack + 1}`
                );

                if (playing) {

                    if (
                        rangeMode ===
                        "single"
                    ) {
                        await playSingle();
                    } else {
                        await playPlaylist();
                    }
                }
            }
        );
    });



/* =========================
   Range buttons
========================= */

document
    .querySelectorAll(".rangeBtn")
    .forEach(btn => {

        btn.addEventListener(
            "click",
            async () => {

                rangeMode =
                    btn.dataset.range;

                updateUI();

                log(
                    rangeMode === "single"
                        ? "🎵 测试范围：单曲循环"
                        : "🔁 测试范围：六首串烧"
                );

                if (playing) {

                    if (
                        rangeMode ===
                        "single"
                    ) {
                        await playSingle();
                    } else {
                        await playPlaylist();
                    }
                }
            }
        );
    });



/* =========================
   Scheme buttons
========================= */

document
    .querySelectorAll(".schemeBtn")
    .forEach(btn => {

        btn.addEventListener(
            "click",
            async () => {

                scheme =
                    Number(
                        btn.dataset.scheme
                    );

                updateUI();

                log(
                    `选择方案 ${scheme}`
                );

                if (playing) {

                    if (
                        rangeMode ===
                        "single"
                    ) {
                        await playSingle();
                    } else {
                        await playPlaylist();
                    }
                }
            }
        );
    });



/* =========================
   Delay buttons
========================= */

document
    .querySelectorAll(".delayBtn")
    .forEach(btn => {

        btn.addEventListener(
            "click",
            () => {

                earlyDelay =
                    Number(
                        btn.dataset.delay
                    );

                updateUI();

                log(
                    `方案3提前时间：${earlyDelay} ms`
                );
            }
        );
    });



/* =========================
   Log buttons
========================= */

document
    .getElementById("clearBtn")
    .addEventListener(
        "click",
        () => {

            logBox.textContent = "";

        }
    );


document
    .getElementById("copyBtn")
    .addEventListener(
        "click",
        async () => {

            try {

                await navigator.clipboard.writeText(
                    logBox.textContent
                );

                log("✓ 日志已复制");

            } catch (_) {

                log("❌ 复制失败");
            }
        }
    );
