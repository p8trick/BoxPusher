<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>SFX Selection Tool</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 14px 50px;
    background: #eee8df;
    color: #3d3025;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

h1 {
    margin: 0 0 5px;
    font-size: 24px;
}

.subtitle {
    margin-bottom: 20px;
    color: #75685d;
    font-size: 13px;
}

.card {
    margin: 10px 0;
    padding: 14px;
    background: #fffaf3;
    border: 1px solid #d6c7b5;
    border-radius: 14px;
    box-shadow: 0 2px 7px rgba(0,0,0,.06);
}

.title {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 5px;
}

.number {
    font-size: 18px;
    font-weight: 800;
}

.name {
    font-size: 16px;
    font-weight: 700;
}

.description {
    margin-bottom: 11px;
    color: #817366;
    font-size: 12px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

button {
    min-height: 50px;
    padding: 9px 5px;
    border: 1px solid #b9a995;
    border-radius: 10px;
    background: #f5eee5;
    color: #46382c;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

button:active {
    transform: scale(.97);
}

button.selected {
    border: 2px solid #806b54;
    background: #e2d3c0;
}

button.ogg {
    background: #edf3ea;
    border-color: #aebea8;
}

button.ogg.selected {
    background: #d7e3d2;
    border-color: #65785e;
}

button small {
    display: block;
    margin-top: 3px;
    color: #88796b;
    font-size: 10px;
    font-weight: 500;
}

.selection {
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    background: #f1e9df;
    font-size: 12px;
}

.gain-area {
    margin-top: 11px;
}

.gain-row {
    display: flex;
    align-items: center;
    gap: 9px;
}

.gain-label {
    min-width: 72px;
    font-size: 12px;
    color: #75685d;
}

.gain-value {
    min-width: 48px;
    text-align: right;
    font-size: 12px;
    font-weight: 700;
}

input[type="range"] {
    flex: 1;
    width: 100%;
    accent-color: #806b54;
}

.summary {
    margin-top: 24px;
    padding: 16px;
    background: #fffaf3;
    border: 1px solid #cdbba6;
    border-radius: 14px;
}

.summary h2 {
    margin: 0 0 12px;
    font-size: 18px;
}

.summary pre {
    margin: 0;
    padding: 12px;
    overflow-x: auto;
    border-radius: 9px;
    background: #f1e9df;
    color: #493b30;
    font: 12px/1.6 ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;
}

.copy-button {
    width: 100%;
    margin-top: 12px;
    min-height: 52px;
    background: #806b54;
    border-color: #806b54;
    color: white;
}

.reset-button {
    width: 100%;
    margin-top: 7px;
    min-height: 44px;
    background: transparent;
}

.copy-status {
    margin-top: 8px;
    text-align: center;
    color: #66735e;
    font-size: 12px;
    min-height: 16px;
}

.footer {
    margin-top: 20px;
    color: #87796c;
    font-size: 11px;
    line-height: 1.6;
}

@media (max-width: 500px) {

    .buttons {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>


<body>

<h1>🎧 SFX Selection Tool</h1>

<div class="subtitle">
    试听 → 调整补偿 → 选择最终版本 → 一键复制日志
</div>

<div id="app"></div>

<div class="summary">

    <h2>最终选择</h2>

    <pre id="summaryText"></pre>

    <button
        class="copy-button"
        id="copyButton">
        📋 一键复制选择日志
    </button>

    <button
        class="reset-button"
        id="resetButton">
        ↺ 重置全部选择与补偿
    </button>

    <div
        class="copy-status"
        id="copyStatus">
    </div>

</div>

<div class="footer">
    OGG 文件与本 HTML 放在同一目录。<br>
    文件名全部使用小写、数字、下划线，不使用空格。
</div>


<script>

/* =========================================================
   OGG 文件
   ========================================================= */

const OGG_FILES = {

    1: "sfx01_ui_click.ogg",
    2: "sfx02_footstep.ogg",
    3: "sfx03_victory.ogg",
    4: "sfx04_box_slide.ogg",
    5: "sfx05_box_place.ogg",
    6: "sfx06_box_push_blocked.ogg",
    7: "sfx07_player_blocked.ogg",
    8: "sfx08_confetti_pop.ogg"

};


/* =========================================================
   音效资料
   ========================================================= */

const SFX_LIST = [

    {
        id: 1,
        name: "UI Click",
        description: "菜单、按钮、返回、选项统一点击声"
    },

    {
        id: 2,

        description: "角色在木地板上的脚步"
    },

    {
        id: 3,

        description: "完成全部箱子后的胜利提示"
    },

    {
        id: 4,
        name: "Box Slide",

    },

    {
        id: 5,

    },

    {
        id: 6,

/* =========================================================
   状态
   ========================================================= */

const selections = {};

const gains = {};

SFX_LIST.forEach(item => {

    selections[item.id] = null;

    /*
       1.00 = 原始测试音量
       范围 0.25 ～ 2.00
    */

    gains[item.id] = 1.00;

});


/* =========================================================
   AudioContext
   ========================================================= */

let audioContext = null;

function getAudioContext() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (audioContext.state === "suspended") {

        audioContext.resume();

    }

    return audioContext;
}


/* =========================================================
   统一输出
   ========================================================= */

function connectOutput(node, id) {

    const ctx = getAudioContext();

    const gain =
        ctx.createGain();

    gain.gain.value =
        Math.max(
            0,
            Math.min(
                2,
                gains[id]
            )
        );

    node.connect(gain);

    gain.connect(
        ctx.destination
    );

    return gain;
}


/* =========================================================
   Tone
   ========================================================= */

function tone(
    id,
    type,
    frequency,
    start,
    duration,
    volume,
    endFrequency = null
) {

    const ctx =
        getAudioContext();

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.type =
        type;

    osc.frequency.setValueAtTime(
        frequency,
        start
    );

    if (endFrequency !== null) {

        osc.frequency.exponentialRampToValueAtTime(
            Math.max(
                20,
                endFrequency
            ),
            start + duration
        );

    }

    gain.gain.setValueAtTime(
        0.0001,
        start
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        start + 0.005
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        start + duration
    );

    osc.connect(gain);

    connectOutput(
        gain,
        id
    );

    osc.start(start);

    osc.stop(
        start + duration + 0.03
    );
}


/* =========================================================
   Noise
   ========================================================= */

function noise(
    id,
    start,
    duration,
    volume,
    cutoff,
    filterType = "lowpass"
) {

    const ctx =
        getAudioContext();

    const buffer =
        ctx.createBuffer(
            1,
            Math.ceil(
                ctx.sampleRate *
                duration
            ),
            ctx.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        const fade =
            1 - i / data.length;

        data[i] =
            (Math.random() * 2 - 1) *
            fade;

    }

    const source =
        ctx.createBufferSource();

    source.buffer =
        buffer;

    const filter =
        ctx.createBiquadFilter();

    filter.type =
        filterType;

    filter.frequency.value =
        cutoff;

    const gain =
        ctx.createGain();

    gain.gain.setValueAtTime(
        0.0001,
        start
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        start + 0.006
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        start + duration
    );

    source
        .connect(filter)
        .connect(gain);

    connectOutput(
        gain,
        id
    );

    source.start(start);

    source.stop(
        start + duration + 0.02
    );
}


/* =========================================================
   合成音效
   ========================================================= */

function playSynth(id, variant) {

    const ctx =
        getAudioContext();

    const t =
        ctx.currentTime + 0.015;

       ----------------------------------------------------- */

        if (variant === "A") {

            tone(

                "square",
                1450,
                t,

            tone(
                id,
                "triangle",
                1050,
                t,
                0.055,
                0.12
            );

            tone(
                id,
                "triangle",
                1750,
                t + 0.012,
                0.025,
                0.045
            );

        }

            tone(
                id,
                "sine",
                1850,
                t,
                0.025,
                0.07
            );

                t,
                0.018,
                0.025,

       ----------------------------------------------------- */

                0.075,

                "sine",
                105,
                t,
                0.07,
                0.035
            );

                id,
                t,
                0.12,
                0.13,
                900
            );

            tone(
                id,
                "triangle",
                180,
                t,
                0.09,
                0.025
            );

        }

        if (variant === "C") {

            noise(
                id,
                t,
                0.055,
                0.17,
                2600
            );

            tone(
                id,
                "triangle",
                130,
                t,
                0.08,
                0.04
            );

    /* -----------------------------------------------------
       3 VICTORY
       ----------------------------------------------------- */

    if (id === 3) {

        if (variant === "A") {

            tone(
                id,
                "triangle",
                523,
                t,
                0.24,
                0.10
            );

            tone(
                id,
                "triangle",
                659,
                t + 0.09,
                0.24,
                0.10
            );

            tone(
                id,
                "triangle",
                784,
                t + 0.18,
                0.30,
                0.11
            );

        }

        if (variant === "B") {

            tone(
                id,
                "sine",
                392,
                t,
                0.25,
                0.085
            );

            tone(
                id,
                "sine",
                523,
                t + 0.075,
                0.25,
                0.085
            );

            tone(
                id,
                "sine",
                659,
                t + 0.15,
                0.25,
                0.085
            );

            tone(
                id,
                "sine",
                784,
                t + 0.225,
                0.32,
                0.095
            );

        }

        if (variant === "C") {

            tone(
                id,
                "triangle",
                523,
                t,
                0.15,
                0.09
            );

            tone(
                id,
                "triangle",
                659,
                t + 0.07,
                0.18,
                0.09
            );

            tone(
                id,
                "sine",
                1047,
                t + 0.15,
                0.32,
                0.08
            );

        }

    }


    /* -----------------------------------------------------
       4 BOX SLIDE
       ----------------------------------------------------- */

    if (id === 4) {

        if (variant === "A") {

            noise(
                id,
                t,
                0.30,
                0.12,
                850
            );

            noise(
                id,
                t + 0.08,
                0.18,
                0.07,
                1400
            );

        }

        if (variant === "B") {

            noise(
                id,
                t,
                0.42,
                0.10,
                520
            );

            tone(
                id,
                "triangle",
                95,
                t,
                0.36,
                0.035
            );

        }

        if (variant === "C") {

            noise(
                id,
                t,
                0.22,
                0.14,
                1900
            );

            noise(
                id,
                t + 0.12,
                0.16,
                0.07,
                1200
            );

    }


    /* -----------------------------------------------------
       5 BOX PLACE

    if (id === 5) {

                115,
                t,

            tone(

            tone(
                id,
                "square",
                720,
                t + 0.045,

                0.055
            );

        }

            tone(
                id,
                "sine",
                100,
                t,
                0.16,
                0.13,
                60
            );

            tone(
                id,
                "sine",
                520,

                0.12,

            );

    /* -----------------------------------------------------
       6 BOX PUSH BLOCKED

    if (id === 6) {

        if (variant === "A") {

            tone(
                id,
                "triangle",
                100,
                t,
                0.13,
                0.18,
                65
            );

            noise(
                id,
                t,

            tone(
                id,

            );

        }

        if (variant === "C") {

    /* -----------------------------------------------------
       7 PLAYER BLOCKED
       ----------------------------------------------------- */

    if (id === 7) {

        if (variant === "A") {

            tone(
                id,
                "triangle",
                230,
                t,
                0.055,
                0.10,

            );

        }

        if (variant === "B") {

            tone(

                "square",
                420,
                t,

}


/* =========================================================
   OGG
   ========================================================= */

function playOGG(id) {

    const audio =
        new Audio(
            OGG_FILES[id]
        );

    /*
       OGG 也进入统一的测试音量补偿。
    */

    audio.volume =
        Math.max(
            0,
            Math.min(
                1,
                gains[id]
            )
        );

    audio.currentTime = 0;

    audio.play().catch(
        error => {

            console.warn(
                "OGG播放失败:",
                OGG_FILES[id],
                error
            );

        }
    );

}


/* =========================================================
   选择方案
   ========================================================= */

function selectOption(
    id,
    option,
    buttons
) {

    selections[id] =
        option;

    buttons.forEach(
        button => {

            button.classList.remove(
                "selected"
            );

        }
    );

    const selected =
        buttons.find(
            button =>
                button.dataset.option ===
                option
        );

    if (selected) {

        selected.classList.add(
            "selected"
        );

    }

    updateSummary();
}


/* =========================================================
   创建音效卡片
   ========================================================= */

const app =
    document.getElementById(
        "app"
    );


SFX_LIST.forEach(
    item => {

        const card =
            document.createElement(
                "section"
            );

        card.className =
            "card";


        const title =
            document.createElement(
                "div"
            );

        title.className =
            "title";

        title.innerHTML =
            "<span class='number'>" +
            item.id +
            ".</span>" +

            "<span class='name'>" +
            item.name +
            "</span>";


        const description =
            document.createElement(
                "div"
            );

        description.className =
            "description";

        description.textContent =
            item.description;


        const buttons =
            document.createElement(
                "div"
            );

        buttons.className =
            "buttons";


        const optionButtons = [];


        ["A", "B", "C"].forEach(
            option => {

                const button =
                    createButton(
                        "▶ 合成 " +
                        option,
                        "Web Audio",
                        () => {

                            playSynth(
                                item.id,
                                option
                            );

                            selectOption(
                                item.id,
                                option,
                                optionButtons
                            );

                        }
                    );

                button.dataset.option =
                    option;

                optionButtons.push(
                    button
                );

                buttons.appendChild(
                    button
                );

            }
        );


        const oggButton =
            createButton(
                "▶ OGG",
                OGG_FILES[item.id],
                () => {

                    playOGG(
                        item.id
                    );

                    selectOption(
                        item.id,
                        "OGG",
                        optionButtons
                    );

                    oggButton.classList.add(
                        "selected"
                    );

                },
                "ogg"
            );

        oggButton.dataset.option =
            "OGG";

        optionButtons.push(
            oggButton
        );

        buttons.appendChild(
            oggButton
        );


        /* -------------------------------------------------
           当前选择
           ------------------------------------------------- */

        const selection =
            document.createElement(
                "div"
            );

        selection.className =
            "selection";

        selection.id =
            "selection-" +
            item.id;

        selection.textContent =
            "当前选择：未选择";


        /* -------------------------------------------------
           Gain
           ------------------------------------------------- */

        const gainArea =
            document.createElement(
                "div"
            );

        gainArea.className =
            "gain-area";


        const gainRow =
            document.createElement(
                "div"
            );

        gainRow.className =
            "gain-row";


        const gainLabel =
            document.createElement(
                "div"
            );

        gainLabel.className =
            "gain-label";

        gainLabel.textContent =
            "试听补偿";


        const slider =
            document.createElement(
                "input"
            );

        slider.type =
            "range";

        slider.min =
            "0.25";

        slider.max =
            "2.00";

        slider.step =
            "0.05";

        slider.value =
            gains[item.id];


        const gainValue =
            document.createElement(
                "div"
            );

        gainValue.className =
            "gain-value";

        gainValue.textContent =
            "1.00×";


        slider.addEventListener(
            "input",
            () => {

                gains[item.id] =
                    parseFloat(
                        slider.value
                    );

                gainValue.textContent =
                    gains[item.id]
                        .toFixed(2) +
                    "×";

                updateSummary();

            }
        );


        gainRow.appendChild(
            gainLabel
        );

        gainRow.appendChild(
            slider
        );

        gainRow.appendChild(
            gainValue
        );

        gainArea.appendChild(
            gainRow
        );


        card.appendChild(
            title
        );

        card.appendChild(
            description
        );

        card.appendChild(
            buttons
        );

        card.appendChild(
            selection
        );

        card.appendChild(
            gainArea
        );

        app.appendChild(
            card
        );

    }
);


/* =========================================================
   创建按钮
   ========================================================= */

function createButton(
    text,
    smallText,
    callback,
    className = ""
) {

    const button =
        document.createElement(
            "button"
        );

    button.className =
        className;

    button.innerHTML =
        text +
        "<small>" +
        smallText +
        "</small>";

    button.addEventListener(
        "click",
        callback
    );

    return button;
}


/* =========================================================
   更新选择显示
   ========================================================= */

function updateSummary() {

    let text =
        "SFX FINAL SELECTION\n" +
        "===================\n\n";


    SFX_LIST.forEach(
        item => {

            const selection =
                selections[item.id] ||
                "NOT_SELECTED";

            text +=
                String(item.id)
                    .padStart(2, "0") +

                " " +

                item.name.padEnd(
                    20,
                    " "
                ) +

                selection +

                "\n";

        }
    );


    text +=
        "\nTEST GAIN\n" +
        "---------\n";


    SFX_LIST.forEach(
        item => {

            text +=
                String(item.id)
                    .padStart(2, "0") +

                " " +

                gains[item.id]
                    .toFixed(2) +

                "x\n";

        }
    );


    document.getElementById(
        "summaryText"
    ).textContent =
        text;


    SFX_LIST.forEach(
        item => {

            const element =
                document.getElementById(
                    "selection-" +
                    item.id
                );

            if (
                selections[item.id]
            ) {

                element.textContent =
                    "当前选择： " +
                    selections[item.id];

            } else {

                element.textContent =
                    "当前选择： 未选择";

            }

        }
    );

}


/* =========================================================
   一键复制
   ========================================================= */

document.getElementById(
    "copyButton"
).addEventListener(
    "click",
    async () => {

        const text =
            document.getElementById(
                "summaryText"
            ).textContent;

        try {

            await navigator.clipboard.writeText(
                text
            );

            document.getElementById(
                "copyStatus"
            ).textContent =
                "✓ 已复制到剪贴板";

        } catch (error) {

            /*
               iOS 某些环境下 clipboard API
               可能受到限制。
            */

            const area =
                document.createElement(
                    "textarea"
                );

            area.value =
                text;

            document.body.appendChild(
                area
            );

            area.select();

            try {

                document.execCommand(
                    "copy"
                );

                document.getElementById(
                    "copyStatus"
                ).textContent =
                    "✓ 已复制到剪贴板";

            } catch {

                document.getElementById(
                    "copyStatus"
                ).textContent =
                    "复制失败，请长按日志手动复制";

            }

            area.remove();

        }

        setTimeout(
            () => {

                document.getElementById(
                    "copyStatus"
                ).textContent =
                    "";

            },
            2000
        );

    }
);


/* =========================================================
   重置
   ========================================================= */

document.getElementById(
    "resetButton"
).addEventListener(
    "click",
    () => {

        SFX_LIST.forEach(
            item => {

                selections[item.id] =
                    null;

                gains[item.id] =
                    1.00;

            }
        );

        location.reload();

    }
);


/* =========================================================
   初始显示
   ========================================================= */

updateSummary();

</script>
