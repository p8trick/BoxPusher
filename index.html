<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BoxPusher" id="appTitleMeta">
<meta name="theme-color" content="#7f8a6a" id="themeColorMeta">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<title>BoxPusher</title>
<script>
/* manifest 才是 iOS 生成主屏幕图标时真正取名字的地方(「添加」弹窗里预填的是页面标题，生成后的图标用 manifest 的 name)。
   manifest 是静态文件、不能按语言给不同名字，所以准备两份：manifest.json(英文 BoxPusher) 和 manifest-zh.json(中文 推箱子)，
   这里按系统语言二选一，在解析页面时就把 link 建好。两份的 start_url/scope/图标都一样，只有名字/描述/lang 不同。 */
(function () {
  var zh = (navigator.language || '').toLowerCase().indexOf('zh') === 0;
  var l = document.createElement('link');
  l.rel = 'manifest';
  l.href = zh ? 'manifest-zh.json' : 'manifest.json';
  document.head.appendChild(l);
})();
</script>
<noscript><link rel="manifest" href="manifest.json"></noscript>
<link rel="preload" href="assets/fonts/kenney_future_narrow.ttf" as="font" type="font/ttf" crossorigin>
<style>
:root {
  --img-wall: url('assets/Blocks/block_red1.png');
  --img-floor: url('assets/Ground/ground_grey.png');
  --img-target: url('assets/Ground/ground_greyTarget.png');
  --img-crate: url('assets/Crates/crate_brown.png');
  --img-crateDone: url('assets/Crates/crate_brownDone.png');
  --tile: 52px;
  --move-dur: 0.26s; /* 平时走路；推箱子时由JS按步覆盖成推箱时长(见settings.walkMs/pushMs) */
  /* ---- 主题变量（默认：森林绿）。换主题只改 <html data-theme>，下面三套 ---- */
  --bg: #7f8a6a;            /* 页面底色 */
  --frame-bg: #7f8a6a;      /* 棋盘外框内部底色；墙外空白格透出的就是它 */
  --frame-border: #cfc4a4;
  --panel: #f4efe0;         /* 设置/选关面板底色 */
  --panel-border: #cfc4a4;
  --ink: #3a3226;           /* 面板上的文字 */
  --sub: #8a7d63;           /* 面板上的小标题 */
  --accent: #b8814a;
  --press: #e8dfc5;         /* 面板按钮按下色 */
  --cleared: #e4dab8;       /* 选关面板里已通关的格子 */
  --page-text: #f4efe0;     /* 直接写在页面底色上的文字 */
  --dpad: #3a3226; --dpad-active: #55493a; --dpad-fg: #f4efe0;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0c0e11; --frame-bg: #171a1f; --frame-border: #2c3138;
  --panel: #1d2026; --panel-border: #343a43; --ink: #e8e4d8; --sub: #9aa0a8;
  --accent: #d99a55; --press: #2a2f37; --cleared: #2d333c; --page-text: #cfc9b8;
  --dpad: #252930; --dpad-active: #343a43; --dpad-fg: #d9d4c5;
  color-scheme: dark;
}
:root[data-theme="blue"] {
  --bg: #27506f; --frame-bg: #2f5f85; --frame-border: #5b8db3;
  --page-text: #eaf2f8;
  --dpad: #16324a; --dpad-active: #22486a; --dpad-fg: #eaf2f8;
}
/* Kenney 字体：只用在主页按钮等英文/数字标签上(这套字体没有中文字形，中文一律走系统字体)。
   font-weight写成范围，声明这个字体覆盖所有字重，避免浏览器对它做"假粗体"。文件没上传时自动退回下面的备用字体栈 */
@font-face {
  font-family: 'KenneyFutureNarrow';
  src: url('assets/fonts/kenney_future_narrow.ttf') format('truetype'),
       url('assets/fonts/Kenney_Future_Narrow.ttf') format('truetype'); /* GitHub Pages区分大小写：小写名找不到就试原始大小写名 */
  font-weight: 100 900; font-display: swap;
}
@font-face {
  font-family: 'KenneyFuture';
  src: url('assets/fonts/kenney_future.ttf') format('truetype'),
       url('assets/fonts/Kenney_Future.ttf') format('truetype');
  font-weight: 100 900; font-display: swap;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;   /* 禁掉iOS长按弹出的“拷贝/查询/翻译/搜索网页”系统菜单 */
  -webkit-user-select: none;
  user-select: none;
}
html {
  margin: 0; padding: 0;
  height: 100vh; /* 确认过：100dvh在standalone PWA下算出来偏矮，是底部裁切的根因，改回100vh */
  background: var(--bg);
}
body {
  margin: 0; padding: 0;
  height: 100vh; /* 同上 */
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  color: var(--ink);
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  overflow-x: hidden; /* 只放在body上，不让html的overflow传播到viewport层面干扰fixed定位元素的安全区计算 */
}
#app {
  height: 100vh; /* dvh在这台设备standalone模式下算出来偏矮，已证实是bug根源，游戏主界面也用回100vh。
                    这里必须是固定高度(不是min-height)：舞台(#stage)才能在确定的剩余空间里居中，加内边距时不会把页面撑高 */
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: max(16px, env(safe-area-inset-top)) 16px 16px; /* 底部按经验去掉env()，standalone PWA本身已经避让了，叠加会变成扣两次 */
}
/* 舞台：顶部安全区到D-pad上沿之间的空闲区域，棋盘在里面垂直居中；下沿按D-pad实际显示位置量(JS里的stageInfo) */
#stage {
  flex: 1; min-height: 0; width: 100%;
  display: flex; align-items: center; justify-content: center;
}
#boardBlock { display: inline-flex; flex-direction: column; gap: 6px; }
/* 关卡信息行：「第N关 · 当前步数 · 最佳步数」小字、不可点击，跟着棋盘右下。最佳步数只在玩过这关时才有。
   width:0 + min-width:100%：这行文字不参与撑宽#boardBlock(否则棋盘外框会被拉宽)，超长时向左溢出 */
#levelInfo {
  align-self: flex-end; width: 0; min-width: 100%; box-sizing: border-box;
  display: flex; justify-content: flex-end; white-space: nowrap;
  height: 16px; line-height: 16px; padding-right: 6px;
  font-size: 12px; letter-spacing: 0.5px; color: var(--page-text); opacity: 0.75;
  pointer-events: none;
}
#levelInfo span + span::before { content: '·'; margin: 0 6px; }
#bestCount:empty { display: none; }
#board-wrap {
  background: var(--frame-bg);
  border: 1px solid var(--frame-border);
  border-radius: 16px;
  padding: 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  touch-action: none;
  overflow: hidden;
}
#board {
  position: relative;
  display: grid;
  grid-template-columns: repeat(var(--cols), var(--tile));
  grid-template-rows: repeat(var(--rows), var(--tile));
  border-radius: 8px;
  overflow: hidden;
  transform-origin: 0 0; /* 预览模式缩放时以左上角为基准，配合camera的平移数学 */
  transition: transform var(--move-dur) linear; /* 跟玩家走路动画同款时长/曲线，保证同步 */
}
.cell {
  position: relative;
  width: var(--tile); height: var(--tile);
  background-size: cover;
  background-position: center;
  image-rendering: -webkit-optimize-contrast;
}
.cell.wall { background-image: var(--img-wall); }
.cell.floor { background-image: var(--img-floor); }
.cell.target { background-image: var(--img-target); }
.cell.void { background: none; } /* 墙外的空白格：不铺地板，透出棋盘外框的底色 */
/* 预览模式下目标点缩得太小时原贴图边框不好辨认，沿同样的方框位置描一层更亮更粗的边强化 */
#board.previewing .cell.target::after {
  content: '';
  position: absolute;
  inset: 15%;
  border: 3px solid #f2c94c;
  box-shadow: 0 0 6px 2px rgba(242,201,76,0.75);
  pointer-events: none;
}
.box {
  position: absolute;
  width: var(--tile); height: var(--tile);
  background-image: var(--img-crate);
  background-size: cover;
  transition: transform var(--move-dur) cubic-bezier(.3,.1,.3,1);
  will-change: transform;
}
.box.done { background-image: var(--img-crateDone); }
.box.pushing { transition: transform var(--move-dur) cubic-bezier(.2,.6,.3,1); }
.player {
  position: absolute;
  width: var(--tile); height: var(--tile);
  transition: transform var(--move-dur) linear;
  will-change: transform;
  z-index: 5;
}
.player .sprite {
  width: 100%; height: 100%;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center bottom;
}
#controls {
  flex: none; /* 舞台(#stage)吃掉剩余空间，控制区固定沉在屏幕下半部分的拇指热区 */
  width: 100%;
  padding-top: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 36px;
}
/* 左侧槽位：正常时放D-pad，暂停/地图模式时放图标菜单，两者占同一块216x216，界面不跳 */
#leftSlot {
  position: relative; flex: none; width: 216px; height: 216px;
  margin-left: var(--dpad-offset, 0px);
}
#dpad {
  position: relative;
  top: var(--dpad-offset-y, 0px);
  width: 216px;
  height: 216px;
  flex: none;
  transform: scale(var(--dpad-scale, 1));
}
/* ---- D-pad 图形(素材在 assets/UI/dpad/，颜色全走主题变量)----
   用 mask 把单色 svg 当"模具"，背景色就是主题色：--dpad 底色 / --dpad-fg 描边+箭头 / --dpad-active 按下时的底色；
   按下高亮直接用素材自带的橙色渐变图(dpad_*highlight.svg)，--dpad-hl-filter 可以整体调色；命中区用 clip-path 裁出形状 */
:root { --dpad-hl-filter: saturate(0.9) hue-rotate(-4deg); }
.dpSet { position: absolute; inset: 0; }
#dpadSplit { display: none; }
#dpad.style-split #dpadSplit { display: block; }
#dpad.style-split #dpadCross { display: none; }
.dkey {
  padding: 0; border: 0; background: transparent; outline: none; appearance: none; -webkit-appearance: none;
  -webkit-tap-highlight-color: transparent;
}
/* 十字 */
#dpadCross .dl { position: absolute; inset: 0; pointer-events: none; }
.dpBody  { background: var(--dpad);        -webkit-mask: url('assets/UI/dpad/dpad_fill.svg') center / 100% 100% no-repeat; mask: url('assets/UI/dpad/dpad_fill.svg') center / 100% 100% no-repeat; }
.dpLight { background: var(--dpad-active); -webkit-mask: url('assets/UI/dpad/dpad_fill.svg') center / 100% 100% no-repeat; mask: url('assets/UI/dpad/dpad_fill.svg') center / 100% 100% no-repeat; opacity: 0; }
.dpRing  { background: var(--dpad-fg);     -webkit-mask: url('assets/UI/dpad/dpad.svg') center / 100% 100% no-repeat;      mask: url('assets/UI/dpad/dpad.svg') center / 100% 100% no-repeat; }
.dpHl    { background: url('assets/UI/dpad/dpad_highlight.svg') center / 100% 100% no-repeat; filter: var(--dpad-hl-filter); opacity: 0; }
#dpadCross .dkey { position: absolute; inset: 0; width: 100%; height: 100%; }
#up    { clip-path: polygon(30.47% 0, 69.53% 0, 69.53% 34.38%, 50% 43.75%, 30.47% 34.38%); }
#down  { clip-path: polygon(30.47% 100%, 69.53% 100%, 69.53% 65.63%, 50% 56.25%, 30.47% 65.63%); }
#left  { clip-path: polygon(0 30.47%, 0 69.53%, 34.38% 69.53%, 43.75% 50%, 34.38% 30.47%); }
#right { clip-path: polygon(100% 30.47%, 100% 69.53%, 65.63% 69.53%, 56.25% 50%, 65.63% 30.47%); }
/* 按下(脚本给 #dpad 加 data-down="方向")：被按的那一臂底色变亮 + 换成高亮描边(用 clip-path 只截取那一臂) */
#dpad[data-down] .dpLight, #dpad[data-down] .dpHl { opacity: 1; }
#dpad[data-down="up"]    :is(.dpLight, .dpHl) { clip-path: polygon(30.16% 0, 69.84% 0, 69.84% 35.16%, 30.16% 35.16%); }
#dpad[data-down="down"]  :is(.dpLight, .dpHl) { clip-path: polygon(30.16% 64.84%, 69.84% 64.84%, 69.84% 100%, 30.16% 100%); }
#dpad[data-down="left"]  :is(.dpLight, .dpHl) { clip-path: polygon(0 30.16%, 35.16% 30.16%, 35.16% 69.84%, 0 69.84%); }
#dpad[data-down="right"] :is(.dpLight, .dpHl) { clip-path: polygon(64.84% 30.16%, 100% 30.16%, 100% 69.84%, 64.84% 69.84%); }
/* 分离：四块独立(64×64)，各自放在 dpad 中心(108,108)沿方向偏 --split-r 处；--split-r = 「分离按键间距」，含义：键中心到 dpad 中心的距离 */
.dpiece {
  position: absolute; left: 0; top: 0; width: 64px; height: 64px;
  transform: translate(calc(108px + var(--tx) * var(--split-r, 48px) - 32px), calc(108px + var(--ty) * var(--split-r, 48px) - 32px));
}
.dpiece i { position: absolute; inset: 0; pointer-events: none; }
.dpiece .pBody { background: var(--dpad);    -webkit-mask: var(--m-fill) center / 100% 100% no-repeat; mask: var(--m-fill) center / 100% 100% no-repeat; }
.dpiece .pRing { background: var(--dpad-fg); -webkit-mask: var(--m-ring) center / 100% 100% no-repeat; mask: var(--m-ring) center / 100% 100% no-repeat; }
.dpiece .pHl   { background: var(--i-hl) center / 100% 100% no-repeat; filter: var(--dpad-hl-filter); opacity: 0; }
.dpiece.on .pBody { background: var(--dpad-active); }
.dpiece.on .pHl { opacity: 1; }

#actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 47px; /* 步数挪走后，撤销和地图键的间距(原 16+步数行15+16)，保持两个键在原来的位置 */
}
#undo {
  width: 84px; height: 84px;
  border-radius: 50%;
  background: #b8543f;
  color: #fdf3ea;
  border: none;
  font-size: 16px;
  font-weight: 600;
}
#undo:active { background: #a1442f; }

/* 右下角圆形按钮：和"撤销"同一风格(纯色圆、无材质)，只是换了颜色。游戏中是"地图"图标，暂停模式里变成"返回"，同一个位置来回切 */
#modeBtn {
  width: 62px; height: 62px; padding: 0;
  border-radius: 50%; border: none;
  background: #c98b3a; color: #fff;
  display: flex; align-items: center; justify-content: center;
}
#modeBtn:active { background: #b07a2e; }
.ico { display: block; background: currentColor; pointer-events: none; -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; }
#modeBtn .ico { width: 58%; height: 58%; }

/* 暂停/地图模式：D-pad、撤销、步数让位；四个选项排成一行悬在右下角按钮的上方，
   垂直位置大致还在原来D-pad的高度，不再贴底。布局尺寸不变，所以棋盘不会跳。
   这一排只在暂停时才创建、退出即删除：常驻的隐藏元素在iOS上会漏出投影(D-pad四周色差分界线的根因) */
#controls { position: relative; }
#app.paused #dpad, #app.paused #undo { visibility: hidden; pointer-events: none; }
#app.winShown #dpad, #app.winShown #undo, #app.winShown #modeBtn { visibility: hidden; pointer-events: none; }
#pauseRow {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: calc(22px + (216px - 60px) / 2 - 12px); /* controls的padding-top(22) + 让60px高的一行在216px高的D-pad区域里垂直居中，再上提12px，和下面的按钮拉开一点距离 */
  width: 336px; max-width: 100%;
  display: flex; justify-content: space-between;
}
#pauseRow button {
  width: 60px; height: 60px; padding: 0; border-radius: 50%;
  border: 1px solid var(--panel-border); background: var(--panel); color: var(--ink);
  display: flex; align-items: center; justify-content: center;
}
#pauseRow button:active { background: var(--press); }
#pauseRow button .ico { width: 56%; height: 56%; }
#toast {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.9);
  background: rgba(58,50,38,0.92); color: #f4efe0; padding: 16px 24px; border-radius: 14px;
  font-size: 16px; opacity: 0; pointer-events: none; transition: all 0.25s ease;
  text-align: center;
  z-index: 400; /* 盖过主页(200)和面板(250)，选关时点到锁定关卡也能看到提示 */
}
#toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

/* ===== 木框面板(设置用；以后选关面板复用 .artPanel 这层外壳) =====
   浮层居中、四周留边不贴屏幕：手机竖屏宽约 92%(左右各14px)、高最多约 90%(上下各 5vh)，露出后面的主页/棋盘，
   后面压一层 45% 黑 + 轻微模糊。木框是九宫格图 assets/UI/panel_wood_portrait.png(658×1173，中间透明)，
   切片 63 54 59 54(上 右 下 左) → 边宽 20 17 19 17px，大约是 3× 屏 1:1 显示；中间底色用主题纸色 var(--panel)。
   border-image 图不在时，退回一圈木色实线边框。background-clip:padding-box 防止圆角外露出底色。
   面板本身就是滚动容器，木框在border上不跟着滚。iPad 版木框还没有，先共用这张(宽度上限放大到 640px)。 */
#settingsOverlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  padding: max(5vh, env(safe-area-inset-top)) 14px 5vh; /* 底部不叠env()，同上原因 */
  z-index: 250; /* 盖在主页上面，从主页也能打开设置 */
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
#settingsOverlay.show { opacity: 1; pointer-events: auto; }
.artPanel {
  box-sizing: border-box;
  border-style: solid; border-color: #8a5a2b; /* 图片加载失败时的后备 */
  border-width: 20px 17px 19px 17px;
  border-image: url('assets/UI/panel_wood_portrait.png') 63 54 59 54 fill / 20px 17px 19px 17px stretch;
  background: var(--panel); background-clip: padding-box;
  color: var(--ink);
  box-shadow: 0 10px 28px rgba(0,0,0,0.35);
}
#settingsWrap { /* 面板外层：木框面板 + 浮在框右上角的关闭钮(钮在滚动区外面，所以滚到哪里都点得到) */
  position: relative;
  width: 100%; max-width: 460px;
  max-height: 100%; /* 上下留边由 #settingsOverlay 的 padding 决定 */
  display: flex; flex-direction: column;
  transform: scale(0.96);
  transition: transform 0.2s ease;
}
#settingsOverlay.show #settingsWrap { transform: scale(1); }
#settingsSheet {
  width: 100%; min-height: 0;
  padding: 10px 14px 14px; /* 木框内侧的留白 */
  touch-action: pan-y;
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; /* 内容超出一屏时在框内滚动 */
}
@media (min-width: 700px) { #settingsWrap { max-width: 640px; } }
/* 关闭钮：面板专用的木板按钮 assets/UI/btn_wood_panel.png(448×126，由主页的 btn_wood_menu.png 调成木框同色系并缩小得到，主页按钮仍用原图)。
   还是九宫格：切片 36 30(上下/左右，= 原图 68/56 × 126/238)，按钮 116×42，边宽 = 切片 × 42/126 = 12/10px，
   即 3× 屏上 1:1 显示。横跨在木框下边中间，向下探出 22px(仍在屏幕内)；钮在滚动区外面，滚到哪里都在。
   视觉只有 116×42，点击区用 ::after 向四周多扩 4px(≈124×50)。选择器带 #settingsWrap 是为了压过 .homeBtn 及其 iPad 覆盖 */
#settingsWrap .panelClose {
  position: absolute; left: 0; right: 0; bottom: -22px; margin: 0 auto; z-index: 2;
  width: 116px; height: 42px;
  border-width: 12px 10px;
  border-image-source: url('assets/UI/btn_wood_panel.png');
  border-image-slice: 36 30 fill; border-image-width: 12px 10px;
  padding: 0 0 2px;
  font-size: 18px; letter-spacing: 1px;
}
#settingsWrap .panelClose::after { content: ''; position: absolute; inset: -4px; }
#settingsWrap .panelClose:active { filter: brightness(0.86) drop-shadow(0 2px 3px rgba(0,0,0,0.35)); }
html[data-lang="zh"] #settingsWrap .panelClose { font-size: 18px; letter-spacing: 3px; }
@media (min-width: 700px) { /* iPad：整体放大约 10%，2× 屏上仍是缩小显示，不糊 */
  #settingsWrap .panelClose { width: 128px; height: 46px; border-width: 13px 11px; border-image-width: 13px 11px; bottom: -24px; font-size: 20px; }
  html[data-lang="zh"] #settingsWrap .panelClose { font-size: 20px; }
}

/* ===== iPad 横屏 =====
   三列：左列D-pad(贴左下，左手拇指)，中间是尽量大的棋盘，右列撤销/步数/地图(贴右下，右手拇指)。
   #controls 用 display:contents 拆掉外壳，它里面的左槽和右列直接成为网格项；
   暂停模式的四个选项在右列里竖排，悬在地图/返回按钮上方。iPhone竖屏不受影响。 */
@media (orientation: landscape) and (min-width: 900px) {
  #app {
    display: grid;
    grid-template-columns: 262px minmax(0, 1fr) 176px; /* 两侧列只留够放D-pad/按钮的宽度，其余全给棋盘 */
    grid-template-rows: minmax(0, 1fr);
    align-items: stretch; justify-items: center;
    column-gap: 8px;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 24px max(20px, env(safe-area-inset-left));
  }
  #stage { grid-column: 2; grid-row: 1; justify-self: stretch; width: auto; min-width: 0; padding-bottom: 0; }
  #controls { display: contents; }
  #leftSlot { grid-column: 1; grid-row: 1; align-self: end; justify-self: center; }
  #dpad { transform-origin: 50% 100%; transform: scale(calc(var(--dpad-scale, 1) * var(--tablet-scale, 1.15))); }
  #actions { grid-column: 3; grid-row: 1; align-self: end; justify-self: center; gap: 58px; } /* 原 20+步数行18+20 */
  #undo { width: 104px; height: 104px; font-size: 20px; }
  #modeBtn { width: 76px; height: 76px; }
  #levelInfo { font-size: 14px; height: 18px; line-height: 18px; }
  #pauseRow {
    position: static; transform: none; grid-column: 3; grid-row: 1;
    align-self: center; justify-self: center;
    width: auto; flex-direction: column; gap: 16px;
  }
  #pauseRow button { width: 72px; height: 72px; }
}

/* ===== 主页 ===== */
#homeBg {
  position: fixed;
  inset: 0; /* 根因(100dvh计算偏矮)已解决，不再需要故意溢出的hack，恢复正常inset:0 */
  z-index: 199;

  background-position: center;

}
#homeBg.hide { opacity: 0; pointer-events: none; }
/* 横屏(iPad)换成横版背景图；竖屏(iPhone)沿用上面的竖版图。横版图传上来之前会退回占位底色 */
@media (orientation: landscape) {

#homeScreen {

#homeMenu {

  left: 50%;

/* 木箱按钮：九宫格。只取外框，中间用素材里的深棕色平涂，文字压在纯色上最清楚。
   换素材：替换 assets/UI/btn_wood_menu.png，并按新图的四角大小调下面 border-image-slice / border-width */
.homeBtn {
  height: 56px;
  border-style: solid;
  border-width: 16px 13px;   /* = 素材切片(68/56px) x 按钮高度/素材高度(56/239)，四角保持等比 */
  border-image-source: url('assets/UI/btn_wood_menu.png');
  border-image-slice: 68 56 fill; /* fill：把中间部分也铺满按钮(否则九宫格中间是空的) */
  border-image-width: 16px 13px;
  border-image-repeat: stretch;
  background: #aa733c;       /* 素材没加载到时的兜底底色(border-image盖不到边角) */
  background-clip: padding-box;
  padding: 0 0 3px;          /* 木板下沿有一条厚阴影，视觉中心偏上，文字跟着略微上提 */
  color: #fff;
  font-family: 'KenneyFutureNarrow', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  font-size: 27px;
  font-weight: 700;
  letter-spacing: 0.5px; /* Kenney Future 自带字距就很宽，不再额外加 */
  -webkit-text-stroke: 0.8px #fff; /* 这个字体笔画偏细，同色描一圈把白字略微加粗 */
  line-height: 1;
  /* 白字 + 深棕描边(8方向1.5px)，压在木色上也清楚 */
  text-shadow:
    -1.5px 0 #3a2410, 1.5px 0 #3a2410, 0 -1.5px #3a2410, 0 1.5px #3a2410,
    -1.5px -1.5px #3a2410, 1.5px -1.5px #3a2410, -1.5px 1.5px #3a2410, 1.5px 1.5px #3a2410,
    0 3px 3px rgba(0,0,0,0.35);
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35));
  display: flex; align-items: center; justify-content: center;
}
.homeBtn:active { filter: brightness(0.86) drop-shadow(0 2px 3px rgba(0,0,0,0.35)); transform: translateY(1px); }
.homeBtn.disabled { opacity: 0.5; pointer-events: none; }
/* 中文模式：主页菜单用系统粗体(Kenney字体没有中文字形)，字号/字距按汉字调整 */
html[data-lang="zh"] .homeBtn {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  font-weight: 800; font-size: 24px; letter-spacing: 4px; -webkit-text-stroke: 0;
}
/* iPad横屏：屏幕大很多，按钮和字整体放大一档；位置先按竖版逻辑推测(居中偏下)，拿到横版截图后再微调 */
@media (orientation: landscape) and (min-width: 900px) {
  #homeMenu { width: 360px; gap: 14px; bottom: 9vh; }
  .homeBtn { height: 66px; font-size: 32px; border-width: 19px 15px; border-image-width: 19px 15px; } /* 68/56 x 66/239，同上 */
  html[data-lang="zh"] .homeBtn { font-size: 29px; }

/* 版本号和署名压在很花的底图上：文字用不透明白色 + 深色8方向描边 + 柔光，保证看得清 */
#homeVersion, #homeCredit {
  color: #fff;
  text-shadow:
    -1px 0 rgba(0,0,0,0.9), 1px 0 rgba(0,0,0,0.9), 0 -1px rgba(0,0,0,0.9), 0 1px rgba(0,0,0,0.9),
    -1px -1px rgba(0,0,0,0.9), 1px -1px rgba(0,0,0,0.9), -1px 1px rgba(0,0,0,0.9), 1px 1px rgba(0,0,0,0.9),
    0 0 5px rgba(0,0,0,0.7);
}
#homeVersion {
  position: absolute;
  padding: 10px 8px; /* 加大点按范围(调试开关要连点它)，位置用right/bottom抵消 */
  /* iPhone屏幕底部四角是大圆角(约55pt)：往里收32px、抬高一点，避免被圆角切到 */
  right: calc(max(32px, env(safe-area-inset-right)) - 8px);

#homeCredit {

  font-weight: 600;
  pointer-events: none; /* 这一条全宽横条不能吃掉点击 */
}

/* ===== 过关面板：木牌(assets/UI/panel_win_wood.webp，864×1301) =====
   不用九宫格：内容量固定(标题+三星+两行数字+两个按钮)，不像设置/选关那样要装下滚动列表，
   所以直接把石板当整块背景图铺满一个固定宽高比的盒子(aspect-ratio跟素材原比例一致，不会被拉变形)，里面用绝对定位摆内容。
   石板顶部天然有一条雕刻分割线(约在11.4%高度处)，标题文字卡在那条线上方的窄条里。
   按钮用实心圆徽(和UNDO/预览按钮同一视觉语言)，不用纯描边贴在石头上——测过描边版本存在感太弱。
   石板颜色固定不跟主题走(奖励时刻，特意跳出三套主题色，不需要再适配)，文字用白底深墨绿描边，同一套手绘描边语言。 */
#winOverlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  z-index: 260; /* 盖在暂停行等游戏内 UI 之上 */
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
#winOverlay.show { opacity: 1; pointer-events: auto; }
#winPanel {
  position: relative;
  width: min(64vw, 280px); aspect-ratio: 864 / 1301; /* 比例=素材原图(panel_win_wood.webp 864×1301)，绝不拉伸变形；手机上一开始给到84vw太占屏幕，缩到64vw像张奖励卡片 */
  background: url('assets/UI/panel_win_wood.webp') center / 100% 100% no-repeat;
  transform: scale(0.9); opacity: 0;
  transition: transform 0.25s cubic-bezier(.2,1.3,.4,1), opacity 0.2s ease;
}
#winOverlay.show #winPanel { transform: scale(1); opacity: 1; }
@media (min-width: 700px) { #winPanel { width: min(50vw, 420px); } } /* iPad 横屏这个比例看着还行，保持不变 */
#winTitle { /* 木牌上刻字：深棕实心字 + 一条极浅的高光描边，做出刻进木头里的凹陷感，不再是jade版的白字深描边 */
  position: absolute; left: 0; right: 0; top: 8.5%; text-align: center;
  font-family: 'KenneyFutureNarrow', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  font-size: clamp(20px, 7.2vw, 29px); font-weight: 700; color: #3a2415;
  -webkit-text-stroke: 0.03em rgba(255,235,205,0.35); paint-order: stroke fill; letter-spacing: 1px;
  text-shadow: 0 1px 0 rgba(255,240,215,0.5);
}
#winBody {
  position: absolute; left: 12%; right: 12%; top: 21%; bottom: 27%;
  display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
}
#winStars { display: flex; gap: 12px; }
/* 星星大小改用固定 clamp，不再用百分比：#winStars 本身没有显式宽度(shrink-to-fit的flex子项)，
   子元素却按它的宽度算百分比——这种循环依赖在 Chrome 里会让百分比宽度直接算成 0，星星等于隐形，这是真bug不是没显示对 */
#winStars .ico { width: clamp(34px, 12.3vw, 50px); height: clamp(34px, 12.3vw, 50px); filter: drop-shadow(0 2px 1px rgba(74,47,23,0.35)); } /* 故意比标题字号大：这是这张卡片的视觉重心 */
#winStars .ico { -webkit-mask: none; mask: none; background: var(--ico) center/contain no-repeat; } /* 星星素材自带配色，不走全局 .ico 的遮罩上色 */
#winStars .ico:not(.filled) { background: #7a5630; -webkit-mask: var(--ico) center/contain no-repeat; mask: var(--ico) center/contain no-repeat; opacity: 0.8; } /* 空星在浅色木牌上：白描边太弱，改成深棕描边(icon_star_empty 当遮罩) */
#winTitle.perfect { color: #8a5a1e; -webkit-text-stroke: 0.03em rgba(255,220,140,0.55); }
#winStars.perfect .ico { display: none; } /* 完美通关：三颗星换成一枚大皇冠(大小是星星的 1.5 倍，用负 margin 把高度补回去，卡片布局不动) */
#winStars.perfect::after { content: ''; --ws: clamp(34px, 12.3vw, 50px); width: calc(var(--ws) * 1.5); height: calc(var(--ws) * 1.5); margin: calc(var(--ws) * -0.25) 0;
  background: url('assets/UI/icons/icon_crown.svg') center/contain no-repeat; filter: drop-shadow(0 2px 1px rgba(74,47,23,0.35)); }
/* 星星两侧的装饰小闪光：四角星形状(clip-path画，不需要贴图)，纯装饰，星级/皇冠状态都会显示；轻微呼吸动画，慢且弱，不抢视线 */
#winStars { position: relative; }
.winSparkle { position: absolute; width: 12px; height: 12px; background: var(--accent);
  clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
  opacity: 0.85; pointer-events: none; animation: winSparkleTwinkle 2.6s ease-in-out infinite; }
.winSparkle.a { top: -9px; left: -4px; width: 9px; height: 9px; animation-delay: 0.6s; }
.winSparkle.b { bottom: -7px; right: -5px; animation-delay: 0s; }
@keyframes winSparkleTwinkle { 0%, 100% { opacity: 0.55; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.1); } }
#winSteps, #winBest { /* 木牌上的文字改深棕实色，不再套jade版的白字深绿描边；图标+文字一行，用 flex 排 */
  font-family: 'KenneyFutureNarrow', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  color: #4a2f17; text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
#winSteps { font-size: clamp(18px, 6.2vw, 25px); }
#winBest { font-size: clamp(13px, 4.5vw, 18px); opacity: 0.85; }
#winSteps::before, #winBest::before { content: ''; flex: none; height: 0.85em; align-self: center; }
#winSteps::before { width: 0.76em; } /* 脚印 128×143(补上被误删的两只小拇指后，图更宽了) */
#winBest::before { width: 0.98em; } /* 皇冠 96×83 */
#winSteps::before { background: url('assets/UI/icons/icon_footstep.png') center/contain no-repeat; } /* 本局步数：脚印图标 */
#winBest::before { background: url('assets/UI/icons/icon_crown_brown.png') center/contain no-repeat; } /* 历史最佳：深棕皇冠(和木牌上刻字同色系)；金色那枚 icon_crown.svg 只用于完美通关 */
#winButtons { position: absolute; left: 0; right: 0; bottom: 6%; display: flex; justify-content: center; gap: 8%; }
.winBadge { /* 两颗按钮换成木质方按钮贴图(图标已经画在贴图里)，不再是纯色圆徽+单独图标叠加 */
  width: 30%; aspect-ratio: 256 / 211; border: none; padding: 0; /* 按钮贴图 256×211，不是正方形；阴影用 drop-shadow 跟着贴图轮廓走，不用 box-shadow */
  background: url('assets/UI/btn_win_retry.png') center/contain no-repeat;
  filter: drop-shadow(0 5px 3px rgba(60,35,12,0.4));
}
.winBadge.next { background-image: url('assets/UI/btn_win_next.png');
  filter: drop-shadow(0 5px 3px rgba(60,35,12,0.4)) brightness(0.88) saturate(1.05); } /* 下一关(主操作)贴图颜色和重试太接近，这里压暗一点拉开层次；不够/太深的话就改这个 0.88 */
.winBadge:active { filter: drop-shadow(0 2px 2px rgba(60,35,12,0.4)) brightness(0.82); transform: translateY(2px); }
.winBadge.next:active { filter: drop-shadow(0 2px 2px rgba(60,35,12,0.4)) brightness(0.78) saturate(1.05); }
.winBadge.hide { display: none; }
#winButtons.single .winBadge.next { display: none; } /* 已经是最后一关：只留重试，见 openWinPanel */

/* ===== 关卡选择：木框浮层，结构和设置面板(#settingsOverlay/.artPanel)同一套，宽度更大以放下木箱网格 =====
   #levelPickWrap 是面板 + 底部木板的外层；面板本身可滚动，木板固定在外面(不随列表滚动)。
   每关一块木箱(assets/UI/level_tile_light.png，9-slice四角不拉伸，中间纯色区域拉伸铺满格子——
   实测边框占比小，直接拉伸不明显走样，比裁 9-slice 简单)；已解锁显示白字描边关卡号，未解锁盖一个 icon_lock 图标、
   整块降饱和调暗；三星评分位置已经留好(.lpStars)，暂时是空的占位，等基准步数出来再点亮。
   iPhone 竖屏固定 4 列；iPad(面板变宽后)用 JS 按面板内宽度算合适列数(4~8)，横屏通常落在 6 列左右。 */
#levelPickOverlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  padding: max(5vh, env(safe-area-inset-top)) 14px 5vh;
  z-index: 250;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
#levelPickOverlay.show { opacity: 1; pointer-events: auto; }
#levelPickWrap {
  position: relative;
  width: 100%; max-width: 620px; /* 比设置面板(460)宽，好放下 4 列木箱；iPad 上还会再放宽，见下面 media */
  max-height: 100%;
  display: flex; flex-direction: column;
  transform: scale(0.96);
  transition: transform 0.2s ease;
}
#levelPickOverlay.show #levelPickWrap { transform: scale(1); }
#levelPickSheet {
  width: 100%; min-height: 0;
  padding: 10px 12px 26px; /* 底部多留一点，避免最后一排贴着木框下边 */
  touch-action: pan-y;
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}
@media (min-width: 700px) { #levelPickWrap { max-width: 900px; } }
.chapterHead {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 13px; font-weight: 700; color: var(--sub);
  margin: 18px 4px 10px;
}
.chapterHead:first-child { margin-top: 2px; }
.levelPickGrid {
  display: grid;
  grid-template-columns: repeat(var(--lp-cols, 4), 1fr);
  gap: 18px 20px; /* 列间距加大，格子跟着变小(4列不变，靠间距挤出空间) */
}
.lpTileWrap { display: flex; flex-direction: column; align-items: center; min-width: 0; } /* min-width:0：防止内容把网格列撑宽 */
.levelPickBtn {
  position: relative; width: 100%; aspect-ratio: 1; /* 正方形木板素材(v1.14.2起)，不再是384/449的木箱比例 */
  padding: 0; border: 0; background: var(--lp-tile, url('assets/UI/level_tile_light.png')) center / 100% 100% no-repeat;
  display: flex; align-items: center; justify-content: center;
}
.levelPickBtn:active { filter: brightness(0.92); }
.levelPickBtn .num {
  font-family: 'KenneyFutureNarrow', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  font-weight: 700; color: #fff;
  -webkit-text-stroke: 0.1em #4a2f17; paint-order: stroke fill; letter-spacing: 0; /* 描边用em：字号变了描边粗细跟着变，不会显得过粗或过细 */
}
/* 按位数动态调字号：1/2 位数字放大(木箱显得没那么空)，3 位数保持不变 */
.levelPickBtn .num.d1 { font-size: clamp(32px, 15vw, 46px); }
.levelPickBtn .num.d2 { font-size: clamp(27px, 12vw, 39px); }
.levelPickBtn .num.d3 { font-size: clamp(20px, 9vw, 31px); } /* 格子缩小了，数字比例再往上提一点，不然显得字变小了 */
.levelPickBtn.current::after { /* 当前关：外圈一圈强调色描边，和选关小面板 .current 同一个视觉语言 */
  content: ''; position: absolute; inset: -5px; border: 3px solid var(--accent); border-radius: 10px; pointer-events: none;
}
.levelPickBtn.locked { filter: saturate(0.5) brightness(0.8); }
.levelPickBtn.locked .num { display: none; }
.levelPickBtn .ico.lockIco { width: 65%; height: 65%; background: #fff; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.35)); } /* 纯白+更大，和木箱格子的金色(奖励语义)分开，专指「还没解锁」*/
.lpStars { width: 100%; margin-top: 6px; display: flex; justify-content: space-between; } /* 三颗星总宽≤格子宽：星星按格子宽度均分(向下取整到整像素)，不同屏幕宽度自动缩放。锁定的关卡放三个隐藏占位星(.ph)，行高保持一致 */
.lpStars i { flex: none; align-self: flex-start; aspect-ratio: 1;
  width: calc(100% / 3 - 1px); width: round(down, calc(100% / 3 - 1px), 1px); /* 取整像素，三颗星大小完全一致，不会因小数像素被渲染得忽大忽小；旧浏览器不认 round() 就用上一行 */ /* 空星：icon_star_empty.svg 是白色描边的空心星，白色在浅色面板上看不见，所以当遮罩用，涂成面板文字色 var(--ink)：浅色主题是深棕，黑色主题是近白，随主题自动换 */
  background: var(--ink); opacity: 0.9;
  -webkit-mask: url('assets/UI/icons/icon_star_empty.svg') center/contain no-repeat; mask: url('assets/UI/icons/icon_star_empty.svg') center/contain no-repeat; }
.lpStars i.ph { visibility: hidden; }
@media (min-width: 700px) { .lpStars i { width: calc(100% / 3 - 6px); width: round(down, calc(100% / 3 - 6px), 1px); } } /* iPad 格子大，星星之间的空隙也放宽一点 */
.lpStars i.on { opacity: 1; background: url('assets/UI/icons/icon_star.svg') center/contain no-repeat; -webkit-mask: none; mask: none; } /* 点亮的星直接用金色实心素材自带配色 */
.lpStars { --lp-crown: 24px; } /* 完美的关：三颗星换成一枚皇冠，尺寸改这个变量(手机 24px，iPad 见下面的媒体查询) */
.lpStars.perfect { position: relative; } /* 里面仍放三个隐藏占位星撑住行高，皇冠绝对定位居中，各行间距不受皇冠大小影响 */
.lpStars i.crown { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: var(--lp-crown); height: var(--lp-crown); aspect-ratio: auto; opacity: 1;
  background: url('assets/UI/icons/icon_crown.svg') center/contain no-repeat; -webkit-mask: none; mask: none; }
@media (min-width: 700px) { .lpStars { --lp-crown: 44px; } }
/* 底部固定木板：结构、九宫格切片都和设置面板的关闭木板(.panelClose)同一套，只是更宽、装两个图标键 */
#lpPlank {
  position: absolute; left: 0; right: 0; bottom: -22px; margin: 0 auto; z-index: 2;
  width: 148px; height: 42px;
  display: flex; align-items: stretch; justify-content: space-evenly;
  border-style: solid; border-width: 12px 10px;
  border-image-source: url('assets/UI/btn_wood_panel.png');
  border-image-slice: 36 30 fill; border-image-width: 12px 10px;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35));
}
#lpPlank .ico-btn { flex: 1; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #fff; }
#lpPlank .ico-btn:active { filter: brightness(0.8); }
#lpPlank .ico { width: 26px; height: 26px; }
@media (min-width: 700px) { #lpPlank { width: 164px; height: 46px; border-width: 13px 11px; border-image-width: 13px 11px; bottom: -24px; } #lpPlank .ico { width: 28px; height: 28px; } }
/* 章节跳转：10 块小木板(2列5行)，同一张按钮素材缩小复用；点了滚动列表到那一章并关掉浮层 */
#chapterJumpOverlay {
  position: fixed; inset: 0; z-index: 260;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.3);
  opacity: 0; pointer-events: none; transition: opacity 0.15s ease;
}
#chapterJumpOverlay.show { opacity: 1; pointer-events: auto; }
#chapterJumpGrid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 14px;
  padding: 16px;
}
.chapterJumpBtn {
  width: 116px; height: 42px; padding: 0 0 2px;
  border-style: solid; border-width: 12px 10px;
  border-image-source: url('assets/UI/btn_wood_panel.png');
  border-image-slice: 36 30 fill; border-image-width: 12px 10px;
  background: #aa733c; background-clip: padding-box; /* 素材四角是切角的，外面是透明像素；没有底色兜底就会露出面板后面的主题色 */
  font-family: 'KenneyFutureNarrow', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px; font-weight: 700; color: #fff;
  text-shadow: -1px 0 #3a2410, 1px 0 #3a2410, 0 -1px #3a2410, 0 1px #3a2410;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,0.3));
}
.chapterJumpBtn:active { filter: brightness(0.85); }
.chapterJumpBtn.locked { filter: saturate(0.45) brightness(0.7) drop-shadow(0 3px 4px rgba(0,0,0,0.3)); } /* 该章第一关还没解锁：整块变灰暗，仍可点(只是跳过去看看，不解锁任何东西) */
.settingsHeader {
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 700; font-size: 15px; margin-bottom: 14px;
}
.settingsSection { margin-bottom: 16px; }
.settingsSection:last-child { margin-bottom: 0; }
.settingsLabel { font-size: 12px; color: var(--sub); margin-bottom: 8px; font-weight: 600; }
.swatchRow { display: flex; gap: 10px; flex-wrap: wrap; }
.swatchBtn {
  width: 54px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: none; border: none; padding: 0;
}
.swatchBtn .swatchImg {
  width: 44px; height: 44px; border-radius: 10px;

}
.swatchBtn.active .swatchImg { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.swatchBtn .swatchText { font-size: 10px; color: var(--ink); }
.pillBtn {

.pillBtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.sliderRow { display: flex; align-items: center; gap: 10px; }
.sliderRow input[type="range"] { flex: 1; touch-action: pan-x; }
.sliderRow .sliderVal { font-size: 12px; color: var(--sub); width: 36px; text-align: right; }

function defaultLang() { return (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en'; }

  const table = I18N[settings.lang] || I18N.zh;
  const v = table[key] !== undefined ? table[key] : (I18N.zh[key] !== undefined ? I18N.zh[key] : key);

}

const SETTINGS_KEY = 'sokoban_appearance_v1';
const DEFAULT_SETTINGS = { lang: defaultLang(), theme: 'green', floor: 'grey', wall: 'red1', crate: 'brown', dpadStyle: 'cross', dpadCross: { scale: 100, x: 0, y: 0 }, dpadSplit: { scale: 100, x: 0, y: 0, gap: 48 }, boardWPct: 100, boardHPct: 100, walkMs: 260, pushMs: 300, boxFx: 'rebound', tuneVer: 1 };
// tuneVer：手感类默认值(走路/推箱时长、箱子回弹)的版本号。存档里没有或者比这个旧，就把这几项重置成上面的默认值，
// 否则老设备存着的旧数字会一直盖住新默认值。以后再改这几个默认值，把 tuneVer 加 1 即可。

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return { ...DEFAULT_SETTINGS };
    const saved = JSON.parse(raw);
    const st = { ...DEFAULT_SETTINGS, ...saved };
    if (!saved.dpadCross && !saved.dpadSplit) { // 旧版本：十字/分离共用一套参数 → 拆成各自一份，起始值都等于旧值(间距只属于分离式)
      const o = { scale: saved.dpadScale ?? 100, x: saved.dpadOffset ?? 0, y: saved.dpadOffsetY ?? 0 };
      st.dpadCross = { ...o };
      st.dpadSplit = { ...o, gap: saved.dpadGap ?? 48 };
    }
    ['dpadScale', 'dpadOffset', 'dpadOffsetY', 'dpadGap'].forEach(k => delete st[k]);
    if (saved.tuneVer !== DEFAULT_SETTINGS.tuneVer) {
      ['walkMs', 'pushMs', 'boxFx'].forEach(k => { st[k] = DEFAULT_SETTINGS[k]; });
      delete st.boxFxPct; // 旧版本的强度滑块，已取消
      st.tuneVer = DEFAULT_SETTINGS.tuneVer;
    }
    return st;
  } catch (e) { return { ...DEFAULT_SETTINGS }; }
}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
}
function dpadCfg() { return settings.dpadStyle === 'split' ? settings.dpadSplit : settings.dpadCross; } // 当前样式的那一份 D-pad 参数
function applySettings() {
  if (!THEMES[settings.theme]) settings.theme = 'green';
  document.documentElement.dataset.theme = settings.theme;
  if (settings.lang !== 'zh' && settings.lang !== 'en') settings.lang = defaultLang();
  document.documentElement.dataset.lang = settings.lang;
  document.documentElement.lang = settings.lang === 'zh' ? 'zh-CN' : 'en';
  settings.walkMs = Math.max(120, Math.min(600, Number(settings.walkMs) || 280)); // 防止存档里的怪值
  settings.pushMs = Math.max(120, Math.min(600, Number(settings.pushMs) || 300));
  if (!['off', 'rebound'].includes(settings.boxFx)) settings.boxFx = 'rebound';
  const tc = document.getElementById('themeColorMeta');
  if (tc) tc.content = THEMES[settings.theme].bg;
  const root = document.documentElement.style;
  root.setProperty('--img-floor', `url('assets/Ground/ground_${settings.floor}.png')`);
  root.setProperty('--img-target', `url('assets/Ground/ground_${settings.floor}Target.png')`);
  root.setProperty('--img-wall', `url('assets/Blocks/block_${settings.wall}.png')`);
  root.setProperty('--img-crate', `url('assets/Crates/crate_${settings.crate}.png')`);
  root.setProperty('--img-crateDone', `url('assets/Crates/crate_${settings.crate}Done.png')`);
  // 十字和分离式各存一份大小/位置(分离式还有间距)，切样式时滑块跟着换；这里顺便把存档里的怪值夹回范围
  const nd = (o, d, lim) => { const r = { ...d, ...(o || {}) }; Object.keys(lim).forEach(k => { r[k] = Math.max(lim[k][0], Math.min(lim[k][1], Number(r[k]) || d[k])); }); return r; };
  settings.dpadCross = nd(settings.dpadCross, DEFAULT_SETTINGS.dpadCross, { scale: [70, 140], x: [-50, 50], y: [-200, 40] });
  settings.dpadSplit = nd(settings.dpadSplit, DEFAULT_SETTINGS.dpadSplit, { scale: [70, 140], x: [-50, 50], y: [-200, 40], gap: [36, 95] });
  const dc = dpadCfg();
  root.setProperty('--dpad-scale', dc.scale / 100);
  root.setProperty('--dpad-offset', `${dc.x}px`);
  root.setProperty('--dpad-offset-y', `${dc.y}px`);
  root.setProperty('--split-r', `${settings.dpadSplit.gap}px`);
  document.getElementById('dpad').classList.toggle('style-split', settings.dpadStyle === 'split');
}

function lpColumnCount(sheetWidth) {
  if (window.innerWidth < 700) return 4;
  const targetTile = 150; // 目标"格子+间距"宽度，只用来反推列数，不是精确尺寸
  return Math.max(4, Math.min(8, Math.round(sheetWidth / targetTile)));
}
const chapterHeads = []; // openLevelPick 每次重建时填充，章节跳转要用它们的位置
function openLevelPick() {
  const list = document.getElementById('levelPickList');
  const sheet = document.getElementById('levelPickSheet');
  list.innerHTML = '';
  chapterHeads.length = 0;
  const cur = state ? state.levelIndex : firstUnclearedIndex();
  let clearedTotal = 0;
  LEVELS.forEach((_, i) => { if (isCleared(i)) clearedTotal++; });
  document.getElementById('levelPickTitle').textContent = t('pickTitle', clearedTotal, LEVELS.length);
  sheet.style.setProperty('--lp-cols', lpColumnCount(sheet.clientWidth - 24)); // -24：#levelPickSheet 左右 padding
  let curBtn = null;
  let base = 0;
  LEVEL_CHAPTERS.forEach((ch, ci) => {
    let done = 0;
    ch.levels.forEach((_, li) => { if (isCleared(base + li)) done++; });
    const head = document.createElement('div');
    head.className = 'chapterHead';
    head.innerHTML = `<span>${t('chapter', ci + 1)}</span><span>${done} / ${ch.levels.length}</span>`;
    list.appendChild(head);
    chapterHeads.push(head);
    const grid = document.createElement('div');
    grid.className = 'levelPickGrid';
    ch.levels.forEach((_, li) => {
      const i = base + li;
      const unlocked = isUnlocked(i);
      const wrap = document.createElement('div');
      wrap.className = 'lpTileWrap';
      const btn = document.createElement('button');
      btn.className = 'levelPickBtn' + (i === cur ? ' current' : '') + (unlocked ? '' : ' locked');
      btn.innerHTML = unlocked
        ? `<span class="num d${String(i + 1).length}">${i + 1}</span>` // 1/2/3 位数字用不同字号(见 .num.d1/.d2/.d3)
        : `<i class="ico lockIco" style="--ico:url(${ICON_DIR}icon_lock.svg)"></i>`;
      // 列表要能滚动：这里不用bindTap(它会在touchstart里preventDefault把滚动吃掉)，用原生click
      btn.addEventListener('click', () => {
        if (!isUnlocked(i)) { showToast(t('lockedHint', i)); return; }
        loadLevel(i);
        closeLevelPick();
        hideHomeScreen();
      });
      wrap.appendChild(btn);
      const stars = document.createElement('div'); // 三星评级：按历史最佳步数/par 点亮，没通关就是三颗空星
      const bestMoves = progress.cleared[LEVEL_META[i].id];
      const n = starsFor(bestMoves, LEVEL_META[i].par);
      const perfectLv = unlocked && isPerfect(bestMoves, LEVEL_META[i].par); // 达到 par：三颗星换成一枚皇冠
      stars.className = 'lpStars' + (perfectLv ? ' perfect' : '');
      stars.innerHTML = [0, 1, 2].map(k => `<i class="${!unlocked || perfectLv ? 'ph' : k < n ? 'on' : ''}"></i>`).join('') + (perfectLv ? '<i class="crown"></i>' : ''); // 锁定的关卡不显示星星(连空星也不画)，但放隐藏占位保持行高
      wrap.appendChild(stars);
      if (i === cur) curBtn = wrap;
      grid.appendChild(wrap);
    });
    list.appendChild(grid);
    base += ch.levels.length;
  });
  document.getElementById('levelPickOverlay').classList.add('show');
  if (curBtn) { // 把当前关滚动到面板中间(滚动容器是 #levelPickSheet 本身，不是 list)
    const sr = sheet.getBoundingClientRect(), br = curBtn.getBoundingClientRect();
    sheet.scrollTop += br.top - sr.top - sheet.clientHeight / 2 + br.height / 2;
  }
}

function openChapterJump() {

      bindTap(b, () => {

        closeChapterJump();
      });

    });

  document.getElementById('chapterJumpOverlay').classList.add('show');
}

const DPAD_FILES = ['dpad.svg', 'dpad_fill.svg', 'dpad_highlight.svg',
  ...DPAD_SPLIT_DEFS.flatMap(d => [`dpad_element_${d.name}.svg`, `dpad_element_${d.name}_fill.svg`, `dpad_element_${d.name}_highlight.svg`])];
function preloadAllAssets() {
  const paths = [
    'assets/UI/btn_wood_menu.png',
    'assets/UI/btn_wood_panel.png',
    'assets/UI/level_tile_light.png',
    'assets/UI/panel_win_wood.webp',
    'assets/UI/btn_win_retry.png', 'assets/UI/btn_win_next.png',

    ...WALL_KEYS.map(k => `assets/Blocks/block_${k}.png`),

preloadAllAssets();

/* ---------- 关卡数据 ---------- */
// 关卡数据来自 levels.js (window.LEVEL_PACK)，按 章节 -> 关卡 拍平成一个顺序数组
const LEVEL_CHAPTERS = (window.LEVEL_PACK && window.LEVEL_PACK.chapters && window.LEVEL_PACK.chapters.length)
  ? window.LEVEL_PACK.chapters
  : [{ name: '第 1 章', levels: [{ id: 'T-1', xsb: "#####\n#   #\n# $ #\n#.@ #\n#   #\n#####" }] }]; // levels.js 没加载到时的兜底
const LEVELS = [];      // 每关的 XSB 文本
const LEVEL_META = [];  // 每关的 {id, chapter, pos}，和 LEVELS 下标一一对应
LEVEL_CHAPTERS.forEach((ch, ci) => ch.levels.forEach((lv, li) => {
  LEVELS.push(lv.xsb);
  LEVEL_META.push({ id: lv.id, chapter: ci, pos: li, par: lv.par }); // par = 最少人物总步数(levels.js 里的 par 字段)
}));

/* ---------- 进度：顺序解锁 ----------
   progress.cleared 以关卡id为key存最佳步数(按id而不是下标，以后调整关卡顺序不会错位)；
   第i关解锁 = 第i-1关已通关(第1关永远解锁)。调试开关在主页连点版本号7次。 */
const PROGRESS_KEY = 'sokoban_progress_v1';
function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      return { cleared: p.cleared || {}, debugUnlock: !!p.debugUnlock, debugMode: !!(p.debugMode || p.debugUnlock) };
    }
  } catch (e) {}
  return { cleared: {}, debugUnlock: false, debugMode: false };
}
let progress = loadProgress();
function saveProgress() {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {}
}
/* 星级：按 步数/par 算，par 是每关最少人物总步(moves，不是 pushes)。
   ≤110% = 3星，≤130% = 2星，超过 130% 一律 1星(不封顶)；没通关 = 0星(三颗空星)。通关至少 1 星。
   用整数乘法比较，避免浮点边界误差；选关页按历史最佳步数算，过关面板按本局步数算，不额外存星级。 */
function starsFor(moves, par) {
  if (moves === undefined) return 0;
  if (!par) return 1;
  const m = moves * 100;
  return m <= par * 110 ? 3 : m <= par * 130 ? 2 : 1;
}
// 完美：步数达到(或低于)par。par 只有一部分关是求解器证明的最优，其余是社区已知最佳，所以文案叫「完美」不叫「最优」。
function isPerfect(moves, par) { return moves !== undefined && !!par && moves <= par; }
function isCleared(i) { return progress.cleared[LEVEL_META[i].id] !== undefined; }
function isUnlocked(i) { return progress.debugUnlock || i === 0 || isCleared(i - 1); }
function firstUnclearedIndex() {
  for (let i = 0; i < LEVELS.length; i++) if (!isCleared(i)) return i;
  return LEVELS.length - 1;
}
function updateNavButtons() {} // 顶部关卡导航已取消，保留空函数免得到处改调用
function refreshHomeUI() {
  const any = Object.keys(progress.cleared).length > 0;
  document.getElementById('homeStart').textContent = (any || cameFromGame || !!readAutosave()) ? t('continue') : t('start');
}

/* ---------- 自动存档 ----------
   只存「关卡id + 走过的方向序列」(U/D/L/R，200步约200字符)，恢复时在一张新棋盘上无动画重放，
   位置、步数、撤销记录自然还原。触发：最后一次有效走步后停顿 idleMs 才存(连续走/拐弯/慢半拍都不算停)；
   一直在改动则每 forceMs 强制存一次；pagehide / 切后台 / 点开暂停菜单一定存。
   撞墙、推不动不算变化；撤销算一次变化。通关、重来、换关(loadLevel)时清掉。 */
const AUTOSAVE_KEY = 'sokoban_autosave_v1';
const AUTOSAVE_CFG = { idleMs: 1500, forceMs: 15000 }; // 手感不对只改这两个数
const DIR_CH = { up: 'U', down: 'D', left: 'L', right: 'R' };
const CH_VEC = { U: [-1, 0, 'up'], D: [1, 0, 'down'], L: [0, -1, 'left'], R: [0, 1, 'right'] };
let autosaveTimer = null;
let autosaveDirtySince = 0; // 第一次未保存改动的时间戳，0 = 没有未保存的改动
function readAutosave() {
  try {
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if (!raw) return null;
    const sv = JSON.parse(raw);
    if (!sv || typeof sv.id !== 'string' || typeof sv.seq !== 'string' || !sv.seq) return null;
    const idx = LEVEL_META.findIndex(m => m.id === sv.id);
    return idx < 0 ? null : { idx, seq: sv.seq };
  } catch (e) { return null; }
}
function clearAutosave() {
  clearTimeout(autosaveTimer); autosaveTimer = null; autosaveDirtySince = 0;
  try { localStorage.removeItem(AUTOSAVE_KEY); } catch (e) {}
}
function saveAutosaveNow() {
  clearTimeout(autosaveTimer); autosaveTimer = null;
  if (!state || state.won || !autosaveDirtySince) return;
  autosaveDirtySince = 0;
  try {
    const seq = state.moveLog.join('');
    if (!seq) localStorage.removeItem(AUTOSAVE_KEY); // 撤销到起点：没有可恢复的进度
    else localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ id: LEVEL_META[state.levelIndex].id, seq }));
  } catch (e) {}
}
function markAutosaveDirty() { // 每次有效走步/撤销后调用
  const now = Date.now();
  if (!autosaveDirtySince) autosaveDirtySince = now;
  if (now - autosaveDirtySince >= AUTOSAVE_CFG.forceMs) { saveAutosaveNow(); return; }
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(saveAutosaveNow, AUTOSAVE_CFG.idleMs);
}
// 无动画重放：规则与 tryMove 一致，遇到走不通的步(比如关卡数据改过)就停在那里
function replayMoves(seq) {
  let done = 0;
  for (const ch of seq) {
    const v = CH_VEC[ch];
    if (!v) break;
    const [dr, dc, dir] = v;
    const nr = state.player.r + dr, nc = state.player.c + dc;
    const nkey = nr + ',' + nc;
    if (state.walls.has(nkey)) break;
    const pushing = state.boxes.has(nkey);
    const bkey = (nr + dr) + ',' + (nc + dc);
    if (pushing && (state.walls.has(bkey) || state.boxes.has(bkey))) break;
    pushHistory();
    if (pushing) { state.boxes.delete(nkey); state.boxes.add(bkey); }
    state.player = { r: nr, c: nc };
    state.dir = dir;
    state.side = state.side === 'A' ? 'B' : 'A';
    state.moves++;
    state.moveLog.push(ch);
    done++;
  }
  return done;
}
// 冷启动/主页 START：有存档就恢复到存档，没有就去第一个没通关的关。返回恢复的步数(0=没恢复)
function loadInitialLevel() {
  const sv = readAutosave();
  if (!sv) { loadLevel(firstUnclearedIndex()); return 0; }
  loadLevel(sv.idx); // 会清掉存档，重放完再写回去
  const n = replayMoves(sv.seq);
  if (n === 0) { loadLevel(firstUnclearedIndex()); return 0; } // 存档是坏的/对不上：当没有存档
  renderBoardStructure();
  renderDynamic();
  initCamera();
  markAutosaveDirty();
  saveAutosaveNow();
  return n;
}
window.addEventListener('pagehide', saveAutosaveNow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveAutosaveNow(); });

let IDLE_DELAY = 300; // 静止后收拢延迟(ms)，随当步时长自动变(setMoveDur)
// 每步时长(ms)：走路和推箱分开(推箱慢一点，显得箱子重)，数值在 settings.walkMs / pushMs，开发者模式的「高级」里有滑块
let MOVE_DUR = settings.walkMs; // 当前这一步的时长，由 setMoveDur 按步设置，同时写进 --move-dur 让棋盘/玩家/箱子/镜头动画同款时长
const IDLE_GRACE = 20; // 停顿判定 = 当步时长 + 这点余量：动画没播完不会收拢，连点也不会在两步之间闪一下站立帧
const FOOTFALL_RATIO = 0.8; // 跨脚帧占比
const FOOTFALL_DIRS = new Set(['left', 'right']); // 插帧方向

function currentFrameKey() {
  const d = SPRITE[state.dir];
  return state.atNeutral ? d.stand : (state.side === 'A' ? d.stepA : d.stepB);
}

// 左右方向额外插收脚帧，上下方向两帧交替即可
function advanceGait(dir) {
  state.side = state.side === 'A' ? 'B' : 'A';
  state.atNeutral = false;
  if (FOOTFALL_DIRS.has(dir)) {
    scheduleFootfall();
  } else if (state.stepAnimTimer) {
    clearTimeout(state.stepAnimTimer);
    state.stepAnimTimer = null;
  }
}

function setMoveDur(pushing) { // 每次真正移动前调用(要在 advanceGait/lockMovement 之前)
  MOVE_DUR = pushing ? settings.pushMs : settings.walkMs;
  IDLE_DELAY = MOVE_DUR + IDLE_GRACE;
  document.documentElement.style.setProperty('--move-dur', MOVE_DUR + 'ms');
}

function scheduleFootfall() {
  if (state.stepAnimTimer) clearTimeout(state.stepAnimTimer);
  const delay = Math.max(30, Math.round(MOVE_DUR * FOOTFALL_RATIO));
  state.stepAnimTimer = setTimeout(() => {
    state.atNeutral = true;
    const sprite = document.getElementById('playerSprite');
    if (sprite) sprite.style.backgroundImage = `url(${PLAYER_FRAMES[currentFrameKey()]})`;
    state.stepAnimTimer = null;
  }, delay);
}

function scheduleIdle() {
  if (state.idleTimer) clearTimeout(state.idleTimer);
  state.idleTimer = setTimeout(() => {
    state.atNeutral = true; // 暂停 -> 收拢为站立，不消耗步数
    renderDynamic();
  }, IDLE_DELAY);
}

let state = null;

function parseLevel(str) {
  const rows = str.split('\n');
  const height = rows.length;
  const width = Math.max(...rows.map(r => r.length));
  const walls = new Set();
  const targets = new Set();
  const boxes = new Set();
  let player = null;
  for (let r = 0; r < height; r++) {
    const row = rows[r];
    for (let c = 0; c < width; c++) {
      const ch = row[c] || ' ';
      const key = r + ',' + c;
      if (ch === '#') walls.add(key);
      if (ch === '.') targets.add(key);
      if (ch === '$') boxes.add(key);
      if (ch === '*') { boxes.add(key); targets.add(key); }
      if (ch === '@') player = {r, c};
      if (ch === '+') { player = {r, c}; targets.add(key); }
    }
  }
  // 从玩家出发能走到的区域=关卡内部；其余非墙格是墙外空白，渲染成 void，不铺地板
  const inside = new Set();
  if (player) {
    const start = player.r + ',' + player.c;
    inside.add(start);
    const stack = [start];
    while (stack.length) {
      const [r, c] = stack.pop().split(',').map(Number);
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nc < 0 || nr >= height || nc >= width) continue;
        const nk = nr + ',' + nc;
        if (walls.has(nk) || inside.has(nk)) continue;
        inside.add(nk);
        stack.push(nk);
      }
    }
  }
  return { width, height, walls, targets, boxes, player, inside, moves: 0, moveLog: [], dir: 'down', side: 'B', atNeutral: true, idleTimer: null, stepAnimTimer: null, moveLock: false, moveLockTimer: null, inputQueue: [] };
}

let history = [];

function snapshot() {
  return {
    player: { ...state.player },
    boxes: new Set(state.boxes),
    moves: state.moves
  };
}

function pushHistory() {
  history.push(snapshot());
  if (history.length > 200) history.shift();
}

function loadLevel(idx) {
  if (state && state.idleTimer) clearTimeout(state.idleTimer);
  if (state && state.stepAnimTimer) clearTimeout(state.stepAnimTimer);
  if (state && state.moveLockTimer) clearTimeout(state.moveLockTimer);
  clearAutosave(); // 换关/重来：旧存档作废(冷启动恢复时重放完会重新写入)
  state = parseLevel(LEVELS[idx]);
  state.levelIndex = idx;
  history = [];
  resetPauseUI(); // 换关/重来一律退出暂停模式
  renderBoardStructure();
  renderDynamic();
  initCamera();
  updateLevelInfo();
}

function fitTileSize() {
  const { availW, availH } = boardBudget();
  const byWidth = Math.floor(availW / state.width);
  const byHeight = Math.floor(availH / state.height);
  const maxTile = isWideLayout() ? CAMERA_CFG.maxTileWide : CAMERA_CFG.maxTile;
  const tile = Math.max(CAMERA_CFG.minTile, Math.min(maxTile, byWidth, byHeight));
  document.documentElement.style.setProperty('--tile', tile + 'px');
}

// 相机/视口相关参数，都集中在这里，方便真机实测后微调
const CAMERA_CFG = {
  minTile: 34,      // 大地图也不再往小缩的最小可读tile
  maxTile: 56,       // 小地图不会被无意义放大
  maxTileWide: 80,   // iPad横屏：屏幕大得多，允许小地图放到更大(素材是64px图，放太大会发软，可按真机效果调)
  boardHeightRatio: 0.5, // 棋盘视口占屏幕高度的比例，剩下的留给D-pad等控制区
  safeZone: 0.30,     // 玩家离视口边缘小于这个比例时镜头才跟随
  lead: 0.6,           // 朝移动方向的前瞻偏移，单位:tile
  panStepTiles: 3,       // 预览模式下D-pad一次平移几格
  previewMinTile: 18,     // 预览模式缩放的下限，保证还能看清箱子/目标点，不无限缩小
};
let camera = { mode: 'play', normalX: 0, normalY: 0, previewX: 0, previewY: 0, viewW: 0, viewH: 0, boardW: 0, boardH: 0 };
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// 舞台：顶部安全区到D-pad上沿之间。下沿按D-pad实际显示位置(含大小/上下偏移设置)量，
// D-pad调大或上移时给舞台补一段下内边距，棋盘自动避让、依然在剩余区域里垂直居中
// iPad横屏(三列布局)：D-pad和按钮在两侧，中间整列都是棋盘；竖屏(iPhone)：D-pad在棋盘下面，棋盘在上方空闲区居中
function isWideLayout() { return window.matchMedia('(orientation: landscape) and (min-width: 900px)').matches; }
function stageInfo() {
  const stage = document.getElementById('stage');
  const sr = stage.getBoundingClientRect();
  if (isWideLayout()) {
    stage.style.paddingBottom = '0px';
    return { height: sr.height, width: sr.width };
  }
  const dp = document.getElementById('dpad').getBoundingClientRect();
  const extra = Math.max(0, sr.bottom - (dp.top - 10));
  stage.style.paddingBottom = extra + 'px';
  return { height: sr.height - extra, width: sr.width };
}
// 棋盘可用宽高预算，设置里的"棋盘宽度/高度"滑块乘在这里
function boardBudget() {
  const chrome = 10 * 2 + 4;   // board-wrap自身padding+border
  const tagH = 22;              // 关卡编号小字 + 间距
  const st = stageInfo();
  const wide = isWideLayout();
  const baseW = wide ? Math.max(200, st.width - chrome - 8)          // 横屏：中间整列的宽度
                     : Math.min(window.innerWidth - (16 * 2 + 10 * 2 + 4), 460); // 竖屏：沿用原来的算法，上限460
  const availW = baseW * (settings.boardWPct / 100);
  const availH = Math.max(120, st.height - chrome - tagH) * (settings.boardHPct / 100);
  return { availW, availH };
}

function syncViewport() {
  const tile = tileSize();
  camera.boardW = state.width * tile;
  camera.boardH = state.height * tile;
  const { availW, availH } = boardBudget();
  camera.viewW = Math.min(camera.boardW, availW);
  camera.viewH = Math.min(camera.boardH, availH);
  const chrome = 10 * 2 + 4; // board-wrap自身padding+border
  const wrap = document.getElementById('board-wrap');
  wrap.style.width = (camera.viewW + chrome) + 'px';
  wrap.style.height = (camera.viewH + chrome) + 'px';
}

// 预览模式的缩放比例：尽量整张地图都塞进视口，但tile不能缩得比previewMinTile还小
function computePreviewScale() {
  const tile = tileSize();
  const fitScale = Math.min(camera.viewW / camera.boardW, camera.viewH / camera.boardH);
  const minScale = CAMERA_CFG.previewMinTile / tile;
  return Math.min(1, Math.max(fitScale, minScale));
}

function applyCameraTransform(instant) {
  const board = document.getElementById('board');
  let transformStr;
  if (camera.mode === 'preview') {
    const s = computePreviewScale();
    transformStr = `scale(${s}) translate(${-camera.previewX}px, ${-camera.previewY}px)`;
  } else {
    transformStr = `translate(${-camera.normalX}px, ${-camera.normalY}px)`;
  }
  if (instant) {
    board.style.transition = 'none';
    board.style.transform = transformStr;
    void board.offsetWidth; // 强制重排，避免下次过渡被跳过
    board.style.transition = '';
  } else {
    board.style.transform = transformStr;
  }
}

// 关卡加载/重设窗口时用：让镜头瞬间以玩家为中心归位，不做跟随动画
function initCamera() {
  syncViewport();
  const tile = tileSize();
  const px = state.player.c * tile + tile / 2;
  const py = state.player.r * tile + tile / 2;
  camera.normalX = clamp(px - camera.viewW / 2, 0, Math.max(0, camera.boardW - camera.viewW));
  camera.normalY = clamp(py - camera.viewH / 2, 0, Math.max(0, camera.boardH - camera.viewH));
  camera.previewX = camera.normalX;
  camera.previewY = camera.normalY;
  camera.mode = 'play';
  updatePreviewBtnUI();
  applyCameraTransform(true);
}

// 每次玩家移动后调用：安全区+前瞻跟随，只在普通模式下生效
function updateCamera(dir) {
  if (camera.mode !== 'play') return;
  const tile = tileSize();
  const DIR_VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const [ldx, ldy] = DIR_VEC[dir] || [0, 0];
  const px = state.player.c * tile + tile / 2 + ldx * tile * CAMERA_CFG.lead;
  const py = state.player.r * tile + tile / 2 + ldy * tile * CAMERA_CFG.lead;

  const marginX = camera.viewW * CAMERA_CFG.safeZone;
  const marginY = camera.viewH * CAMERA_CFG.safeZone;
  let camX = camera.normalX, camY = camera.normalY;
  const screenX = px - camX, screenY = py - camY;
  if (screenX < marginX) camX -= (marginX - screenX);
  if (screenX > camera.viewW - marginX) camX += (screenX - (camera.viewW - marginX));
  if (screenY < marginY) camY -= (marginY - screenY);
  if (screenY > camera.viewH - marginY) camY += (screenY - (camera.viewH - marginY));

  camera.normalX = clamp(camX, 0, Math.max(0, camera.boardW - camera.viewW));
  camera.normalY = clamp(camY, 0, Math.max(0, camera.boardH - camera.viewH));
  applyCameraTransform(false);
}

function reclampCamera() {
  syncViewport();
  camera.normalX = clamp(camera.normalX, 0, Math.max(0, camera.boardW - camera.viewW));
  camera.normalY = clamp(camera.normalY, 0, Math.max(0, camera.boardH - camera.viewH));
  const s = computePreviewScale();
  const pViewW = camera.viewW / s, pViewH = camera.viewH / s;
  camera.previewX = clamp(camera.previewX, 0, Math.max(0, camera.boardW - pViewW));
  camera.previewY = clamp(camera.previewY, 0, Math.max(0, camera.boardH - pViewH));
  applyCameraTransform(true);
}

function updatePreviewBtnUI() {
  // 只有真的缩小了(scale<1)才加目标点高亮描边，小图进暂停菜单时保持原样
  document.getElementById('board').classList.toggle('previewing', camera.mode === 'preview' && computePreviewScale() < 1);
}

function togglePreview() {
  camera.mode = camera.mode === 'preview' ? 'play' : 'preview';
  if (camera.mode === 'preview') {
    const s = computePreviewScale();
    const pViewW = camera.viewW / s, pViewH = camera.viewH / s;
    const centerX = camera.normalX + camera.viewW / 2;
    const centerY = camera.normalY + camera.viewH / 2;
    camera.previewX = clamp(centerX - pViewW / 2, 0, Math.max(0, camera.boardW - pViewW));
    camera.previewY = clamp(centerY - pViewH / 2, 0, Math.max(0, camera.boardH - pViewH));
  }
  updatePreviewBtnUI();
  applyCameraTransform(false);
}

// 预览模式下D-pad改为平移视口，不再控制玩家
function panPreview(dr, dc) {
  const tile = tileSize();
  const s = computePreviewScale();
  const step = tile * CAMERA_CFG.panStepTiles; // 平移的是地图原始坐标系里的固定距离，缩得越小视觉上跳得越不明显，符合直觉
  const pViewW = camera.viewW / s, pViewH = camera.viewH / s;
  camera.previewX = clamp(camera.previewX + dc * step, 0, Math.max(0, camera.boardW - pViewW));
  camera.previewY = clamp(camera.previewY + dr * step, 0, Math.max(0, camera.boardH - pViewH));
  applyCameraTransform(false);
}

function renderBoardStructure() {
  fitTileSize();
  const board = document.getElementById('board');
  const tile = tileSize();
  board.style.width = (state.width * tile) + 'px';
  board.style.height = (state.height * tile) + 'px';
  board.style.setProperty('--cols', state.width);
  board.style.setProperty('--rows', state.height);
  board.innerHTML = '';
  for (let r = 0; r < state.height; r++) {
    for (let c = 0; c < state.width; c++) {
      const key = r + ',' + c;
      const cell = document.createElement('div');
      if (state.walls.has(key)) {
        cell.className = 'cell wall';
      } else if (!state.inside.has(key)) {
        cell.className = 'cell void';
      } else if (state.targets.has(key)) {
        cell.className = 'cell target';
      } else {
        cell.className = 'cell floor';
      }
      board.appendChild(cell);
    }
  }
  state.boxEls = {};
  state.boxes.forEach(key => {
    const [r,c] = key.split(',').map(Number);
    const el = document.createElement('div');
    el.className = 'box' + (state.targets.has(key) ? ' done' : '');
    el.style.transform = `translate(${c * tileSize()}px, ${r * tileSize()}px)`;
    board.appendChild(el);
    state.boxEls[key] = el;
  });
  const p = document.createElement('div');
  p.className = 'player';
  p.id = 'playerEl';
  const sprite = document.createElement('div');
  sprite.className = 'sprite';
  sprite.id = 'playerSprite';
  sprite.style.backgroundImage = `url(${PLAYER_FRAMES[currentFrameKey()]})`;
  p.appendChild(sprite);
  p.style.transform = `translate(${state.player.c * tileSize()}px, ${state.player.r * tileSize()}px)`;
  board.appendChild(p);
}

function tileSize() {
  return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile'));
}

function renderDynamic() {
  const p = document.getElementById('playerEl');
  p.style.transform = `translate(${state.player.c * tileSize()}px, ${state.player.r * tileSize()}px)`;
  document.getElementById('playerSprite').style.backgroundImage = `url(${PLAYER_FRAMES[currentFrameKey()]})`;

  Object.entries(state.boxEls).forEach(([key, el]) => {
    if (!state.boxes.has(key)) { el.remove(); delete state.boxEls[key]; }
  });
  state.boxes.forEach(key => {
    if (!state.boxEls[key]) {
      const [r,c] = key.split(',').map(Number);
      const el = document.createElement('div');
      el.className = 'box' + (state.targets.has(key) ? ' done' : '');
      el.style.transform = `translate(${c * tileSize()}px, ${r * tileSize()}px)`;
      document.getElementById('board').appendChild(el);
      state.boxEls[key] = el;
    } else {
      const [r,c] = key.split(',').map(Number);
      const el = state.boxEls[key];
      el.className = 'box' + (state.targets.has(key) ? ' done' : '');
      el.style.transform = `translate(${c * tileSize()}px, ${r * tileSize()}px)`;
    }
  });
  document.getElementById('moveCount').textContent = t('moves', state.moves);
}

const MAX_QUEUE = 2; // 输入缓冲上限

// 所有输入的统一入口，动画播放中排队，播完依次消费；预览模式下改为平移视口
function requestMove(dr, dc, dir) {
  if (camera.mode === 'preview') { panPreview(dr, dc); return; }
  if (state.moveLock) {
    if (state.inputQueue.length < MAX_QUEUE) state.inputQueue.push({ dr, dc, dir });
    return;
  }
  tryMove(dr, dc, dir);
}

function processQueue() {
  if (state.inputQueue.length === 0) return;
  const next = state.inputQueue.shift();
  tryMove(next.dr, next.dc, next.dir);
  if (!state.moveLock) processQueue(); // 未触发动画锁则继续消费
}

function tryMove(dr, dc, dir) {
  state.dir = dir;
  const nr = state.player.r + dr;
  const nc = state.player.c + dc;
  const nkey = nr + ',' + nc;
  if (state.walls.has(nkey)) { renderDynamic(); scheduleIdle(); return; }

  if (state.boxes.has(nkey)) {
    const br = nr + dr, bc = nc + dc;
    const bkey = br + ',' + bc;
    if (state.walls.has(bkey) || state.boxes.has(bkey)) { renderDynamic(); scheduleIdle(); return; }
    setMoveDur(true);
    advanceGait(dir);
    lockMovement();
    pushHistory();
    state.boxes.delete(nkey);
    state.boxes.add(bkey);
    state.player = { r: nr, c: nc };
    state.moves++;
    state.moveLog.push(DIR_CH[dir]);
    markAutosaveDirty();
    const el = state.boxEls[nkey];
    if (el) {
      delete state.boxEls[nkey];
      state.boxEls[bkey] = el;
      el.classList.add('pushing');
    }
    renderDynamic();
    playBoxFx(el, dr, dc);
    scheduleIdle();
    updateCamera(dir);
    checkWin();
    return;
  }

  setMoveDur(false);
  advanceGait(dir);
  lockMovement();
  pushHistory();
  state.player = { r: nr, c: nc };
  state.moves++;
  state.moveLog.push(DIR_CH[dir]);
  markAutosaveDirty();
  renderDynamic();
  scheduleIdle();
  updateCamera(dir);
}

/* 箱子推动反馈(回弹)：推完一步，箱子在停下前的最后 ~30% 时间里往推的方向多滑一点(格子的 6%，52px 的格子约 3px)再退回来。
   用独立的 translate 属性做 WAAPI 动画，不和 transform 的位移过渡冲突；总时长 = 当步推箱时长，
   所以角色落脚(收脚帧)和箱子停稳同时发生。设置里(开发者模式)可关。 */
function playBoxFx(el, dr, dc) {
  if (settings.boxFx !== 'rebound' || !el || !el.animate) return;
  if (el._fx) { el._fx.cancel(); el._fx = null; }
  const over = tileSize() * 0.06;
  const at = (o) => `${dc * o}px ${dr * o}px`;
  el._fx = el.animate([
    { translate: '0 0', offset: 0 },
    { translate: '0 0', offset: 0.70 },
    { translate: at(over), offset: 0.86, easing: 'ease-out' },
    { translate: '0 0', offset: 1, easing: 'ease-in-out' }
  ], { duration: MOVE_DUR, easing: 'linear' });
  el._fx.onfinish = () => { el._fx = null; };
}

function lockMovement() {
  state.moveLock = true;
  if (state.moveLockTimer) clearTimeout(state.moveLockTimer);
  state.moveLockTimer = setTimeout(() => {
    state.moveLock = false;
    state.moveLockTimer = null;
    processQueue();
  }, MOVE_DUR);
}


function checkWin() {
  if (state.targets.size === 0) return; // 没有目标点的关卡，无过关判定
  if (state.won) return; // 防止过关动画等待期间重复触发
  let allDone = true;
  state.targets.forEach(t => { if (!state.boxes.has(t)) allDone = false; });
  if (allDone) {
    state.won = true;
    clearAutosave();
    state.inputQueue.length = 0;
    const idxAtWin = state.levelIndex;
    const meta = LEVEL_META[idxAtWin];
    const best = progress.cleared[meta.id];
    const isNewBest = best === undefined || state.moves < best;
    progress.cleared[meta.id] = isNewBest ? state.moves : best;
    saveProgress();
    updateLevelInfo();
    updateNavButtons();
    setTimeout(() => openWinPanel(idxAtWin, meta, state.moves, isNewBest, best), 500); // 留半拍看清最后一步落位，再弹石板
  }
}
// 过关石板：等玩家自己点「重试」或「下一关」，不再自动跳关(旧版本是1.1秒后自动跳)。
// 三星按本局步数/par 点亮(见 starsFor)，通关至少 1 星。
function openWinPanel(idxAtWin, meta, moves, isNewBest, best) {
  const nStars = starsFor(moves, meta.par);
  const perfect = isPerfect(moves, meta.par);
  const titleEl = document.getElementById('winTitle'); // 完美通关：标题换成「完美通关！」+ 金色，星星加光晕
  titleEl.dataset.i18n = perfect ? 'winPerfect' : 'winTitle';
  titleEl.textContent = t(titleEl.dataset.i18n);
  titleEl.classList.toggle('perfect', perfect);
  document.getElementById('winStars').classList.toggle('perfect', perfect);
  document.querySelectorAll('#winStars .ico').forEach((el, k) => {
    const on = k < nStars;
    el.classList.toggle('filled', on);
    el.style.setProperty('--ico', `url(${ICON_DIR}${on ? 'icon_star.svg' : 'icon_star_empty.svg'})`);
  });
  document.getElementById('winSteps').textContent = t('winSteps', moves);
  const bestEl = document.getElementById('winBest');
  if (best === undefined) { bestEl.textContent = ''; bestEl.style.visibility = 'hidden'; } // 第一次通关这关，没有旧纪录可比，不留空行
  else if (isNewBest) { bestEl.textContent = t('winNewBest'); bestEl.style.visibility = 'visible'; } // 破了旧纪录：用"新纪录"这行字，不重复念一遍数字
  else { bestEl.textContent = t('winBest', best); bestEl.style.visibility = 'visible'; }
  const hasNext = idxAtWin + 1 < LEVELS.length;
  if (!hasNext) { bestEl.textContent = (bestEl.textContent ? bestEl.textContent + ' · ' : '') + t('winAllDone'); bestEl.style.visibility = 'visible'; }
  document.getElementById('winButtons').classList.toggle('single', !hasNext);
  document.getElementById('app').classList.add('winShown');
  document.getElementById('winOverlay').classList.add('show');
  document.getElementById('winOverlay').dataset.idx = idxAtWin; // 供重试/下一关按钮读取，避免闭包捕获旧值
}
function closeWinPanel() {
  document.getElementById('winOverlay').classList.remove('show');
  document.getElementById('app').classList.remove('winShown');
}
bindTap(document.getElementById('winRetry'), () => {
  const idx = Number(document.getElementById('winOverlay').dataset.idx);
  closeWinPanel();
  loadLevel(idx);
});
bindTap(document.getElementById('winNext'), () => {
  const idx = Number(document.getElementById('winOverlay').dataset.idx);
  const meta = LEVEL_META[idx];
  closeWinPanel();
  const next = idx + 1;
  if (next < LEVELS.length) {
    const newChapter = LEVEL_META[next].chapter !== meta.chapter;
    loadLevel(next);
    if (newChapter) showToast(t('chapter', LEVEL_META[next].chapter + 1));
  }
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1000);
}

function undo() {
  if (history.length === 0) return;
  if (state.moveLockTimer) clearTimeout(state.moveLockTimer);
  state.moveLock = false;
  state.moveLockTimer = null;
  state.inputQueue.length = 0;
  const snap = history.pop();
  state.player = snap.player;
  state.boxes = snap.boxes;
  state.moves = snap.moves;
  state.moveLog.pop();
  markAutosaveDirty();
  renderBoardStructure();
  renderDynamic();
  updateCamera();
}

function resetLevel() { loadLevel(state.levelIndex); }

bindTap(document.getElementById('up'), () => requestMove(-1, 0, 'up'));
bindTap(document.getElementById('down'), () => requestMove(1, 0, 'down'));
bindTap(document.getElementById('left'), () => requestMove(0, -1, 'left'));
bindTap(document.getElementById('right'), () => requestMove(0, 1, 'right'));
// 分离式的四块键：由 DPAD_SPLIT_DEFS 生成(图形素材走 CSS 变量)，动作与十字的 up/down/left/right 同一套
(() => {
  const host = document.getElementById('dpadSplit');
  DPAD_SPLIT_DEFS.forEach(d => {
    const f = (suffix) => `url(${DPAD_DIR}dpad_element_${d.name}${suffix}.svg)`;
    const b = document.createElement('button');
    b.id = d.id; b.className = 'dkey dpiece'; b.dataset.dir = d.dir; b.setAttribute('aria-label', d.dir);
    b.style.cssText = `--tx:${d.tx};--ty:${d.ty};--m-fill:${f('_fill')};--m-ring:${f('')};--i-hl:${f('_highlight')};clip-path:polygon(${d.poly})`;
    b.innerHTML = '<i class="pBody"></i><i class="pRing"></i><i class="pHl"></i>';
    host.appendChild(b);
    bindTap(b, () => requestMove(d.dr, d.dc, d.dir));
  });
})();
// 按下反馈：手指按着时高亮(十字：#dpad 加 data-down；分离：那一块加 .on)，松手/移开/取消时去掉。动作本身仍由 bindTap 在 touchend 触发
(() => {
  const dpad = document.getElementById('dpad');
  document.querySelectorAll('#dpad .dkey').forEach((el) => {
    const dir = el.dataset.dir, split = el.classList.contains('dpiece');
    const on = () => { if (split) el.classList.add('on'); else dpad.dataset.down = dir; };
    const off = () => { if (split) el.classList.remove('on'); else if (dpad.dataset.down === dir) delete dpad.dataset.down; };
    el.addEventListener('touchstart', on, { passive: true });
    ['touchend', 'touchcancel'].forEach(ev => el.addEventListener(ev, off));
    el.addEventListener('mousedown', on);
    ['mouseup', 'mouseleave'].forEach(ev => el.addEventListener(ev, off));
  });
})();
bindTap(document.getElementById('undo'), undo);
/* ---------- 暂停 / 地图模式 ----------
   点右下角圆形按钮进入：棋盘切成全图预览(拖动查看)，D-pad/撤销/步数隐藏，四个选项排成一行悬在按钮上方；
   同一个按钮(此时是返回图标)再点一次退出。选项行只在暂停时才创建，退出即删除。 */
let paused = false;
function updateModeBtn() { document.getElementById('modeBtn').innerHTML = iconSVG(paused ? 'back' : 'map'); }
function removePauseRow() {
  const r = document.getElementById('pauseRow');
  if (r) r.remove();
}
function resetPauseUI() { // 换关/重来时调用：直接退出暂停模式(后面loadLevel会整体重排)
  paused = false;
  document.getElementById('app').classList.remove('paused');
  removePauseRow();
  updateModeBtn();
}
const PAUSE_ITEMS = [
  ['restart',  'Restart level', () => loadLevel(state.levelIndex)], // 直接重来，不再二次确认(按钮在最左边，不容易误碰)
  ['levels',   'Levels',        () => openLevelPick()],
  ['home',     'Home',          () => goHome()],
  ['settings', 'Settings',      () => openSettings()]
];
function buildPauseRow() {
  removePauseRow();
  const row = document.createElement('div');
  row.id = 'pauseRow';
  PAUSE_ITEMS.forEach(([name, label, fn]) => {
    const b = document.createElement('button');
    b.id = 'pause_' + name;
    b.setAttribute('aria-label', label);
    b.innerHTML = iconSVG(name);
    bindTap(b, fn);
    row.appendChild(b);
  });
  document.getElementById('controls').appendChild(row);
}
function setPause(on) {
  if (paused === on) return;
  paused = on;
  if (on) saveAutosaveNow(); // 点开暂停菜单时存一次
  document.getElementById('app').classList.toggle('paused', on);
  if (on) buildPauseRow(); else removePauseRow();
  if ((camera.mode === 'preview') !== on) togglePreview();
  updateModeBtn();
}
function goHome() { setPause(false); cameFromGame = true; showHomeScreen(); }
bindTap(document.getElementById('modeBtn'), () => setPause(!paused));
updateModeBtn();

window.addEventListener('resize', () => {
  fitTileSize();
  renderBoardStructure();
  renderDynamic();
  reclampCamera();
});

window.addEventListener('keydown', (e) => {
  if (document.getElementById('settingsOverlay').classList.contains('show')) {
    if (e.key === 'Escape') closeSettings();
    return;
  }
  if (document.getElementById('levelPickOverlay').classList.contains('show')) {
    if (e.key === 'Escape') closeLevelPick();
    return;
  }
  if (!document.getElementById('homeScreen').classList.contains('hide')) return; // 主页还开着，不响应游戏按键
  const map = { ArrowUp: [-1,0,'up'], ArrowDown:[1,0,'down'], ArrowLeft:[0,-1,'left'], ArrowRight:[0,1,'right'],
                w:[-1,0,'up'], s:[1,0,'down'], a:[0,-1,'left'], d:[0,1,'right'] };
  if (map[e.key]) { requestMove(...map[e.key]); e.preventDefault(); }
  if (e.key === 'z' && (e.metaKey || e.ctrlKey)) undo();
});

let touchStart = null;
let dragStart = null;
document.getElementById('board-wrap').addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
  if (camera.mode === 'preview') {
    dragStart = { x: t.clientX, y: t.clientY, px: camera.previewX, py: camera.previewY };
  }
}, { passive: true });
document.getElementById('board-wrap').addEventListener('touchmove', (e) => {
  if (camera.mode !== 'preview' || !dragStart) return;
  const t = e.touches[0];
  const dx = t.clientX - dragStart.x;
  const dy = t.clientY - dragStart.y;
  const s = computePreviewScale();
  const pViewW = camera.viewW / s, pViewH = camera.viewH / s;
  camera.previewX = clamp(dragStart.px - dx / s, 0, Math.max(0, camera.boardW - pViewW));
  camera.previewY = clamp(dragStart.py - dy / s, 0, Math.max(0, camera.boardH - pViewH));
  applyCameraTransform(true);
}, { passive: true });
document.getElementById('board-wrap').addEventListener('touchend', (e) => {
  if (camera.mode === 'preview') { touchStart = null; dragStart = null; return; } // 拖动已在touchmove里处理，预览模式下不再触发挪动/滑动移动
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  const absX = Math.abs(dx), absY = Math.abs(dy);
  const THRESH = 24;
  if (Math.max(absX, absY) < THRESH) { touchStart = null; return; }
  if (absX > absY) {
    requestMove(0, dx > 0 ? 1 : -1, dx > 0 ? 'right' : 'left');
  } else {
    requestMove(dy > 0 ? 1 : -1, 0, dy > 0 ? 'down' : 'up');
  }
  touchStart = null;
}, { passive: true });

document.addEventListener('contextmenu', (e) => e.preventDefault()); // 拦长按系统菜单

// 全局拦截touchstart压住双击放大镜；按钮已用bindTap在touchend派发，不受影响
// range滑块需要原生touch拖拽手势，排除在外，否则拖不动
document.addEventListener('touchstart', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'range') return;
  if (e.target.closest && e.target.closest('#levelPickSheet, #settingsSheet')) return; // 选关面板(滚动容器是sheet本身，不是list)/设置面板要能滚动
  e.preventDefault();
}, { passive: false });

// bindBackdropClose：遮罩层(点空白处关闭)专用。不能像内容按钮一样直接 bindTap 整个遮罩——那样会连点在
// 子元素(面板/按钮)上也一起触发关闭；这里手动判 e.target===overlay，且用 touchend 而不是 click，
// 原因和 bindTap 一样：真机上遮罩没在触屏白名单里，全局 touchstart 已 preventDefault，合成不出 click。
function bindBackdropClose(overlay, closeFn) {
  let touched = false;
  overlay.addEventListener('touchend', (e) => {
    if (e.target !== overlay) return;
    e.preventDefault(); touched = true; closeFn();
    setTimeout(() => { touched = false; }, 400);
  }, { passive: false });
  overlay.addEventListener('click', (e) => {
    if (touched) { touched = false; return; }
    if (e.target === overlay) closeFn();
  });
}
// bindTap: touchstart只拦手势，动作在touchend触发；click监听作桌面兜底，touched标记防重复
function bindTap(el, handler) {
  let touched = false;
  el.addEventListener('touchstart', (e) => {
    e.preventDefault();
  }, { passive: false });
  el.addEventListener('touchend', (e) => {
    e.preventDefault();
    touched = true;
    handler(e);
    setTimeout(() => { touched = false; }, 400);
  }, { passive: false });
  el.addEventListener('click', (e) => {
    if (touched) { touched = false; return; }
    handler(e);
  });
}

// 开发者模式：主页连点版本号7次(4秒内)开关。开启后设置里出现"高级"(慢动作、全部解锁)
let _dbgTaps = 0, _dbgTimer = null;
bindTap(document.getElementById('homeVersion'), () => {
  _dbgTaps++;
  clearTimeout(_dbgTimer);
  _dbgTimer = setTimeout(() => { _dbgTaps = 0; }, 4000);
  if (_dbgTaps >= 7) {
    _dbgTaps = 0;
    progress.debugMode = !progress.debugMode;
    if (!progress.debugMode) { progress.debugUnlock = false; }
    saveProgress();
    showToast(progress.debugMode ? t('devOn') : t('devOff'));
  }
});

window.addEventListener('load', relayoutBoard);
applyI18n();
loadInitialLevel();
</script>
